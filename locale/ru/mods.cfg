use-custom-express-transport-belt-color=Установить кастомный цвет для экспресс-конвейеров, экспресс-подземных конвейеров и экспресс-разделителей.
custom-express-transport-belt-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: 36c9ff

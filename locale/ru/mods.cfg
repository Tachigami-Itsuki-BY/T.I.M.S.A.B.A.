mdrn-chute-mode-none=Гравитационные лотки не будут созданы.
mdrn-chute-mode-basic-limited=Будут созданы базовые (ограниченные) лотки.\nОни работают за счет силы тяжести и будут загружать предметы до тех пор, пока не будет достигнут лимит загрузки машины.\n[color=yellow]Они не поддерживают фильтры.[/color]
mdrn-chute-mode-basic=Будут созданы базовые лотки.\nОни работают за счет силы тяжести и будут загружать предметы до тех пор, пока слот машины полностью не заполнится.\n[color=yellow]Они не поддерживают фильтры и не учитывают лимиты загрузки машин.[/color]
mdrn-chute-mode-filtered=Продвинутые лотки поддерживают фильтры, фильтрацию по отдельным полосам конвейера и могут быть индивидуально настроены на учет лимитов загрузки машин.
mdrn-chute-direction-input=Лоток может только загружать предметы с конвейера в контейнер.
mdrn-chute-direction-input-output=Лоток может как загружать предметы с конвейера в контейнер, так и выгружать их из контейнера на конвейер.
mdrn-enable-stacking-none=Погрузчики не смогут собирать предметы в пакеты на конвейере.
mdrn-enable-stacking-turbo-and-above=Только погрузчики быстрее экспресс-конвейеров смогут собирать предметы в пакеты.\n\nКоличество манипуляторов в рецептах будет выше, чем при значении «Нет».
mdrn-enable-stacking-all=Все погрузчики смогут собирать предметы в пакеты в соответствии с вашим уровнем технологии пакетирования.\n\nКоличество манипуляторов в рецептах будет выше, чем при значении «Нет».
mdrn-enable-stacking-stack-tier=Создает отдельный пакетный погрузчик с собственным рецептом и технологией. Для этого погрузчика требуются пакетные манипуляторы, и он сможет полностью заполнить ваш самый быстрый конвейер.
mdrn-keep-5d-loaders-none=Удалить погрузчики размеров 1x2 и 1x1 из мода 5Dim's. Использовать только погрузчики из Loaders Modernized.
mdrn-keep-5d-loaders-all=Сохранить погрузчики размеров 1x2 и 1x1 из модов 5Dim's в дополнение к погрузчикам из Loaders Modernized.
mdrn-keep-5d-loaders-1x2=Сохранить только погрузчики размера 1x2 из мода 5Dim's в дополнение к погрузчикам из Loaders Modernized.
mdrn-unlock-technology-separate=Погрузчики будут иметь собственную технологию для разблокировки рецептов.
mdrn-unlock-technology-belt=Рецепты погрузчиков будут открываться той же технологией, что и другие логистические предметы аналогичного тира.
mdrn-embiggen-assemblers-zero=Не изменять размер сборочных автоматов.
mdrn-embiggen-assemblers-eight=Увеличить размер сборочных автоматов на 8%.
mdrn-embiggen-assemblers-sixteen=Увеличить размер сборочных автоматов на 16%.

discovery-tree-mode-none=Показывать все технологии независимо от предварительных условий.
discovery-tree-mode-3-layers=Показывать технологию, если исследовано хотя бы одно предварительное условие её предварительного условия для предварительного условия (на 3 уровня назад).
discovery-tree-mode-2-layers=Показывать технологию, если исследовано хотя бы одно предварительное условие её предварительного условия (на 2 уровня назад).
discovery-tree-mode-single=Показывать технологию, если исследовано хотя бы одно её предварительное условие.
discovery-tree-mode-half=Показывать технологию, если исследована хотя бы половина её предварительных условий.
discovery-tree-mode-almost-all=Показывать технологию, если исследованы все предварительные условия, кроме одного.
discovery-tree-mode-all=Показывать технологию только тогда, когда исследованы все её предварительные условия.

orphan-finder-underground-mode-standard=Подземные трубы считаются оборванными, если у них есть любые неиспользуемые подземные соединения.
orphan-finder-underground-mode-strict=Подземные трубы считаются оборванными, если у них вообще нет подземных соединений.
orphan-finder-underground-mode-none=Проверка оборванных соединений для подземных труб отключена.

[strings]
mdrn-use-split-lanes=Раздельные фильтры для полос конвейера
mdrn-use-wfs=Ждать полной сборки пакета
mdrn-use-fill=Заполнять слоты машин полностью
mdrn-split-suffix=(Раздельно)
mdrn-wfs-suffix=(Ожидание пакета)
mdrn-fill-suffix=(Заполнение)
mdrn-add-loader-variants-tooltip=Добавить правила обновления для всех вариантов погрузчиков, которые соответствуют существующим базовым парам обновления погрузчиков в этом планировщике.
mdrn-remove-loader-variants-tooltip=Удалить правила обновления вариантов погрузчиков, чья базовая пара тира также присутствует в этом планировщике.
mdrn-compatibility-change=[color=yellow]Loaders Modernized[/color]: Изменился способ обеспечения совместимости со сторонними модами. Авторы модов теперь могут добавлять поддержку напрямую в свои моды либо через моды-аддоны.
mdrn-compatibility-removed=[color=yellow]Loaders Modernized[/color]: Похоже, в результате этого некоторые погрузчики были удалены. Для всех ранее поддерживаемых модов теперь доступны отдельные аддоны. Пожалуйста, сообщайте о любых проблемах на странице обсуждения Loaders Modernized.
mdrn-power-change=[color=yellow]Loaders Modernized[/color]: Энергопотребление увеличено. Теперь активные погрузчики будут потреблять как минимум на порядок больше энергии. При желании вы можете вернуться к более низкому энергопотреблению в настройках мода.
mdrn-chute-direction-change=[color=yellow]Loaders Modernized[/color]: Гравитационные лотки изначально предназначались только для загрузки предметов в контейнеры. Они работают за счет силы тяжести и не имеют логических схем для обнаружения заполнения машин, поэтому они будут осуществлять загрузку до полного заполнения слота. В стартовых настройках доступен параметр, добавляющий лоткам продвинутые функции (такие как фильтры и учет лимитов загрузки машин). В этом сохранении обнаружены лотки, выгружающие предметы из контейнеров на конвейеры. Настройка карты во время работы была изменена, чтобы разрешить лоткам выгрузку на конвейеры во избежание потери функциональности, но вам, возможно, стоит перестроить схему фабрики, если вы хотите использовать лотки по их прямому назначению.
mdrn-compatibility-removed-2=[color=yellow]Loaders Modernized[/color]: [color=red]НЕ СОХРАНЯЙТЕ ИГРУ![/color] Похоже, некоторые из ваших старых погрузчиков не были заменены новыми версиями. Скорее всего, это означает, что мод совместимости не был загружен либо моду, добавляющему тиры конвейеров (и добавлявшему погрузчики из [color=yellow]Loaders Modernized[/color]), требуется обновление.
mdrn-wfs-warning=[color=yellow]Loaders Modernized[/color]: В прошлой версии мы немного переусердствовали, принудительно добавив флаг «Ждать полной сборки пакета» вашим погрузчикам. Если вы хотите убрать его, вы можете сделать это индивидуально на каждом погрузчике. Также доступна консольная команда для удаления этого флага со всех погрузчиков и призраков mdrn на всех поверхностях/планетах: [color=blue]/mdrn-remove-wfs[/color]\nВам также стоит проверить настройки мода, чтобы убедиться, что поведение по умолчанию соответствует вашим предпочтениям для всех новых погрузчиков, которые вы будете размещать.
mdrn-deprecated-addon-warning=[color=yellow]Loaders Modernized[/color]: Мод-аддон [color=red]__1__[/color] устарел и больше не обновляется. Пожалуйста, удалите его из игры и перейдите на Loaders Modernized: Integrations.
mdrn-lu-removed-warn=[color=yellow]Loaders Modernized[/color]: Мод Loader Utils был удален, но стартовая настройка [color=red]Loader Utils migration[/color] не была включена. Любые погрузчики, измененные с помощью Loader Utils, [color=red]были безвозвратно утеряны[/color]. Для восстановления: [color=red]НЕ[/color] сохраняйте игру, включите стартовую настройку [color=yellow]Loaders Modernized: Loader Utils migration[/color], а затем перезапустите ваше сохранение, сделанное до изменения состава модов.
mdrn-lu-migration-complete=[color=yellow]Loaders Modernized[/color]: Миграция Loader Utils завершена. Погрузчиков перенесено на аналогичные варианты из Loaders Modernized: __1__ шт.
mdrn-lu-stacking-warn=[color=yellow]Loaders Modernized[/color]: В моде Loader Utils пакетирование было включено для всех погрузчиков. Ваш текущий [color=yellow]Режим пакетирования на конвейере[/color] не установлен на значение [color=yellow]Все[/color] — погрузчики, которые ранее имели функцию пакетирования, могли её потерять (вместе со связанными флагами «ждать полной сборки пакета»). Перед сохранением игры рекомендуем изменить настройки пакетирования и перезагрузиться, чтобы перенести и эти функции.
mdrn-lu-migration-reminder=[color=yellow]Loaders Modernized[/color]: Миграция Loader Utils завершена. Пожалуйста, отключите стартовую настройку [color=yellow]Loader Utils migration[/color], чтобы удалить вспомогательные объекты миграции из игрового мира.

[command-help]
mdrn-remove-wfs=Удаляет флаг «ждать полной сборки пакета» со всех погрузчиков и призраков mdrn на всех поверхностях/планетах.


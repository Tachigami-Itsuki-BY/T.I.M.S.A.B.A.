custom-ammo-turret-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: caa718
use-custom-electric-turret-color=Установить кастомный цвет для лазерных турелей.
custom-electric-turret-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: d92e2e
use-custom-fluid-turret-color=Установить кастомный цвет для огнеметных турелей.
custom-fluid-turret-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: eb7303
use-custom-wall-color=Установить кастомный цвет для стен.
custom-wall-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: cddacd
use-custom-gate-color=Установить кастомный цвет для ворот.
custom-gate-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: 808080

enhanced-shadows-separate-shadows=Заменяет определенные ванильные спрайты без отдельного слоя теней (например, трубы) на многослойные спрайты, содержащие слой переднего плана и слой тени. Улучшает внешний вид мода Enhanced Shadows, но может вызвать проблемы с совместимостью.
enhanced-shadows-change-planet-shadow-opacity=Изменяет непрозрачность теней на других планетах, чтобы лучше отражать уровни рассеивания атмосферного света, соответствующие их давлению.

mdrn-use-electricity=Если включено, погрузчикам потребуется электроэнергия для работы.
mdrn-double-recipe=Удваивает стоимость рецепта и производит по 2 погрузчика за раз, чтобы подземные конвейеры расходовались парами.
mdrn-chute-mode=Управляет доступностью гравитационного лотка и тем, поддерживает ли он фильтрацию.
mdrn-chute-direction=Управляет тем, ограничен ли лоток только загрузкой предметов в контейнеры или также может выгружать их на конвейеры. Это применимо только в том случае, если режим лотка установлен на «Базовый».
mdrn-enable-stack-loader=Включает рецепт для создания отдельного пакетного погрузчика со скоростью турбо-погрузчика. Предназначено для использования, когда пакетирование отключено для всех остальных погрузчиков.
mdrn-enable-stacking=Включить погрузчики с функцией пакетирования на конвейере.
mdrn-cheap-stacking=Если для пакетирования на конвейере выбрано значение «Все», использовать более дешевые рецепты погрузчиков без функции пакетирования.
mdrn-use-aai-graphics=Обнаружен мод AAI Loaders.\nИспользовать набор графики из AAI Loaders для Loaders Modernized.\n\nЭто предназначено для использования, когда в AAI Loaders «Режим работы» установлен на «Только графика».
mdrn-aai-fast-replace=Обнаружен мод AAI Loaders.\nЕсли включено, устанавливает группу быстрой замены для всех объектов AAI Loaders в соответствии с Loaders Modernized, позволяя быстро заменять их друг на друга.\n\n[color=yellow]Не имеет эффекта, если AAI Loaders работает в режиме «Только графика».[/color]
mdrn-use-aai-recipes=Обнаружен мод AAI Industry.\nИспользовать рецепты на основе AAI Industry для Loaders Modernized.
mdrn-keep-5d-loaders=Сохранить погрузчики из мода 5Dim's Transport в дополнение к погрузчикам из Loaders Modernized.
mdrn-keep-turbo-loader=Сохранить турбо-погрузчики в игре. Они имеют ту же скорость, что и погрузчики 4-го тира, но обходятся дороже.
mdrn-unlock-technology=Выберите, открывать ли погрузчики отдельной технологией или вместе с другими логистическими объектами того же тира.
mdrn-embiggen-assemblers=Увеличивает размер сборочных автоматов, чтобы погрузчики на углах визуально казались ближе к соединению с ними.
mdrn-oplp=Использовать оригинальное потребление энергии на один предмет (некоторые считают это имбой). Не имеет эффекта, если отключена настройка «Потребление электроэнергии».
mdrn-default-respect-insert-limits=Поведение погрузчиков по умолчанию при заполнении машин.
mdrn-default-wait-for-full-stack=Поведение по умолчанию для погрузчиков, которые умеют собирать предметы в пакеты.
mdrn-lu-migration=Если включено, создает вспомогательные объекты миграции, чтобы можно было перенести сохранения, в которых ранее были активны одновременно Loaders Modernized и Loader Utils. Отключите эту настройку после завершения миграции.

thorium-processing=Если включено, в игре появятся различные технологии и рецепты, связанные с переработкой тория. Требуется мод Bob's Ores. Включено по умолчанию.
artillery-shells=Если включено, в игре появятся ядерные и термоядерные артиллерийские снаряды, доступные для создания. Отключено по умолчанию.
clowns-centrifuging=Включить центрифугирование из MadClown's Nuclear.

utility-constant-max-fluid-flow-multiplier=Масштабирует максимальную скорость потока жидкости в машинах относительно ванильного стандартного значения в 100 за тик. Снизьте это значение, если столкнетесь с проблемами неравномерного распределения жидкостей.

picker-planner-height=Влияет на максимальную высоту меню планировщика до появления полосы прокрутки (в пикселях). Стандартное значение — 110px, что вмещает примерно два ряда кнопок.
picker-planner-width=Влияет на ширину меню планировщика. Значение задается в количестве столбцов (по 64px каждый). Стандартное значение — 6 столбцов. Если значение превысит размер экрана, появится горизонтальная полоса прокрутки.
picker-planner-sorter=Включает сортировку дополнительных чертежей и планировщиков сноса, добавленных другими модами.
picker-auto-sort-inventory=Включает автоматическую сортировку содержимого контейнеров. Отключите при игре с контейнерами очень большого размера.
picker-auto-circuit-bots=Строительные дроны автоматически подключают логические провода к объектам при их постройке.
picker-item-count=Включает или выключает отображение общего количества удерживаемых в руке предметов.
picker-use-bar-limit=Включает функцию кастомного интерфейса для ограничения вместимости сундуков.
picker-copy-between-surfaces=Разрешает копировать и вставлять содержимое сундуков между разными поверхностями и планетами. Может считаться читерством в Space Age. Если отключено, исходный и целевой сундуки должны находиться на той же планете, что и игрок.
picker-allow-multiple-craft=Создание предметов через пипетку также может использовать ресурсы напрямую из вашего инвентаря.
picker-player-paste-modifier=Дополнительный модификатор вставки: берет стандартный модификатор вставки рецептов и умножает его на это значение.
picker-search-light=Фонарь игрока автоматически направляется на объект, который выделил курсор.
picker-alt-mode-default=Включает режим Alt по умолчанию при первом запуске игры или при подключении к сетевой игре.
picker-camera-zoom=Уровень масштабирования, с которым рендерится сцена для скриншота.
picker-camera-aa=Включить сглаживание (Anti-aliasing) для скриншотов.
picker-camera-gui=Показывать элементы интерфейса (GUI) на скриншотах. Обратите внимание: на скриншоте элементы интерфейса могут располагаться не в тех же местах, что и в самой игре.
picker-remember-planner=Запоминать последний выбранный планировщик при их циклическом переборе.
picker-tool-tape-measure=Включить инструмент «Рулетка».
picker-tool-ore-eraser=Включить инструмент «Удаление руды».
picker-tool-camera=Включить инструмент «Камера для скриншотов».
picker-chat-color=Цвет чата по умолчанию для этого игрока при первом запуске или подключении к сетевой игре.
picker-character-color=Цвет персонажа по умолчанию для этого игрока при первом запуске или подключении к сетевой игре.
picker-revive-selected-ghosts-entity=Мгновенно восстанавливает выбранные призраки объектов, если у вас в руке есть соответствующий предмет.
picker-revive-selected-ghosts-upgrade=Мгновенно восстанавливает выбранные призраки обновлений (апгрейдов), если у вас в руке есть соответствующий предмет.
picker-revive-selected-ghosts-tile=Мгновенно восстанавливает выбранные покрытия пола, если у вас в руке есть соответствующий предмет.
picker-revive-ignore-quality=Игнорирует качество призраков объектов, покрытий и обновлений при ручном размещении. ВНИМАНИЕ: это уничтожает качество только при размещении покрытий пола.
picker-zapper=Включить функцию удаления планировщиков (уничтожает чертежи/планировщики, если выбросить их из инвентаря).
picker-tape-measure-clamp=Количество значащих цифр для округления измерений, сделанных рулеткой. По умолчанию: 4 цифры, значение 10 = без ограничений.

redrawn-connections-maraxsis=Отменяет изменения Мараксиса, сделанные модом Asteroid Belt, возвращая планету на ее исходное место во внутренней части Солнечной системы.
redrawn-connections-toggle=[ЭКСПЕРИМЕНТАЛЬНО] Попытка удалить космические маршруты, в которых путь AB -> BC почти параллелен прямому пути AC. В будущем могут быть добавлены новые параметры для настройки строгости этой проверки.\nПодробности читайте в разделе FAQ на портале модов.
redrawn-connections-multiplier=[ЭКСПЕРИМЕНТАЛЬНО] Применяет множитель расстояния к каждому маршруту планеты или космоса на основе их удаленности от солнца.\nЭтот множитель линейно масштабируется от орбиты Наувиса (1x) до орбиты Фульгоры (1.25x) и далее вплоть до границы Солнечной системы (2.5x).\nЛюбые маршруты к границе Солнечной системы получают множитель 4.85x (это сохраняет ванильное расстояние в 100 тыс. км между Аквило и границей Солнечной системы).

Redrawn-Space-Connections-route-length-multiplier=Применяется до того, как длина маршрутов будет округлена до ближайших 1000 км. Не применяется к маршрутам, длину которых другой мод специально взял под свой контроль.

researchproductivity-exponential=Стоимость исследований удваивается на каждом уровне, начиная с 4-го, вместо линейного увеличения на 2500. Эта настройка отключена по умолчанию.

charxpmod_enable_damage_attribs=Включает бонусы к броне, урону и критическим ударам. Отключите, если на поздних этапах игры у вас падает производительность (FPS/UPS).
charxpmod_xpinilevel=Количество опыта, необходимое для первого повышения уровня.
charxpmod_xpmult=Используется для построения таблицы опыта от 1-го уровня до максимального с помощью этого множителя.
charxpmod_xp_mp_reductor=На каждом уровне этот редуктор применяется к указанному выше множителю таблицы опыта.
charxpmod_afk=Максимальное время в минутах, которое игрок может находиться в AFK, прежде чем перестанет получать опыт. Значение 0 отключает это правило.
charxpmod_death_penal=Процент опыта, теряемый при смерти персонажа.
charxpmod_time_ratio_xp=Игроку начисляется пропорциональный опыт на основе проведенного в игре времени.
charxpmod_print_xp_user=Выводить весь полученный опыт в виде сообщений в чате.
charxpmod_xp_multiplier_bonus=Диапазон от 0.1 до 100.0.
charxpmod_xp_maxlevel=Диапазон 40-500 (по умолчанию 100).
charxpmod_xp_maxlevel_ability=Диапазон 10-50 (по умолчанию 20).
charxpmod_enable_potion_loot=Если включено, из гнезд врагов в качестве добычи могут выпадать RPG-зелья.

artillery-toggle=Выберите затрагиваемые объекты.
autogen-color=Выберите цвет.

ick-compatibility-mode=Включите этот параметр, если какой-то крупный глобальный мод делает невозможным доступ к определенным ярлыкам (shortcuts).
ick-tags=Выберите, что вы хотите видеть перед названиями ярлыков, добавленных этим модом: теги, иконки или ничего.\n\nВ меню настроек теги будут видны всегда.

ick-prepare-uninstall=[img=utility.danger_icon] Будьте осторожны! Эта настройка включит все отключенные элементы снаряжения во всем сохранении. Вы можете ввести один из следующих четырех вариантов:\n\n- [color=yellow]uninstall[/color] = Позволяет безопасно удалить этот мод. \n- [color=yellow]active-defense-equipment[/color] = Включает все персональные лазерные защиты, позволяя безопасно отключить настройку __1__. \n- [color=yellow]belt-immunity-equipment[/color] = Включает все модули защиты от конвейеров, позволяя безопасно отключить настройку __2__. \n- [color=yellow]night-vision-equipment[/color] = Включает все приборы ночного видения, позволяя безопасно отключить настройку __3__.\n\nЕсли вы удалите мод или отключите вышеупомянутые настройки, предварительно не воспользовавшись этим параметром, все отключенное снаряжение будет безвозвратно утеряно.

show-max-underground-distance-on-hover=Показывать максимальную длину подземного соединения при наведении курсора на уже размещенный конвейер или трубу.

sp-interval=Равномерно распределяет задачи по обновлению всех солнечных панелей и аккумуляторов на ВСЕХ поверхностях в пределах [color=blue]интервала обновления[/color] [мин. 1 (1 с), макс. 3600 (1 ч)]
sp-multiplier=Величина бонусов, применяемых к аккумуляторам и солнечным панелям.\n[font=var]По умолчанию: [/font]3\n[font=var]Минимум: [/font]1\n[font=var]Максимум: [/font]10

vp-scale-min=Минимальный множитель масштаба относительно Наувиса для планеты с очень слабой гравитацией.
vp-scale-max=Максимальный множитель масштаба относительно Наувиса для планеты с очень высокой гравитацией.
vp-scale-enable-rotation-multiplier=Включает корректировку скорости вращения на основе длительности цикла дня и ночи планеты относительно аналогичного цикла на Наувисе. Более короткие сутки приводят к более быстрому вращению, а более длинные — к более медленному.
vp-scale-min-moon=Минимальный масштаб вращающихся на орбите планет/лун, добавленных через PlanetsLib. Коэффициент масштабирования этого мода умножается на настройку «Масштаб фоновых космических тел» мода Visible Planets.
vp-scale-max-moon=Максимальный масштаб вращающихся на орбите планет/лун, добавленных через PlanetsLib. Коэффициент масштабирования этого мода умножается на настройку «Масштаб фоновых космических тел» мода Visible Planets.

visible-planets-regen-renders=Работает только прямо в игре! Включите этот параметр, чтобы удалить все текущие рендеры планет и сгенерировать их заново с новыми настройками. Это необходимо только для обновления платформ, которые не могут двигаться; автоматизированные платформы обновятся сами при отправлении. (После выполнения эта настройка автоматически отключится.)
visible-planets-planet-pos-x=Позиция покоя для рендерируемой планеты. Отрицательные значения сместят планету влево.
visible-planets-planet-pos-y=Позиция покоя для рендерируемой планеты. Отрицательные значения сместят планету на север/вверх.
visible-planets-planet-init-dist=Начальное расстояние до планеты при прибытии. Планета появится на этом расстоянии выше своей позиции покоя, а затем опустится на неё. Расстояние при отправлении просто вдвое больше этого значения.
visible-planets-planet-init-scale=Начальный масштаб планеты при появлении/исчезновении. По умолчанию установлен на 0, чтобы скрыть моменты создания и удаления. Ограничен конечным масштабом; если они равны, планета фактически не будет масштабироваться во время анимации.
visible-planets-planet-scale=Масштаб покоя для рендерируемой планеты. Большие значения приведут к пикселизации планеты, хотя стандартное значение уже равно 6x. Вы можете уменьшить его, чтобы получить планету меньшего размера, но более четкого вида.
visible-planets-planet-anim-dur=Длительность анимации планеты в тиках. Чем меньше значение, тем быстрее будет двигаться планета. (60 тиков = 1 секунда)
visible-planets-planet-angle=Спрайт планеты будет повернут по часовой стрелке на указанное количество градусов. Должно быть в диапазоне от 0 до 359. Если вы используете этот параметр, вам, скорее всего, захочется отключить вращение планеты.
visible-planets-enable-parallax=Включить эффект параллакса для отображаемых планет. Это заставит планету слегка смещаться, когда вы осматриваетесь вокруг, добавляя ощущение глубины.
visible-planets-disable-mp-parallax=Отключает параллакс в сетевой игре, так как он может вести себя странно у всех игроков, кроме хоста. Перекрывает настройку выше.
visible-planets-parallax-factor=Сила эффекта параллакса. Более высокие значения заставят планету двигаться меньше, более низкие — больше. Минимальное значение: 0.1.
visible-planets-enable-rotation=Включить вращение отображаемых планет. Это заставит планету вращаться вокруг своего центра. Выглядит самую малость непривычно.
visible-planets-rotation-speed=Скорость вращения планеты в градусах за тик. Чем выше значение, тем быстрее планета будет вращаться по часовой стрелке. Должно быть в диапазоне от -180 до 180. (Хотя 180 — это КРАЙНЕ быстро, значение по умолчанию: 0.01)
visible-planets-override-show-planets=Другие моды могут запрещать рендеринг определенных локаций, например, поясов астероидов. Включите эту настройку, чтобы принудительно отображать вообще все локации (при условии, что у локации есть спрайт, который игра способна отрендерить).
visible-planets-planetslib-compat=Если включено, луны из сторонних модов будут показывать за собой свою родительскую планету, а планеты с лунами аналогичным образом будут отображать свои луны. (Для работы это обязательно должна быть луна из PlanetsLib.)
visible-planets-planetslib-scale=Масштаб космических тел, отображаемых через совместимость с PlanetLib, относительно родительского тела.
visible-planets-planetslib-x=Позиция X для первого фонового рендера. Для планет с несколькими лунами дополнительные рендеры будут генерироваться относительно этой позиции.
visible-planets-planetslib-y=Позиция Y для первого фонового рендера. Для планет с несколькими лунами дополнительные рендеры будут генерироваться относительно этой позиции.
visible-planets-planetslib-dist=Расстояние от центра родительского тела для рендеров совместимости с PlanetLib. При низких значениях фоновые тела будут рендериться под основной планетой.
visible-planets-planetslib-init-angle=Начальный угол для первого фонового рендера в градусах. Не особо полезно, если включено вращение планет, но пригодится в других случаях.
visible-planets-planetslib-spacing-mult=По умолчанию спутники распределяются равномерно вокруг родительского тела. Множители меньше 1 сблизят их друг с другом. Значения больше 1 приведут к неравномерным промежуткам.
visible-planets-planetslib-tint=Более низкие значения сделают фоновые рендеры темнее. Значение 1 будет рендерить их в обычном цвете.
visible-planets-enable-blur=Применяет эффект размытия к спрайтам видимых планет. Может вызвать проблемы с производительностью.
visible-planets-blur-intensity=Управляет интенсивностью эффекта размытия. Чем выше значение, тем более размытой будет планета.

inserter-throughput-enabled=Определяет, отображать ли пропускную способность манипуляторов.
inserter-throughput-rounding-precision=Максимальное количество знаков после запятой. Установите 0, чтобы отключить округление.
inserter-throughput-show-toggle=Показывает кнопку в левом верхнем углу, которая отображает состояние параметра «Включено» и позволяет менять его без захода в настройки мода.

pv-entities-per-tick=Высокие значения увеличат нагрузку на UPS (количество обновлений в секунду), особенно при использовании оверлея.

resource-patch-organizer-lock-surface=Ограничить сбор и размещение ресурсов только одной текущей поверхностью
resource-patch-organizer-allow-fluids=Разрешить органайзеру ресурсов собирать жидкости
resource-patch-organizer-allow-solids=Разрешить органайзеру ресурсов собирать твердые ресурсы
resource-patch-organizer-fluid-grid=Шаг сетки для жидкостей. Нефтяные вышки имеют размер 3x3. Значение 6 означает зазор в 3 клетки между вышками.
resource-patch-organizer-special-ore-grid=Количество клеток между зданиями. В основном используется для буровых установок SE и карьеров K2
resource-patch-organizer-grid-spacing=Размер зазора в клетках между нефтяными вышками и другими модифицированными зданиями, которые размещаются на одиночных ресурсных жилах
resource-patch-organizer-allow-mixing=Разрешает смешанное размещение рудных жил рядом с другими рудами
resource-patch-organizer-debug=Выводит дополнительную информацию при сборе или размещении ресурсов. Используйте только для отладки.

concrete-prep-remove-trees=Определяет, следует ли автоматически помечать деревья на снос при укладке бетона под ними.
concrete-prep-remove-rocks=Определяет, следует ли автоматически помечать камни на снос при укладке бетона под ними.
concrete-prep-remove-cliffs=Определяет, следует ли автоматически помечать скалы на снос при укладке бетона под ними.

fh-set-filter-on-inserter=Включает галочку «Использовать фильтры» при настройке фильтра для манипулятора.
fh-default-item-on-splitter=Имя предмета, который всегда будет отображаться на разделителях (например, deconstruction-planner). Оставьте пустым, чтобы отключить.
fh-add-fuel-items=Добавляет совместимые виды топлива и результаты их сгорания, даже если они не указаны на входе или выходе рецепта.
fh-show-only-unlocked-qualities=Сборщик с модулями качества не будет показывать в фильтрах результатов качество выше, чем уже исследовано игроком.

inventory-repair-interval=Как часто выполнять ремонт (в тактах). Объем ремонта за интервал корректируется, поэтому общая скорость не меняется. Меньшие значения могут снизить производительность.\n\n[color=blue]По умолчанию:[/color] __1__\n[color=blue]Минимум:[/color] __2__
inventory-repair-order=Выбор между самым быстрым или самым медленным ремкомплектом. Инструменты с бесконечной прочностью и максимальной скоростью всё равно будут выбираться первыми, независимо от этой настройки.

orphan-finder-search-range=Радиус поиска (в клетках) во всех направлениях для обнаружения оборванных подземных труб или конвейеров.
orphan-finder-underground-mode=Способ оценки оборванных подземных труб.


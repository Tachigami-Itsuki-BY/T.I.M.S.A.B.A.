[item-description]
zy-unichest=Сундук с общим инвентарем для выбранного предмета. Задайте фильтр предмета в интерфейсе (GUI), скопируйте настройки с привязанного автомата или используйте инструмент выделения.
zy-unipipe-fill=Труба, которая наполняет общее хранилище выбранной жидкостью. Задайте фильтр жидкости в интерфейсе (GUI), скопируйте настройки с привязанного автомата или используйте инструмент выделения.
zy-unipipe-extract=Труба, которая извлекает выбранную жидкость из общего хранилища. Задайте фильтр жидкости в интерфейсе (GUI), скопируйте настройки с привязанного автомата или используйте инструмент выделения.


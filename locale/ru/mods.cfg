panel-title=Справка

getting-start=Начало работы
getting-start-desc=Ознакомьтесь со справкой по настройкам мода перед его использованием.

quick-start=Быстрый старт
quick-start-desc=Вы можете создать свой первый производственный блок во вкладке «Производственная линия».\nЕсли нужный рецепт не отображается, включите различные фильтры - скорее всего, он скрыт.
quick-start-1=Нажмите кнопку «Добавить производственную линию».
quick-start-2=Нажмите кнопку «Добавить рецепт».
quick-start-3=Выберите рецепт в окне выбора рецептов.
quick-start-4=Нажмите на иконку продукта на выходе, чтобы открыть панель редактирования продукта.
quick-start-5=Задайте желаемое количество продукта и нажмите ENTER или кнопку OK для подтверждения.
quick-start-6=Нажмите на желтую иконку в столбце «Ингредиенты», чтобы добавить следующий связанный рецепт.
quick-start-7=Используйте кнопки управления строкой для её настройки.
quick-start-8=Нажмите на серую иконку в строке рецепта, чтобы открыть редактор рецептов, или на синюю иконку, чтобы открыть подблок.
quick-start-9=Используйте иконку навигации для перемещения между подблоками.

getting-start-panel=Описание панели Helmod
getting-start-panel-1=Верхняя панель и специальные меню
getting-start-panel-2=Меню таблицы расчетов
getting-start-panel-3=Переключатель таблиц (производственных линий)
getting-start-panel-4=Навигатор по подблокам
getting-start-panel-5=Строка данных таблицы расчетов

mod-settings=Настройки мода
mod-settings-desc=Чтобы открыть настройки мода, нажмите [ESC], выберите «Настройки», а затем «Настройки модов».

mod-settings-map=Настройки мода (карта)
mod-settings-map-1=Включить отладку вычислителя: добавляет кнопку для просмотра шагов расчета.
mod-settings-map-2=Шаг пользовательского кэша: определяет скорость создания кэша пользователя. Высокие значения могут снизить производительность в сетевой игре.
mod-settings-map-3=Показывать все листы: позволяет администратору видеть листы всех игроков.
mod-settings-map-4=Фильтр по переведенным строкам:
mod-settings-map-5=Фильтр при изменении текста: автоматическое применение фильтра при вводе текста в окне выбора. Может потребоваться отключить в сетевой игре.
mod-settings-map-6=Фильтр по заводам: если вы не видите заводы в редакторе рецептов, отключите этот фильтр. Это отобразит все доступные объекты в группе.
mod-settings-map-7=Фильтр по маякам: если вы не видите маяки в редакторе рецептов, отключите этот фильтр. Это отобразит все доступные объекты в группе.
mod-settings-map-8=Ограничения модулей в заводах: в некоторых модах ограничения на модули отсутствуют. Отключение этой опции позволит использовать модули продуктивности везде.
mod-settings-map-9=Ограничения модулей в маяках: в некоторых модах ограничения на модули отсутствуют. Отключение этой опции позволит использовать модули продуктивности везде.
mod-settings-map-10=Отображение специальных панелей: скрытые панели используются для просмотра параметров объектов Factorio или тестирования фильтров (отладка).
mod-settings-map-11=Показывать скрытые столбцы: столбцы «Индекс», «ID», «Тип» и «Название» по умолчанию скрыты (отладка).

mod-settings-player=Настройки мода (игрок)
mod-settings-player-1=Коэффициент ширины интерфейса: настройка ширины отображения панелей мода.
mod-settings-player-2=Коэффициент высоты интерфейса: настройка высоты отображения панелей мода.
mod-settings-player-3=Отображать главную иконку: позволяет скрыть верхнюю иконку мода, если она вам не нужна.
mod-settings-player-4=Режим отображения ячеек: изменяет формат отображения всех числовых значений.
mod-settings-player-5=Шаг перемещения строки: определяет, на сколько строк вверх/вниз перемещается элемент при комбинации Shift + Клик.

preferences=Настройки интерфейса

preferences-general=Общие
preferences-general-desc=Общие настройки в основном управляют внешним видом интерфейса.
preferences-general-1=Уровень завода по умолчанию: автоматический выбор самого быстрого или самого медленного завода при выборе рецепта.
preferences-general-2=Формат чисел заводов: выберите количество знаков после запятой для отображения количества заводов.
preferences-general-3=Формат чисел элементов: выберите количество знаков после запятой для отображения количества предметов/жидкостей.
preferences-general-4=Количество строк для прокрутки: число отображаемых строк в списках до появления полосы прокрутки.
preferences-general-5=Количество столбцов для прокрутки: число отображаемых столбцов в списках до появления полосы прокрутки.
preferences-general-6=Порядок отображения продуктов: порядок вывода продуктов или ингредиентов в строке рецепта.
preferences-general-7=База столбцов продуктов: влияет на количество отображаемых столбцов продуктов. Избыточные элементы переносятся на новую строку.
preferences-general-8=База столбцов ингредиентов: влияет на количество отображаемых столбцов ингредиентов. Избыточные элементы переносятся на новую строку.
preferences-general-9=Отображение загрязнения: включить или отключить показ вырабатываемого загрязнения.
preferences-general-10=Отображение строений: включить или отключить показ необходимых строений.

preferences-ui=Интерфейс
preferences-ui-desc=Параметры интерфейса позволяют настроить поведение всплывающих панелей и окон.
preferences-ui-1=Автозакрытие панелей: автоматически закрывает старые панели при открытии любой новой.
preferences-ui-2=Привязка интерфейса: прикрепляет дополнительные панели к правому краю главного окна мода.
preferences-ui-3=Смещение привязки интерфейса: расстояние от правого верхнего угла главного окна.

preferences-module-priority=Приоритет модулей
preferences-module-priority-desc=Настройка приоритета модулей, которая автоматически применяется в панели редактирования рецептов.

preferences-items-logistic=Логистика предметов по умолчанию
preferences-items-logistic-desc=Выбор предпочтительных логистических элементов для отображения в подсказках или меню логистики.

preferences-fluids-logistic=Логистика жидкостей по умолчанию
preferences-fluids-logistic-desc=Выбор предпочтительных элементов для транспортировки жидкостей для отображения в подсказках или меню логистики.

recipe-selector=Выбор рецептов
recipe-selector-desc=В моде есть несколько видов меню выбора, но в этом разделе описано именно окно выбора рецептов. Выбранный рецепт мгновенно добавляется в текущий или создаваемый «Производственный блок».

recipe-selector-normal=Выбор без отображения скрытого
recipe-selector-normal-desc=Когда этот режим отключен, видны только исследованные рецепты. Перевод названий выполняется при открытии панели в течение нескольких тиков. В сетевой игре вам может потребоваться уменьшить параметр «Шаг пользовательского кэша», если у какого-то игрока возникают проблемы с использованием мода.
recipe-selector-normal-1=Фильтр по продуктам или ингредиентам: определяет, искать ли рецепт по продуктам или по ингредиентам, если заполнено поле фильтра.
recipe-selector-normal-2=Переведенные названия или английские названия (системные): поле фильтра поддерживает поиск по локализованным именам (если перевод существует).
recipe-selector-normal-3=Показывать отключенные: позволяет увидеть все отключенные рецепты - в основном те, что еще не исследованы, но этот статус могут иметь и другие рецепты.
recipe-selector-normal-4=Показывать скрытые: позволяет увидеть все скрытые рецепты. Например, без этой опции рецепт «Часть ракеты» не будет отображаться.
recipe-selector-normal-5=Показывать скрытые рецепты ручного создания: позволяет увидеть все скрытые рецепты для крафта персонажем. Некоторые моды скрывают рецепты в стандартном меню крафта; включение этой опции может усложнить чтение списка, так как все рецепты будут продублированы.
recipe-selector-normal-6=Фильтр: введите название искомого продукта или ингредиента в соответствии с первым фильтром. С опцией «Автоматический фильтр» поиск будет реагировать на ввод текста на лету.
recipe-selector-normal-7=Список группы рецептов «Helmod» является вымышленным набором рецептов.

recipe-selector-all=Выбор с отображением скрытого
recipe-selector-all-desc=Когда этот режим включен, доступны абсолютно все рецепты.
recipe-selector-all-1=Исследованный рецепт отображается обычной иконкой.
recipe-selector-all-2=Неисследованный рецепт отображается красной иконкой.

recipe-selector-helmod=Группа Helmod
recipe-selector-helmod-desc=Helmod добавляет виртуальные (фиктивные) рецепты, используемые в определенных ситуациях. Они собраны в группу рецептов «Helmod». На них есть маленькая шестеренка, при наведении на которую выводится подсказка.
recipe-selector-helmod-1=Рецепт ресурса: обеспечивает доступ, например, к расчетам добычи буровыми установками.
recipe-selector-helmod-2=Рецепт с отходами сгорания: содержит остаточные продукты сгорания/распада, например, отработанный урановый стержень.
recipe-selector-helmod-3=Рецепт ракеты: содержит элементы, производимые при запуске ракеты, а также необходимые для этого ингредиенты.

recipe-editor=Панель редактора рецептов
recipe-editor-desc=В этом разделе описано, как пользоваться редактором рецептов.

recipe-editor-general=Описание редактирования рецепта
recipe-editor-general-desc=Редактирование рецептов - одно из самых важных меню. Здесь вы найдете информацию о выбранном заводе, в основном о его скорости. Если ваш завод использует топливо, вы сможете выбрать его, и оно появится в расчете рецепта.\nЕсли настройки ваших модулей превышают игровой лимит, у соответствующего параметра завода появится иконка предупреждения. Такое бывает с некоторыми модами, которые слишком сильно разгоняют машины.
recipe-editor-general-1=Описание рецепта.
recipe-editor-general-2=Выбор завода и его параметры.
recipe-editor-general-3=Выбор модулей завода.
recipe-editor-general-4=Выбор маяка (диффузора) и его параметры.
recipe-editor-general-5=Выбор модулей маяка.
recipe-editor-general-6=Настройки маяка.

recipe-editor-info=Информация о рецепте
recipe-editor-info-desc=В этом разделе вы найдете параметры самого рецепта.
recipe-editor-info-1=Поле «Производство %» указывает долю использования рецепта, что позволяет балансировать цепочки производства.
recipe-editor-info-2=Установив 50% для рецепта, расчет будет вестись на покрытие лишь половины потребности. Это нужно, например, чтобы позволить следующему рецепту произвести оставшуюся часть.

recipe-editor-factory=Информация о заводе
recipe-editor-factory-desc=В этом разделе вы найдете параметры завода.
recipe-editor-factory-1=Выбор завода и меню распространения этого выбора на другие блоки.
recipe-editor-factory-2=Информация о заводе и селектор топлива (если применимо).
recipe-editor-factory-3=Модули завода и меню распространения их конфигурации.
recipe-editor-factory-4=Инструмент для выбора модулей.

recipe-editor-beacon=Информация о маяке
recipe-editor-beacon-desc=В этом разделе вы найдете параметры маяка.
recipe-editor-beacon-1=Выбор маяка и меню распространения этого выбора на другие блоки.
recipe-editor-beacon-2=Информация о маяке и настройки для применения его эффектов и их количества по отношению к числу заводов.
recipe-editor-beacon-3=Модули маяка и меню распространения их конфигурации.
recipe-editor-beacon-4=Инструмент для выбора модулей.

recipe-editor-tools=Панель инструментов
recipe-editor-tools-desc=Панель инструментов позволяет быстро назначать параметры заводов или устанавливать конфигурацию по умолчанию для последующих добавляемых рецептов. Распространение настроек в сочетании с приоритетом модулей - это быстрый и простой способ настроить всю производственную линию. При смене типа завода выбранные модули будут применены к новому зданию, если это возможно.
recipe-editor-tools-1=Завод по умолчанию: сохраняет выбранный завод как дефолтный.
recipe-editor-tools-2=Распространить выбор завода на текущий блок (если возможно).
recipe-editor-tools-3=Распространить выбор завода на все блоки в производственной линии (если возможно).
recipe-editor-tools-4=Опция распространения: игнорировать категорию рецептов.
recipe-editor-tools-5=Опция распространения: применять только к рецептам того же типа, что и текущий.
recipe-editor-tools-6=Опция распространения: применять вместе с выбранными модулями (если выбран приоритет модулей, применится он).
recipe-editor-tools-7=Модули по умолчанию: сохраняет текущий набор модулей как дефолтный.
recipe-editor-tools-8=Распространить выбор модулей на текущий блок (если возможно).
recipe-editor-tools-9=Распространить выбор модулей на все блоки в производственной линии (если возможно).
recipe-editor-tools-10=Удалить все модули.

recipe-editor-module-selection=Выбор модулей
recipe-editor-module-selection-desc=Селектор модулей позволяет вручную добавлять модули поштучно в выбранный объект.
recipe-editor-module-selection-1=Список примененных модулей.
recipe-editor-module-selection-2=Кнопка переключения на меню ручного выбора модулей.
recipe-editor-module-selection-3=Модули, применимые для этого рецепта или завода, доступны для добавления в один клик.
recipe-editor-module-selection-4=Модули, несовместимые с этим рецептом или заводом, подсвечены красным.

recipe-editor-module-priority=Приоритет модулей
recipe-editor-module-priority-desc=Приоритет модулей позволяет заполнять слоты быстро и без лишних действий. Правильно настроив приоритеты, вы сможете экипировать всю производственную линию в один клик.\nКак это работает: система пытается заполнить слоты первым модулем в списке в указанном количестве. Если слоты еще остались, она переходит к следующему модулю в списке приоритетов и так далее.\nПример для ванильной игры: если в приоритетах выбрать [item=productivity-module-3]x10, а вторым пунктом [item=speed-module-3]x10 и распространить это на всю линию - вы получите идеальную оптимизацию в один клик. Заводы промежуточных продуктов (где разрешена продуктивность) заполнятся модулями [item=productivity-module-3], а остальные здания - модулями [item=speed-module-3].
recipe-editor-module-priority-1=Список примененных модулей.
recipe-editor-module-priority-2=Кнопка перехода в меню настроек интерфейса для конфигурации списков приоритетов.
recipe-editor-module-priority-3=Модули, подходящие для текущего рецепта или завода, остаются доступными для клика.
recipe-editor-module-priority-4=Кнопка применения выбранного приоритета.
recipe-editor-module-priority-5=Выбор конкретного профиля конфигурации приоритетов.
recipe-editor-module-priority-6=Кнопка переключения на меню приоритетов модулей.

production=Производственная линия и блок
production-desc=В этом разделе описываются панели производственной линии и производственного блока.

production-line=Производственная линия
production-line-desc=Производственная линия - это набор производственных блоков, необходимых для сборки ракеты или любого другого конечного продукта.
production-line-1=Группа иконок для смены вкладки.
production-line-2=Группа иконок для добавления рецепта.
production-line-3=Группа иконок для действий с данными: копирование, обмен, удаление или обновление.
production-line-4=Группа иконок для редактирования и настройки интерфейса.
production-line-5=Группа иконок для настройки отображения логистических параметров прямо в строках.
production-line-6=Настройка базового времени для расчетов.
production-line-7=Панель выбора производственной линии.
production-line-8=Общая информация и настройка прав доступа для производственной линии.
production-line-9=Элементы на выходе производственной линии.
production-line-10=Элементы на входе производственной линии.
production-line-11=Список производственных блоков.

production-block=Производственный блок
production-block-desc=Производственный блок - это список рецептов, сгруппированных для производства конкретного предмета.\nРекомендуется разделять рецепты на несколько блоков и связывать их между собой. Блок можно представить как чертеж для постройки, который можно дублировать сколько угодно раз (особенно при использовании ограничения на количество заводов - число повторений блока будет указано в его информации).
production-block-1=Группа иконок для смены вкладки.
production-block-2=Группа иконок для добавления рецепта.
production-block-3=Группа иконок для действий с данными: копирование, обмен, удаление или обновление.
production-block-4=Группа иконок для закрепления панели или просмотра сводки.
production-block-5=Специальное меню для отладки вычислителя (по умолчанию скрыто).
production-block-6=Группа иконок для редактирования и настройки интерфейса.
production-block-7=Группа иконок для настройки отображения логистических параметров прямо в строках.
production-block-8=Настройка базового времени для расчетов.
production-block-9=Панель навигации по различным блокам текущей производственной линии.
production-block-10=Параметры и режимы расчета для производственного блока.
production-block-11=Общая информация о производственном блоке.
production-block-12=Элементы на выходе производственного блока.
production-block-13=Элементы на входе производственного блока.
production-block-14=Список рецептов.

production-edition=Редактирование производственной линии
production-edition-desc=Меню редактирования производственной линии позволяет добавлять примечания, указывать группу и настраивать общий доступ.
production-edition-1=Информация указывает на владельца таблицы расчетов производственной линии.
production-edition-2=Настройки совместного доступа используются для обмена листами в многопользовательской игре.
production-edition-3=Группа позволяет быстрее находить нужные производственные линии на панели меню с помощью всплывающих подсказок.
production-edition-4=Примечание - это свободное текстовое поле для любой вашей информации.

compute=Расчеты
compute-desc=Чтобы эффективно использовать мод, необходимо понять, как именно он производит вычисления. После этого всё станет очень просто.

compute-order=Порядок расчетов
compute-order-desc=Расчет выполняется строго строка за строкой, начиная с самой первой.
compute-order-1=Система проверяет, нет ли продуктов, которые одновременно являются ингредиентами для того же элемента, и разрешает редактирование количества этого продукта.
compute-order-2=Система берет первый рецепт.
compute-order-3=Система перебирает продукты рецепта в цикле и рассчитывает параметры этого рецепта.
compute-order-4=Система суммирует количество необходимых ингредиентов в кэше и учитывает потребление произведенного продукта.
compute-order-5=Система переходит к следующему рецепту и повторяет предыдущие операции.
compute-order-6=В самом конце система проверяет итоговое состояние продуктов и скрывает их, если количество меньше 0.01. Если в блоке образуется большой избыток какого-то продукта, этот продукт помечается красной иконкой.
compute-order-7=Для балансировки сложных цепочек необходимо использовать поле «Производство %» у некоторых рецептов (особенно актуально для нефтепереработки).

compute-solver=Матричный вычислитель
compute-solver-desc=«Матричный вычислитель» был добавлен для автоматической балансировки рецептов, так как стандартный построчный расчет в таких ситуациях довольно трудоемок.
compute-solver-1=Внутри блока находится иконка шестеренки - это «Матричный вычислитель», с помощью которого можно его активировать.
compute-solver-2=Этот режим игнорирует стандартный «Порядок расчетов» и вычисляет все рецепты блока одновременно без учета их последовательности.
compute-solver-3=Его следует использовать только тогда, когда это действительно необходимо.
compute-solver-4=Если вычислитель не может найти решение, возможно, в вашей цепочке не хватает какого-то рецепта или, наоборот, присутствует лишний.
compute-solver-5=Поле «Производство %» полностью игнорируется при расчетах, если активен «Матричный вычислитель».

special-panel=Специальные панели
special-panel-desc=Некоторые специальные панели становятся доступны только после включения опций «Отображение специальных панелей» и «Включить отладку вычислителя» в настройках.

special-panel-admin=Администрирование
special-panel-admin-desc=Панель администрирования позволяет управлять внутренними элементами мода. Она доступна только администраторам сервера/игры.
special-panel-admin-1=Список кэша используется для принудительной инициализации данных. Будьте осторожны: неверные действия могут нарушить работу мода. В крайнем случае используйте полную регенерацию кэша (иконка шестеренки).
special-panel-admin-2=Список правил используется для тонкой настройки списков доступных заводов, в основном для работы в редакторе рецептов.
special-panel-admin-3=Список листов позволяет администратору управлять таблицами расчетов всех игроков без каких-либо ограничений в правах.
special-panel-admin-4=Список модов - это информационная страница со списком всех модов, используемых в текущей игре. Стримеры могут использовать её для демонстрации своей сборки.
special-panel-admin-5=Список GUI - это техническая страница с информацией о текущих активных интерфейсах мода в различных областях экрана.

special-panel-properties=Свойства
special-panel-properties-desc=Панель «Свойства» очень полезна для просмотра скрытых параметров игровых объектов. Она незаменима для создателей модов.
special-panel-properties-1=Окна выбора (селекторы) позволяют добавлять нужные элементы для анализа.
special-panel-properties-2=Фильтр «Скрывать пустые значения (nil)» убирает из списка нулевые параметры, которых обычно очень много.
special-panel-properties-3=Фильтр «Показывать различия» выводит на экран только отличающиеся свойства объектов.
special-panel-properties-4=Поле фильтра позволяет находить конкретные свойства по их названию.
special-panel-properties-5=Чтобы удалить элемент из панели анализа, просто нажмите на его иконку.

special-panel-filter=Фильтр прототипов
special-panel-filter-desc=Панель «Фильтр прототипов» используется для тестирования фильтров на игровых прототипах. Она незаменима для создателей модов.
special-panel-filter-1=Выбор типа определяет, к какому классу элементов будет применен фильтр. Смена типа перезагружает интерфейс.
special-panel-filter-2=Выбор шаблонов содержит готовые фильтры, которые используются в самом Helmod и служат наглядным примером.
special-panel-filter-3=Настройте свой первый фильтр и нажмите «+», чтобы добавить его, - результат фильтрации отобразится автоматически.
special-panel-filter-4=Вы можете изменить любую строку фильтра в любой момент, и результат расчетов мгновенно обновится.
special-panel-filter-5=Если ни один фильтр не настроен, область результатов останется пустой.

special-panel-unittest=Тестирование
special-panel-unittest-desc=Панель «Тестирование» используется разработчиками для проверки корректности математических расчетов (в основном вычислений энергопотребления).
special-panel-unittest-1=Лишь несколько модов имеют встроенные модульные тесты.
special-panel-unittest-2=Красное значение не всегда означает ошибку. Проверьте параметры, сравнив информацию на иконке со всплывающей подсказкой красного поля. Обычно красный цвет указывает на то, что баланс в игре изменился, и старые эталонные значения теста просто устарели.

special-panel-debug=Отладка модели
special-panel-debug-desc=Панель «Отладка модели» служит для визуализации пошаговых вычислений, которые производят математические вычислители мода.
special-panel-debug-1=Эта панель становится доступна после включения опции «Включить отладку вычислителя» и нажатия на иконку жука (скарабея) внутри производственного блока.
special-panel-debug-2=Не включайте эту опцию в сетевой игре или если вы не занимаетесь детальной отладкой мода.
special-panel-debug-3=Кнопки в верхней части панели позволяют перемещаться вперед и назад по шагам выполнения алгоритма.
special-panel-debug-4=На этапах «Шаг х» текущая рабочая точка подсвечивается цветом. Для матричного вычислителя эта точка называется «Опорным элементом».

control=Управление
control-desc=В моде используются различные способы управления: горячие клавиши, правый клик, Ctrl + клик или Shift + клик.

control-hotkey=Горячие клавиши
control-hotkey-desc=Вы можете изменить назначение горячих клавиш в настройках управления самой игры.
control-hotkey-1=[U] Открыть/Закрыть главную панель
control-hotkey-2=[I] Открыть вкладку производственной линии
control-hotkey-3=[O] Открыть окно выбора рецептов

tips=Подсказки
tips-desc=Полезные советы, которые отображаются на некоторых панелях интерфейса.

tips-production-line=Советы по производственным линиям
tips-production-line-1=Производственная линия - это совокупность нескольких производственных блоков.
tips-production-line-2=Производственной линией можно делиться с друзьями в многопользовательской игре.
tips-production-line-3=Производственная линия может содержать как связанные, так и независимые блоки.
tips-production-line-4=Объединение независимых блоков в одну линию эффективнее, чем создание множества разных линий.

tips-production-block=Советы по производственным блокам
tips-production-block-1=Производственный блок представляет собой набор взаимосвязанных рецептов.
tips-production-block-2=Производственный блок можно привязать к результатам работы предыдущих блоков.
tips-production-block-3=Промежуточные продукты внутри одного блока также могут быть взаимосвязаны.
tips-production-block-4=Ограничения на продукты не учитываются при работе матричного вычислителя.

[helmod_map_settings]
debug-solver=Включить отладку вычислителя
debug-solver-desc=Добавляет новую кнопку для просмотра пошаговых расчетов в вычислителе.

user-cache-step=Шаг пользовательского кэша
user-cache-step-desc=Определяет скорость создания пользовательского кэша. Более высокие значения могут ухудшить производительность в сетевой игре.

display-all-sheet=Показывать все листы
display-all-sheet-desc=Позволяет администраторам видеть листы расчетов всех игроков.

filter-translated-string-active=Фильтр по переведенным строкам
filter-translated-string-active-desc=Внимание: включение этой опции может значительно увеличить время генерации кэша.

filter-on-text-changed=Фильтр при изменении текста
filter-on-text-changed-desc=Если отключено, то фильтр в окне выбора будет применяться только по нажатию кнопки.

model-filter-factory=Фильтр по заводам

model-filter-beacon=Фильтр по маякам

model-filter-factory-module=Ограничения модулей в заводах

model-filter-beacon-module=Ограничения модулей в маяках

hidden_panels=Отображать специальные панели
hidden_panels-desc=Скрытые панели используются для просмотра параметров объектов Factorio или тестирования фильтров (отладка).

display-hidden-column=Отображать скрытые столбцы
display-hidden-column-desc=Столбцы «Индекс», «ID», «Тип» и «Название» по умолчанию скрыты (отладка).

[helmod_user_settings]
display-ratio-horizontal=Коэффициент ширины интерфейса
display-ratio-horizontal-desc=Настройка ширины отображения панелей мода.

display-ratio-vertical=Коэффициент высоты интерфейса
display-ratio-vertical-desc=Настройка высоты отображения панелей мода.

display-main-icon=Отображать главную иконку
display-main-icon-desc=Если вы используете горячие клавиши, вы можете скрыть верхнюю кнопку мода.

display-cell-mod=Режим отображения ячеек

row-move-step=Шаг перемещения строки
row-move-step-desc=Определяет, на сколько строк вверх/вниз перемещается элемент при комбинации Shift + Клик.

[helmod_pref_settings]
default-factory-level=Уровень завода по умолчанию
default-factory-level-desc=Выбор уровня завода, который автоматически назначается новому рецепту. 1 - для самого медленного, последний - для самого быстрого

format-number-factory=Формат чисел заводов
format-number-factory-desc=Формат отображения числовых значений для заводов

format-number-element=Формат чисел элементов
format-number-element-desc=Формат отображения числовых значений для продуктов или ингредиентов

preference-number-line=Количество строк для прокрутки
preference-number-line-desc=Число отображаемых строк в списках выбора до появления полосы прокрутки

preference-number-column=Количество столбцов для прокрутки
preference-number-column-desc=Число отображаемых столбцов в списках выбора до появления полосы прокрутки

display-product-order=Порядок отображения продуктов
display-product-order-desc=Порядок вывода продуктов или ингредиентов в строке рецепта

display-hidden-products-mode=Режим отображения скрытых продуктов
display-hidden-products-mode-desc=Сжатие продуктов использует абсолютное или относительное значение

display-hidden-products=Отображать скрытые продукты
display-hidden-products-desc=Сворачивает продукты в одну ячейку, значение 0 отключает эту функцию

display-product-cols=Базовое число столбцов продуктов
display-product-cols-desc=Влияет на количество отображаемых столбцов продуктов. Избыточные элементы переносятся на новую строку.

display-ingredient-cols=Базовое число столбцов ингредиентов
display-ingredient-cols-desc=Влияет на количество отображаемых столбцов ингредиентов. Избыточные элементы переносятся на новую строку.

display-fuel-compact=Компактный вид топлива
display-fuel-compact-desc=Включить или отключить компактное отображение выпадающего списка топлива

display-spoilage=Отображение порчи
display-spoilage-desc=Включить или отключить отображение порчи продуктов

display-pollution=Отображение загрязнения
display-pollution-desc=Включить или отключить отображение вырабатываемого загрязнения

display-building=Отображение строений
display-building-desc=Включить или отключить показ необходимых строений

ui-production-lines-menu=Меню производственных линий
ui-production-lines-menu-desc=Выберите количество видимых линий, значение 0 отображает все линии

ui-menu-lines=Строки меню
ui-menu-lines-desc=Отображать главное меню в одну или в две строки

ui-summary-mode=Режим сводки
ui-summary-mode-desc=Используется для пипетки и отображения: «Глобальная» - для всех строений и модулей блока и его подблоков, «Локальная» - только для строений и модулей рецептов текущего блока.

ui-auto-close=Автозакрытие панелей
ui-auto-close-desc=Автоматически закрывать старые панели при открытии любой новой

ui-close-after-selection=Закрывать панель после выбора
ui-close-after-selection-desc=Автоматически закрывать окно выбора сразу после того, как элемент был выбран

ui-glue=Привязка интерфейса
ui-glue-desc=Прикреплять дополнительные панели к краю главного окна мода

ui-glue-offset=Смещение привязки интерфейса
ui-glue-offset-desc=Коэффициент смещения по оси Y для левого угла панели относительно правого угла главного окна

range-value=Значение должно быть в этом диапазоне

display-tips=Отображение подсказок
display-tips-desc=Включить или отключить показ полезных советов

beacon-affecting-one=Количество маяков, влияющих на один
beacon-affecting-one-desc=Количество маяков, зона действия которых покрывает один завод.

beacon-by-factory=Маяков на завод
beacon-by-factory-desc=Количество маяков на один завод.

beacon-constant=Постоянные маяки
beacon-constant-desc=Постоянное (фиксированное) количество маяков.

combinator-item-quantity-mode=Количество предметов в комбинаторе
combinator-item-quantity-mode-desc=Как рассчитывается значение сигнала для твердых предметов при генерации постоянного комбинатора из списка входов. «stacks»: значение * размер пачки предмета; «amount»: значение * количество на входе блока.

combinator-default-item-value=Значение предметов в комбинаторе
combinator-default-item-value-desc=Множитель, применяемый к каждому твердому предмету. В режиме «stacks» это количество пачек, в режиме «amount» он умножает входное количество. Используйте отрицательное значение для создания запроса предметов (например, для логистического запроса или запроса поезда).

combinator-fluid-quantity-mode=Количество жидкостей в комбинаторе
combinator-fluid-quantity-mode-desc=Как рассчитывается значение сигнала для жидкостей при генерации постоянного комбинатора из списка входов. «stacks»: значение * размер пачки предмета; «amount»: значение * количество на входе блока.

combinator-default-fluid-value=Значение жидкостей в комбинаторе
combinator-default-fluid-value-desc=Множитель, применяемый к каждой жидкости. В режиме «stacks» это количество пачек, в режиме «amount» он умножает входное количество. Используйте отрицательное значение для создания запроса жидкостей (например, для логистического запроса или запроса поезда).

combinator-default-fluid-stack=Пачка жидкости в комбинаторе
combinator-default-fluid-stack-desc=Фиксированное значение сигнала, используемое для каждой жидкости при генерации постоянного комбинатора. Используйте отрицательное значение для создания запроса жидкости (например, -30000).

[telo-gui]
telefail=Телепортация сорвалась!
destlost=Точка назначения удалена!
synclost=Синхронизация потеряна!
control=Управление
linkid=ID связи
activate-teleport=Включить телепорт
destination=Точка назначения
fullinv=Телепортировать при полном инвентаре...
notele=Деактивировано
targstate=Состояние цели
targstate-any=Любое
targstate-full=Заполнено
targstate-empty=Пусто

[fc-tools]
flow-key-tool=Инструмент управления потоком
flow-key-tool-tip=Перекрыть трубы, имеющие 2 и более направлений потока (используйте альтернативный режим для разблокировки).
alt-flow-key-tool-tip=Открыть трубы, имеющие перекрытые направления (используйте обычный режим для блокировки потока).
cant-open-blocked=Невозможно открыть заблокированный поток.
cant-place-invalid=Труба должна иметь 2 или более действующих отверстий.
rotate-180=Повернуть на 180°

[fc-gui]
configuration=Конфигурация
toggle-open=Открыть поток
toggle-close=Перекрыть поток
toggle-locked=Переключить блокировку
directions=Направления потока

[AR-notification]
AR-notification=Уведомление
AR-notification-midgame-update=__1__: Установлена версия __2__
AR-notification-new-version=__1__: Обновлено с версии __2__ до новой версии __3__
AR-prefix=[AsphaltRoadsPatched]
AR-revert-error-invalid-item=__1__ не является покрытием (плиткой)
AR-revert-error-invalid-tile=У __1__ нет базового типа покрытия
AR-revert-error-is-already-basic-tile=__1__ уже является базовым типом покрытия
AR-revert-error-multiple-ingredients=__1__ состоит из слишком большого количества (__2__) разных ингредиентов
AR-revert-completed=__1__ шт. «__2__» успешно переработано в __3__ шт. «__4__»
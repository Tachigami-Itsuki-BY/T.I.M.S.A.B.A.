[mod-setting-description]
zy-unichest-inventory-size=Размер инвентаря можно настроить в диапазоне от 1 до 4069 слотов. Один ряд в сундуке вмещает 10 слотов.
zy-unichest-required-research=Установить требования к исследованию
zy-unichest-crafting-cost=Установить стоимость крафта
zy-unichest-per-surface=Разделяет содержимое сундуков для каждой планеты отдельно. (Внимание: изменение этого параметра сбросит данные уже установленных сундуков!)
zy-unipipe-storage-size=Объем жидкости, который может вместить каждый тип Универсальной трубы, кратный 1 тыс. Минимум - 20 тыс., максимум - 80.000 тыс. (например, 80м).
zy-unipipe-required-research=Установить требования к исследованию
zy-unipipe-crafting-cost=Установить стоимость крафта
zy-unipipe-autofilter-mode=(Производительность) Проверка типа жидкости, к которой подключена Универсальная труба. Эту проверку можно выполнить при размещении любого объекта с жидкостью, или только при размещении Универсальной трубы, или отключить, выбрав «отключено». Используйте «отключено», если вы заметили проблемы с производительностью.
zy-unipipe-per-surface=Разделяет содержимое труб для каждой планеты отдельно. (Внимание: изменение этого параметра сбросит данные уже установленных труб!)
zy-unipipe-factorissimo-compat=Если включено, сети Универсальные трубы будут считать интерьеры заводов Factorissimo частью их родительской планеты/поверхности (даже при включенном разделении по планетам). Отключите, если хотите изолировать сети внутри заводов.

choice-main=Выберите тип заливки.
choice-arrow=Выберите тип стрелки.
choice-centerness=Выберите, будут ли иконки центрироваться.
choice-ammo-red=Показывается при отсутствии боеприпасов.
choice-asteroid-collector-path-blocked=Показывается, когда путь манипулятора сборщика астероидов заблокирован.
choice-danger=Показывается, когда объект атакован кусакой.
choice-destination-full=Показывается, когда локомотив пытается въехать на занятую ж/д станцию с лимитом поездов больше 0.
choice-destroyed=Показывается, когда объект уничтожен кусакой.
choice-electricity-red=Показывается при нехватке электроэнергии.
choice-electricity-unplugged=Показывается при отключении от электросети.
choice-endangered-by-lightning-red=Показывается при неизбежном ударе молнии.
choice-endangered-by-lightning=Показывается при приближении грозового фронта / молнии.
choice-fluid-red=Показывается, когда трубопровод слишком длинный.
choice-food-red=Показывается, когда объекту не хватает биофлюса.
choice-frozen=Показывается, когда объект заморожен.
choice-fuel-red=Показывается при нехватке топлива.
choice-logistic-delivery=Устарело в v2.0. Показывалось, когда чертежи содержали модули без назначенных слотов.
choice-no-building-material=Показывается при нехватке строительных материалов.
choice-no-path=Показывается, когда у поезда нет пути до пункта назначения.
choice-no-roboport-storage-space=Показывается при нехватке места для хранения в робопорту.
choice-no-platform-storage-space=Показывается при нехватке места для хранения на космической платформе.
choice-no-storage-space=Показывается при нехватке места в сундуках логистической сети.
choice-not-enough-construction-robots=Показывается при нехватке строительных роботов.
choice-not-enough-repair-packs=Показывается при нехватке ремкомплектов.
choice-nutrients-red=Показывается, когда объекту не хватает питательных веществ.
choice-pipeline-disabled=Устарело в v2.0. Показывалось, когда трубопровод был слишком длинным.
choice-recharge=Показывается во время перезарядки робопорта после того, как роботы полностью истощили его заряд.
choice-resources-depleted=Показывается, когда буру не хватает руды (ресурс истощен).
choice-too-far-from-roboport=Показывается, когда в робопорту нет свободного места.
choice-unclaimed-cargo=Показывается, когда грузовая капсула не востребована.
choice-warning=Показывается, когда турель атакует кусаку.

density-multiplier=Множитель вероятности появления астероидов в поясе астероидов. Минимальное значение — 0.0 (без астероидов), максимальное — 100.00 (очень много астероидов).

universe-widget-enabled=Включает полноэкранный фоновый режим звездного неба на карте звездных систем.
asteroid-belt-1-enabled=Включает пояс астероидов между планетами Фульгора и Аквило.
asteroid-belt-2-enabled=Включает пояс астероидов между краем Солнечной системы и Разрушенной планетой.

max_cargo_bays_landing_pad=Базовое количество грузовых отсеков, разрешенное для одной посадочной площадки (до изучения технологий).
max_cargo_bays_space_platform=Базовое количество грузовых отсеков, разрешенное для одной космической платформы (до изучения технологий).

Cosmic-Social-Distancing-min-distance-km=Фактическое расстояние на экране. Длина космических маршрутов здесь значения не имеет. Масштаб в «км» примерно соответствует расстояниям между первыми планетами в ванильной игре.

custom-map-colors-preset=Шаблоны для кастомных цветов фабрики. \nВключают объекты и покрытия. \nОтдельные цвета можно переназначить с помощью настроек ниже.
custom-map-colors-monochrome=Если выбран монохромный шаблон, введите цвет здесь, чтобы окрасить всю фабрику в этот оттенок.
custom-map-colors-map-tiles-preset=Несколько вариантов цветовых палитр для плиток карты.
custom-map-colors-map-tiles-multiplier=Значение от 0 до 10. \nИспользуется с шаблоном «По умолчанию 0.17» для изменения общей насыщенности.
use-custom-map-colors-fancy-trees=Делает цвета деревьев на карте более близкими к цвету их листвы.
use-custom-default-friendly-color=Установить цвет по умолчанию для всех объектов вашей команды.
custom-default-friendly-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: 006192
use-custom-transport-belt-color=Установить кастомный цвет для конвейеров, подземных конвейеров и разделителей.
custom-transport-belt-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: faba00

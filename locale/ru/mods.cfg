[mod-description]
TIMSABA=Tachigami Itsuki Modpack for Space Age, Bob's and Angel's. \nПолная интеграция Space Age с модами Angel's и Bob's. \nЕдиный баланс, новые: сущности, предметы, жидкости, рецепты и технологии, а также обновлённые иконки.

AsteroidBelt=Добавляет пояс астероидов, разделяющий Солнечную систему на внутренние и внешние планеты. Внутренние планеты: Наувис, Вулкан, Фульгора, Глеба (модификации: Кастра, Рубия, Мошайн, Игрис, Коррундум). Внешние планеты: Аквилло (модификации: Мараксис, Тенебрис, Кубиум, Секретас и Фрозета, Парацельсин). Края пояса очень богаты ресурсами. Путешествие через пояс - короткое, но сложное, требующее либо хорошо вооруженного и бронированного корабля, либо корабля, способного регулировать его скорость.

Unichest=Связанные сундуки с общим содержимым по типу предметов. Установите фильтр предметов в графическом интерфейсе, и содержимое будет доступно для всех остальных сундуков Unipipe с тем же фильтром. Включает удобные инструменты для установки фильтра на основе подключенных сборочных автоматов/шахтеров/печей и т.д. (либо с помощью вставки с зажатой клавишей Shift, либо с помощью предоставленного инструмента выделения). Отлично сочетается с Unipipe для упрощения работы с логистикой!

Unipipe=Соединённые трубы, которые наполняют или откачивают жидкость из единого глобально связанного хранилища, по одной на каждый тип жидкости. Тип жидкости задаётся в графическом интерфейсе или автоматически на основе соединений труб, и содержимое будет распределяться между всеми другими трубами с этим типом жидкости. Хорошо сочетается с модом Unichest и входящим в него инструментом выбора для установки фильтров жидкости.



enhanced-shadows=Заменяет часто используемые игровые ресурсы со встроенными тенями на варианты с отдельно разделенными тенями.

muluna-utility-constants=Изменяет некоторые базовые константы движка Factorio для лучшей поддержки рецептов Мулуны с высокой скоростью потока. Может вызвать непредвиденные эффекты, поэтому каждое измененное значение можно настроить.

vp-scale=Добавляет автоматическое масштабирование планет, отображаемых модом Visual Planets, на основе их гравитации.

visible-planets=Отображает текущую планету на заднем плане за платформами, когда они находятся на орбите. Теперь с параллаксом, вращением и поддержкой других модов!

solar-productivity=Повышайте эффективность солнечных панелей и аккумуляторов, развивая технологии!

squeak-through-2=Позволяет проходить сквозь объекты, между которыми обычно нельзя протиснуться.\nПолностью настраиваемая и более совместимая версия мода Squeak Through, написанная с нуля.

StatsGui=Отображает различную статистику, такую ​​как эволюция кусачих существ, время игры и многое другое. Интегрируется с индикатором FPS/UPS игры. Аналогичен EvoGUI.

vulcanus-sulfuric-bacteria=Восстановите древесину на Вулкане, культивируя бактерии, обитающие вокруг серных гейзеров.

tile-upgrade-planner-muluna=Добавляет планировщик улучшений, который можно использовать для улучшения клеток. Это ответвление разработано для работы с дополнением "Muluna, Moon of Nauvis."

VehicleSnap=Обеспечивает плавную фиксацию угла поворота при движении транспортных средств.

VoidChestInstant=Переделанный сундук бесконечности мгновенно уничтожает всё, что в него помещено, максимально бережно относясь к UPS. Не может использоваться для генерации предметов.

Telogistics=Телепортируйте предметы с планеты на планету, если у вас хватит электроэнергии.

flow-config=Более точный контроль над трубами. Результаты аналогичны Контроль Потоков, но с использованием графического интерфейса и горячих клавиш конфигурации манипулятора вместо уникальных предметов для каждого изгиба. Прокладывайте трубы с разными жидкостями рядом друг с другом!

AsphaltRoadsPatched=Асфальтовое покрытие для увеличения скорости движения транспортных средств. Также включает в себя элементы для разметки полос (одинарные и двойные линии) и различных опасных зон. Оригинальный мод от Arcitos, адаптированный для версии 2.0 пользователем MrFastZombie.


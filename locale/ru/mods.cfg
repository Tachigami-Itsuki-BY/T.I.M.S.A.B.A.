[item-description]
zy-unichest=Сундук с общим инвентарем для выбранного предмета. Задайте фильтр предмета в интерфейсе (GUI), скопируйте настройки с привязанного автомата или используйте инструмент выделения.
zy-unipipe-fill=Труба, которая наполняет общее хранилище выбранной жидкостью. Задайте фильтр жидкости в интерфейсе (GUI), скопируйте настройки с привязанного автомата или используйте инструмент выделения.
zy-unipipe-extract=Труба, которая извлекает выбранную жидкость из общего хранилища. Задайте фильтр жидкости в интерфейсе (GUI), скопируйте настройки с привязанного автомата или используйте инструмент выделения.

picker-tape-measure=Инструмент для быстрого измерения площади.
tree-killer=Помечает объекты окружения и лежащие на земле предметы для сноса.
artillery-jammer-tool=Переключает автоматическое наведение для выбранных артиллерийских турелей и вагонов.

rpg_small_xp_potion=Выпейте, чтобы получить 30% опыта.
rpg_big_xp_potion=Выпейте, чтобы получить 60% опыта.
rpg_amnesia_potion=Выпейте, чтобы сбросить все свои характеристики. Вы потеряете 30% от всего вашего опыта, но сможете заново распределить очки навыков.
rpg_level_up_potion=Выпейте, чтобы мгновенно повысить уровень.
rpg_crafting_potion=Выпейте, чтобы увеличить скорость создания предметов (длительность: 5 минут).
rpg_speed_potion=Выпейте, чтобы бегать быстрее (длительность: 5 минут).
rpg_curse_cure_potion=Выпейте, чтобы исцелиться от проклятия.

ore-patch-organizer=Инструмент выделения для вырезания/вставки руды.


[mod-description]
TIMSABA=Tachigami Itsuki Modpack for Space Age, Bob's and Angel's. \nПолная интеграция Space Age с модами Angel's и Bob's. \nЕдиный баланс, новые: сущности, предметы, жидкости, рецепты и технологии, а также обновлённые иконки.

enhanced-shadows=Заменяет часто используемые игровые ресурсы со встроенными тенями на варианты с отдельно разделенными тенями.

muluna-utility-constants=Изменяет некоторые базовые константы движка Factorio для лучшей поддержки рецептов Мулуны с высокой скоростью потока. Может вызвать непредвиденные эффекты, поэтому каждое измененное значение можно настроить.

vp-scale=Добавляет автоматическое масштабирование планет, отображаемых модом Visual Planets, на основе их гравитации.

visible-planets=Отображает текущую планету на заднем плане за платформами, когда они находятся на орбите. Теперь с параллаксом, вращением и поддержкой других модов!

solar-productivity=Повышайте эффективность солнечных панелей и аккумуляторов, развивая технологии!


mdrn-enable-stacking-turbo-and-above=Только погрузчики быстрее экспресс-конвейеров смогут собирать предметы в пакеты.\n\nКоличество манипуляторов в рецептах будет выше, чем при значении «Нет».
mdrn-enable-stacking-all=Все погрузчики смогут собирать предметы в пакеты в соответствии с вашим уровнем технологии пакетирования.\n\nКоличество манипуляторов в рецептах будет выше, чем при значении «Нет».
mdrn-enable-stacking-stack-tier=Создает отдельный пакетный погрузчик с собственным рецептом и технологией. Для этого погрузчика требуются пакетные манипуляторы, и он сможет полностью заполнить ваш самый быстрый конвейер.
mdrn-keep-5d-loaders-none=Удалить погрузчики размеров 1x2 и 1x1 из мода 5Dim's. Использовать только погрузчики из Loaders Modernized.
mdrn-keep-5d-loaders-all=Сохранить погрузчики размеров 1x2 и 1x1 из модов 5Dim's в дополнение к погрузчикам из Loaders Modernized.
mdrn-keep-5d-loaders-1x2=Сохранить только погрузчики размера 1x2 из мода 5Dim's в дополнение к погрузчикам из Loaders Modernized.
mdrn-unlock-technology-separate=Погрузчики будут иметь собственную технологию для разблокировки рецептов.
mdrn-unlock-technology-belt=Рецепты погрузчиков будут открываться той же технологией, что и другие логистические предметы аналогичного тира.
mdrn-embiggen-assemblers-zero=Не изменять размер сборочных автоматов.

[technology-description]
zy-unichest=Открывает Универсальный сундук.
zy-unipipe=Открывает Универсальные трубы.

space-discovery-asteroid-belt=Открывает возможность путешествия к Поясу астероидов, который разделяет внутренние и внешние планеты.

cargo-bay-limit=Увеличивает количество грузовых отсеков, которые можно подключить к посадочным площадкам и космическим платформам. Высшие уровни требуют более продвинутых исследовательских пакетов.

laboratory-productivity=Производство этих исследовательских пакетов обходится слишком дорого, поэтому лаборатории необходимо улучшить, чтобы извлекать из них больше пользы.

solar-productivity=Увеличивает эффективность солнечных панелей и аккумуляторов на [font=default-semibold][color=green]__1__%[/color][/font].

s6x-logistic-teleporter=Позволяет телепортировать товары между планетами, затрачивая большое количество электроэнергии. Непригодно для людей.

Arci-asphalt=Позволяет производить асфальт для дорог высокого качества, что особенно полезно для колесной техники.


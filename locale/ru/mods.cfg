custom-vehicle-inner-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: e6e6e6
use-custom-rail-color=Установить кастомный цвет для рельсов.
custom-rail-color=Введите шестнадцатеричное (000000) или десятичное (rrr.ggg.bbb) значение цвета. По умолчанию: 9fcacc

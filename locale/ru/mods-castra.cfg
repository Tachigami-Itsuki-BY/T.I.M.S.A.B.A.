[tips-and-tricks-item-description]
castra-briefing=[planet=castra] представляет собой военизированную пустошь, занятую враждебной фракцией. Они изучают и копируют ваши технологии, со временем постоянно улучшая свою оборону.\n\nБазы со [entity=data-collector] выделяют загрязнение данных, из-за чего периодически сбрасываются [item=castra-data] - собирайте их быстрее, так как они портятся в течение одной минуты. Чем дольше сборщики работают беспрепятственно, тем сильнее улучшаются их базы, на которых появляются новые турели, стены, робопорты и солнечные панели.\n\nРазмещайте [entity=jammer-radar] рядом с вражескими сборщиками, чтобы поглощать загрязнение данных и замедлять скорость улучшения баз и появления предметов.\n\n[item=millerite] - это основная руда, перерабатываемая в [item=nickel-plate] никелевые пластины, которые используются в большинстве местных рецептов. [fluid=hydrogen-sulfide] добывается из [entity=hydrogen-sulfide-vent]. Залежи [item=gunpowder] можно добывать напрямую. Океаны из [fluid=light-oil] можно качать с помощью [entity=offshore-pump]. Также здесь присутствуют [item=copper-ore] и [item=uranium-ore].\n\n[entity=forge] - планетарное производственное здание, обладающее встроенными бонусами к эффективности и качеству. Для его открытия требуется переработка всех трёх уникальных ресурсов Кастры, и оно необходимо для производства [item=battlefield-science-pack].
castra-lithium-supply=На [planet=castra] нет лития. Чтобы производить [item=lithium-battery], вам придётся либо импортировать [item=lithium] с другой планеты, либо экспортировать [item=nickel-plate] для производства батарей в другом месте.


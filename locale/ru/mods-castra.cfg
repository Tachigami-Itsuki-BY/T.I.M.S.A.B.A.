combat-roboport=Выпускает боевых роботов при обнаружении врагов поблизости. Заправляется предметами: [item=defender-capsule], [item=distractor-capsule] или [item=destroyer-capsule] - на каждый выпуск расходуется одна капсула. Срабатывает каждые 5 секунд.\n\nДальность обнаружения: 20 клеток (+1 за каждый уровень качества)\nРоботов за выпуск: 5 (+1 за каждый уровень качества)\nКачество роботов соответствует качеству загруженной капсулы.

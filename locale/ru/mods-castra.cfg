[mod-setting-description]
castra-prime-forge-glow=Включает слой излучения света у кузницы, заставляя её светиться во время работы.
castra-prime-extend-data-spoilage=Увеличивает время порчи пакетов данных с поля боя с 1 минуты до 5 минут.

castra-prime-disable-artillery=Запрещает вражеским базам строить артиллерийские турели. Рекомендуется для долгих прохождений.
castra-prime-buffed-forge=Повышает скорость создания кузницы до 3.0, бонус к эффективности до 50% и снижает энергопотребление до 2.5 МВт.
castra-prime-gates-progression=Если включено (по умолчанию), ресурсы Кастры необходимы для продвижения на поздних этапах игры: литиевые батареи нужны для создания рельсотронов и прометиевых исследовательских пакетов, а боевая наука нужна для прометиевой науки и эффективности исследований. Отключите, чтобы сделать Кастру необязательной побочной планетой.
castra-prime-suppress-research-msg=Скрывает уведомления о прогрессе исследований врага. Полезно для игроков, предпочитающих более глубокое погружение без постоянных всплывающих сообщений.
castra-prime-research-rate-multiplier=Умножает скорость исследований вражеской фракции. Значение по умолчанию 1.0 соответствует оригинальному моду. Значения меньше 1.0 замедляют исследования врага, более высокие - ускоряют. Диапазон: от 0.01 до 100. ПРИМЕЧАНИЕ: Исследования врага ограничены движком игры, поэтому ускорение может работать некорректно.
castra-prime-nauvis-nukes=Если включено, убирает боевой исследовательский пакет из технологии атомной бомбы, позволяя изучить её без посещения Кастры.
castra-prime-buff-equipment=Усилит энергетический щит МК3 (450 ОЗ, регенерация 18/с, потребление 300 кВт) и аккумулятор МК3 (ёмкость 300 МДж), добавляемые этим модом. Если флажок снят, используются исходные значения мода.
castra-prime-disable-enemy-nukes=Запрещает вражеским турелям заряжать ядерные боеприпасы: атомные и водородные бомбы в ракетных турелях, а также ядерные артиллерийские снаряды (Cerys/Maraxsis) в артиллерийских турелях. Уже имеющиеся ядерные припасы останутся до тех пор, пока не будут отстреляны. Из турелей они автоматически не удаляются.
castra-prime-disable-land-mines=Уже установленные мины удалены не будут.
castra-prime-nerf-enemy-bases=Снижает здоровье, сопротивления и скорость регенерации всех вражеских сборщиков данных на 50%.
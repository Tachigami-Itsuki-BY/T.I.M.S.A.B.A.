[tips-and-tricks-item-description]
fulgora-briefing=[planet=fulgora] - сухая бесплодная планета без признаков жизни, с опасной активностью молний в частых ночных циклах.\n[entity=solar-panel] гораздо менее эффективна, однако молнии можно собирать с помощью [entity=lightning-rod] и хранить энергию в [entity=accumulator].\nНа планете нет природных ресурсов. Единственное, что доступно - это [entity=scrap].\nТо, что могло быть океанами, теперь заполняет [fluid=angels-liquid-multi-phase-oil], который можно добыть с помощью [entity=offshore-pump].\n[tile=oil-ocean-shallow] невозможно засыпать, но позже его можно будет пересечь с помощью надземных рельсов. Строительство [entity=rail-support] в глубоких частях океана потребует дополнительных исследований.
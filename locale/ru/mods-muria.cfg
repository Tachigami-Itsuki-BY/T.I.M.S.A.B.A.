[tips-and-tricks-item-description]
muria-briefing=[planet=muria] — крайне токсичный мир, богатый жизнью. Сушу планеты покрывают [tile=acidophile-lichen] и грибы [entity=eschatotaxite], а остальную поверхность занимают озёра из [fluid=muriatic-solution]. [entity=chlorine-salt-deposit] и [item=cotunnite] представляют собой соли [fluid=angels-gas-chlorine], которые можно найти на поверхности разными способами. И то, и другое можно очистить до состояния руды с помощью [entity=fungicultural-tower] и лишайника. Остерегайтесь едкого воздуха, выделяемого лишайником. Эсхатотакситы могут защитить вашу фабрику от этого урона.
acid-immunity-list=Сбор [entity=metallic-lichen-colony] и [entity=cotunnite-lichen-colony] приводит к выделению едких газов. Эти газы наносят урон большинству ваших машин. Слой загрязнения на карте показывает, какие области опасны для оборудования. Коррозийную атмосферу можно ослабить, высаживая и собирая [entity=eschatotaxite].\nБольшинство созданных игроком объектов на загрязнённых плитках планеты [planet=muria] будут постоянно получать урон от едких кислот, за некоторыми исключениями.\nНеуязвимые объекты:\n- [entity=fungicultural-tower] очевидно неуязвима, так как является главным источником и главным поглотителем кислот.\n- [entity=acidworking-plant] и [entity=smelting-plant] (эти две машины на самом деле увеличивают количество едких кислот, так что будьте осторожны).\n- [entity=biovat] (биочан поглощает часть кислот из воздуха).\n- [entity=scrubber] (эта машина разработана для поглощения кислот и других загрязняющих веществ).\n- Все энергетические объекты (столбы ЛЭП, генераторы и аккумуляторы).\n- Все логистические объекты не получают урона, за исключением роботов. Дронопорты урон не получают.\n- Поезда ([entity=locomotive], [item=rail] и т. д.) также неуязвимы.\n- [entity=rocket-silo], [entity=cargo-landing-pad] и [entity=cargo-bay].\n- Все добывающие буры.\n- [entity=beacon].\n- Все трубы.\n- Все сундуки.


[item-description]
eschatotaxite-sprout=Молодой гриб эсхатотаксита. Можно высаживать на любые тёмные покрытия на [planet=muria].
eschatotaxite-paste=Богатый углеродом природный клей. На вкус как древесный уголь, но очень питательный.
cotunnite=Кусок хлорида свинца. Можно разместить на [tile=acidophile-lichen].
acidophile-lichen=Кремниевые лишайникоподобные формы жизни, которые питаются хлоридными солями для выживания.
chlorine-salts=Смесь хлорида железа и меди. Можно разместить на [tile=acidophile-lichen].
chloric-fuel=Пойманный образец ацидофильного лишайника. Энергия, выделяемая при его необычном энергосинтезе, используется для питания специализированных мурианских машин.
artificial-lichen-colony=Почва для выращивания ацидофильного лишайника. Можно разместить на [tile=muriatic-solution] планеты [planet=muria] и на нефтяном океане планеты [planet=fulgora].
leaded-fuel=Мощное и сильно загрязняющее окружающую среду топливо.
inert-muriatic-science-pack=Химическая реакция внутри этого пакета должна быть активирована с помощью [fluid=angels-gas-hydrogen-chloride].
anti-corrosion-cladding=Коррозионностойкая обшивка, идеально подходящая для оборудования, работающего в мурианской атмосфере или постоянно контактирующего с кислотами.
acidthrower=Модифицированный огнемёт, внутри которого находится генетически изменённый кусака-плевака.


[entity-description]
chlorine-salt-deposit=Месторождение хлоридных солей.
fungicultural-tower=Модифицированная сельскохозяйственная башня, предназначенная для выращивания грибов и лишайников.
biovat=Биокамера, модифицированная для переработки материалов с помощью эсхатотакситов вместо эмбрионов пентаподов. Менее эффективна, но может быть создана из местных мурианских ресурсов.
acidworking-plant=Позволяет осуществлять более продвинутую работу с кислотами. Эта машина производит кислоты на Мурии и разъедает расположенные поблизости уязвимые объекты.
smelting-plant=Гибрид литейного завода и печи. Позволяет работать со свинцом. Эта машина производит кислоты на Мурии и разъедает расположенные поблизости уязвимые объекты.

metallic-lichen-colony=Колония ацидофильного лишайника, выращенная на хлоридных солях.
cotunnite-lichen-colony=Колония ацидофильного лишайника, выращенная на котунните.
eschatotaxite=Высоченная грибная колония, которая поглощает едкие кислоты из воздуха.
big-chloric-rock=Большой конгломерат хлоридных солей и камня.


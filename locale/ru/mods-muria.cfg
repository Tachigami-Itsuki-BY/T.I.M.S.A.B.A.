[technology-description]
planet-discovery-muria=Далёкая планета с сильным парниковым эффектом. Неглубокие озёра из крайне едкого [fluid=muriatic-solution] выделяют газы, которые сохраняют тепло на планете. Жидкость из озёр можно добывать с помощью [entity=offshore-pump]. Похоже, на поверхности есть жизнь.
eschatotaxite-farming=Высокие грибные колонии, питающиеся собственными гниющими частями. Чрезвычайно богаты углеродом и серой. Похоже, они поглощают едкие кислоты, выделяемые [entity=metallic-lichen-colony] и [entity=cotunnite-lichen-colony].
lichen-cultivation=Похоже, что [item=acidophile-lichen] питаются энергией, выделяемой [item=chlorine-salts], когда из металлов удаляется [fluid=angels-gas-chlorine]. Размещая соли на [tile=acidophile-lichen], мы можем стабильно получать металлы на планете. Однако их колонии выделяют в воздух чрезвычайно сильные едкие вещества, что представляет опасность для фабрики.
murian-oil-processing=Перерабатывая серу и пасту из эсхатотаксита, получаемую из грибов эсхатотаксита, вместе с другими ресурсами Мурии, мы можем легко получать нефть и другие нефтепродукты.
lead-processing=Разместите [item=cotunnite], добытый из [fluid=muriatic-solution], на [tile=acidophile-lichen], чтобы высвободить содержащуюся внутри него [item=bob-lead-ore] и начать переработку этого коррозионностойкого металла.
advanced-lead-processing=С помощью [item=chloric-fuel] мы можем запустить более продвинутую цепочку переработки [item=bob-lead-ore] внутри специализированного [entity=smelting-plant]. Наряду с этим открывается производство свинцовой дроби и тяжёлых патронов для дробовика.
acidworking=Новые процессы, позволяющие работать с высококоррозионными материалами. Для работы [entity=acidworking-plant] требуется [item=chloric-fuel].
muriatic-science-pack=Позволяет находить более продвинутые применения кислот и токсичных материалов. Технология также позволяет строить ракеты, способные покинуть Мурию.
advanced-paste-applications=Используя многочисленные свойства пасты из эсхатотаксита, мы можем заменить пластик и пюре из юмако в важных производственных процессах.
offworld-chlorane-production=Процессы получения и переработки [fluid=angels-gas-hydrogen-chloride] за пределами планеты [planet=muria].
shotgun-turret=Модифицированная конструкция орудийной турели, способная вести мощный огонь патронами для дробовика.
shotgun-turret-damage=Увеличение урона дробовиковых турелей.
acid-weaponization=Начало создания продвинутого химического арсенала.
refined-acid-weaponry=Увеличивает урон оружия, использующего кислоту.
chlorane-explosives=Альтернативный рецепт получения [item=explosives] с использованием свойств [fluid=angels-gas-hydrogen-chloride].
toxic-rounds-magazine=Патроны, модифицированные для удержания кислотных зарядов.


tellus-pollen-corrosion=Коррозия от пыльцы

[tips-and-tricks-item-description]
tellus-briefing=[planet=tellus] — это заражённая планета, полная бактерий и паразитов. Пыльца в её атмосфере помогает распространяться [entity=small-wasp] и разъедает некоторые материалы, но дальнейшие исследования теллурианских технологий помогут вам найти решение.\nХлорофилл и мицелий можно выращивать с помощью [entity=condensing-agricultural-tower] и затем перерабатывать в [entity=planetaris-bioassembler].\nВы не найдёте здесь [entity=iron-ore], [entity=copper-ore], [entity=crude-oil], [entity=coal] и [entity=uranium-ore], однако местные растения предлагают альтернативные способы производства необходимых ресурсов.\nБольшинство продуктов сельского хозяйства создают дополнительную сложность — они со временем портятся. Даже [item=planetaris-bioengineering-science-pack] имеет ограниченный срок службы, поэтому его нельзя запасать впрок. Кроме того, патогены таят в себе опасность: в случае порчи они порождают врагов. Например, испорченный [item=planetaris-pathological-science-pack] взорвется, и из него появится [entity=big-wasp].
tellus-bioassembler=[entity=planetaris-bioassembler] позволяет запускать эксклюзивные теллурианские процессы и создавать уникальные материалы.\n[entity=planetaris-bioassembler] — это живые организмы, их необходимо выращивать из [item=planetaris-bioassembler-seed] на любой естественной почве. Как и все растения, [entity=planetaris-bioassembler] умирают. Чтобы оживить их, покормите их [item=nutrients], пока они окончательно не разложились.\n[entity=planetaris-bioassembler] могут быть размещены с помощью [entity=construction-robot].
tellus-roots=Трубы легко разъедаются пыльцой, а теллурианские машины не могут подключаться к [entity=pipe]. Для транспортировки жидкостей вам понадобятся [entity=planetaris-root]. Вы можете закачивать жидкости из обычных труб в корневую систему с помощью [entity=planetaris-root-filler].


[technology-description]
planet-discovery-pelagos=Позволяет открыть островную планету Пелагос и раскрыть её секреты.
coconut-processing-technology=Позволяет перерабатывать кокосы в масло, герметик и другие продвинутые компоненты.
coconut-drop-technology=Вы можете сбрасывать кокосы на поверхность Церис ещё до того, как пробьёте брешь в магнитосфере, а также игнорировать песчаную атмосферу Ариг для сброса кокосов и туда.
diesel-agriculture=Ведение сельского хозяйства с использованием двигателей на жидком топливе.
canex-excavator=Позволяет выкапывать водные каналы, используя энергию твёрдого топлива.
fermentation-bacteria-cultivation-technology=Позволяет выращивать культуры бактерий для ферментации ресурсов в полезные продукты.
diesel-automation=Открывает машины, работающие на жидком топливе вместо электричества. Позволяет автоматизировать производство вне электросети, но требует постоянной подачи топлива.
pelagos-science-pack=Позволяет проводить исследования в области процессов разложения и деградации.
capsule-rockets=Использование герметика для более надёжной фиксации газовых капсул. Это позволит запускать их в качестве ракет.
improvised-landfill=Позволяет создавать самодельную отсыпку территории из доступных материалов.
wood-spoiling-technology=Позволяет разлагать древесину и кокосовую шелуху для получения порчи.
titanium-barrels=Открывает лёгкие титановые бочки, которые складываются в стопки в два раза лучше стальных, могут загружаться в ракеты в большем количестве и обеспечивают безопасную транспортировку даже самых сложных в хранении жидкостей.
pelagos-biodiesel=Переработка полученной биомассы в биодизель, обеспечивающая устойчивую альтернативу традиционным источникам топлива.
project-diesel-dragon=Вершина дизельной инженерии: работающая на жидком топливе ракетная шахта, которая игнорирует энергосеть и пробивает себе путь на орбиту грубой силой. Открывает «Дизельного дракона».


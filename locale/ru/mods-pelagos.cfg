[tips-and-tricks-item-description]
pelagos-briefing-main=[planet=pelagos] - это островной мир, богатый тропическими [entity=coconut-palm], месторождениями [entity=angels-gas-methane], [entity=iron-ore] и простейшими формами жизни, включая [entity=fish] и [entity=copper-biter-spawner] (которые здесь являются источником меди). Собирайте кокосы и перерабатывайте их в масло, герметик и биотопливо, экспериментируйте с ферментацией и используйте высокотемпературный [entity=calciner] для очистки сырья.
pelagos-coconuts-and-oil=Собирайте кокосы с [entity=coconut-palm]. Мякоть кокоса можно переработать в [fluid=coconut-oil] или превратить в [item=coconut-sealant], который используется для кораблестроения или в качестве топлива.
pelagos-calciners=[entity=calciner] позволяет проводить высокотемпературную очистку и превращать сырьё в очищенные минералы. \nКальцинатор потребляет любую жидкость с параметром «Fuel Value» (топливная ценность), такую как [fluid=crude-oil], [fluid=angels-gas-methane], [fluid=coconut-oil], [fluid=angels-gas-ethanol] и другие. \nЧем выше топливная ценность жидкости, тем меньше её требуется для сжигания и переработки материалов. Используйте его для кокосовой шелухи, древесины, рыбы или других ресурсов, требующих интенсивной обработки.
wooden-platform=[item=wooden-platform] - это модульное покрытие, позволяющее размещать определённые машины и инфраструктуру на воде. Используйте платформы для расширения вашей фабрики на озёра, реки или океаны, помня при этом, что размещение ограничено только лёгкими и устойчивыми конструкциями.\nПоддерживаемые объекты включают: \n- [entity=pipe]\n- [entity=barreling-machine]\n- [entity=radar]\n- манипуляторы\n- конвейеры\n- логистические сундуки и сундуки хранения\n- устройства логической сети, такие как комбинаторы, лампы и т.д.\n- [entity=gun-turret]\n- [entity=heavy-gun-turret]\n- [entity=flamethrower-turret]\n- [entity=rocket-turret]\n- [entity=pump] (кроме дизельного)
electromagnetic_waves=Каждая электрическая машина и генератор (включая солнечные панели и аккумуляторы) излучают невидимые электромагнитные волны.\nЭти излучения представляют собой радиацию и помехи, создаваемые использованием электричества.\nРазличные поверхности поглощают их с разной скоростью - вода почти ничего не поглощает, в то время как песок медленно их нейтрализует.\nГнёзда и существа на Пелагосе могут обнаруживать эти излучения и реагировать на них: чем мощнее ваша электрическая сеть, тем выше вероятность того, что вы их потревожите.\nПомните об этом при строительстве больших, энергоёмких фабрик, или рассмотрите альтернативы, такие как машины с дизельным приводом, если хотите оставаться в безопасности.


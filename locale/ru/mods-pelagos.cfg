[mod-description]
pelagos=Посетите Пелагос. Островная планета, богатая тропическими кокосовыми пальмами, месторождениями метана и малочисленными формами жизни. Собирайте кокосы, перерабатывайте их в масло, герметик и биотопливо, экспериментируйте с ферментацией и используйте высокотемпературные печи для обжига, чтобы улучшить процессы плавки на вашем заводе.


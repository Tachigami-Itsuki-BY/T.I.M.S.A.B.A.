pelagos-allow-fishing=Разрешить манипуляторам ловить рыбу (переопределяет настройки cargo-ships)
pelagos-force-small-electric-generator=Принудительный малый электрогенератор на нефтяной платформе (переопределяет настройки cargo-ships)
pelagos-boat-inventory=Размер инвентаря лодки (переопределяет настройки cargo-ships)
pelagos-cargoship-inventory=Размер инвентаря грузового судна (переопределяет настройки cargo-ships)
pelagos-tanker-capacity=Вместимость танкера (переопределяет настройки cargo-ships)
pelagos-fluid-value-based-flamethrower=Урон огнеметной турели на основе горючести жидкости
allow-galleon-before-pelagos=Разрешить галеон и порт до открытия Пелагоса
pelagos-boat-friction=Трение лодки
pelagos-methane-on-vesta=Заменить метан на Весте месторождениями с Пелагоса
pelagos-override-vesta-methane-fluid-icon=Заменить иконку метана Весты иконкой Пелагоса
pelagos-contribute-to-aquilo-discovery=Исследовательский пакет порчи нужен для открытия и изучения Аквило
pelagos-contribute-to-promethium-science=Исследовательский пакет порчи нужен для открытия и изучения прометия

[mod-setting-description]
pelagos-allow-fishing=Мод Cargo Ships отключает ловлю рыбы манипуляторами, но на планете Пелагос это очень полезная механика. При желании вы всё ещё можете отключить её здесь.
pelagos-force-small-electric-generator=Мод Cargo Ships позволяет полностью отключить встроенный генератор на нефтяной вышке через настройки. Однако для работы Пелагоса этот генератор обязателен в коде. Если выставить генератор вышки в значение «None» и отключить эту настройку, игра выдаст ошибку при запуске.
pelagos-boat-inventory=Значение инвентаря лодки по умолчанию было слишком большим, поэтому оно было уменьшено (по умолчанию в грузовых судах: 80).
pelagos-cargoship-inventory=Значение инвентаря грузового судна по умолчанию было слишком большим, поэтому оно было уменьшено (по умолчанию в грузовых судах: 1000).
pelagos-tanker-capacity=Вместимость танкера по умолчанию была слишком большой, поэтому она была уменьшена (по умолчанию в грузовых судах: 250000).
allow-galleon-before-pelagos=Открывает галеон и порт вместе с исследованием стального топора.
pelagos-boat-friction=Трение малой лодки. Чем меньше значение, тем быстрее лодка. Эта настройка переопределяет скорость лодки из мода Cargo Ships.
pelagos-methane-on-vesta=Изменяет генерацию планеты Веста, удаляя старые плитки метана и добавляя пятна метана, которые можно добывать с помощью нефтяной платформы. Чтобы гарантировать возможность добычи, планета блокируется до открытия нефтяной платформы.
pelagos-override-vesta-methane-fluid-icon=По умолчанию Веста использует другую иконку для жидкого метана, отличную от Пелагоса. Включение этой опции заставит Весту использовать иконку метана с Пелагоса.


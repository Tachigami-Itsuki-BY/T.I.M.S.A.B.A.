[entity-description]
coconut-palm=Тропическое дерево, на котором растут вкусные кокосы.
diesel-mining-drill=Добывает ресурсы, используя мощь дизельного двигателя независимо от электросети. Надёжная, но потребляет много топлива.
diesel-pump=Надёжный насос, работающий на жидком топливе. Перекачивает жидкости без использования электричества, что идеально подходит для автономных систем.

heavy-gun-turret=Стреляет в три раза быстрее стандартной модели, обладает той же дальностью и гораздо большей прочностью. Идеально подходит для высокоинтенсивной обороны.


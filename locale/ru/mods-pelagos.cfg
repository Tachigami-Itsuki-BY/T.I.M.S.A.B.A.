[space-location-description]
pelagos=Островная планета, богатая тропическими кокосовыми пальмами, месторождениями метана и простейшими формами жизни. Кокосы можно выращивать и перерабатывать в герметик, необходимый для кораблестроения, а корабли в этих условиях оказываются идеальным логистическим решением.


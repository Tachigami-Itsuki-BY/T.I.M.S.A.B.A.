[item-description]
coconut=Свежий кокос. Универсальный плод, который можно есть, сжигать или перерабатывать.
coconut-seed=Посадите, чтобы вырастить кокосовую пальму.
coconut-meat=Съедобная мякоть кокоса. Со временем портится.
coconut-husk=Волокнистая оболочка кокоса, полезная в качестве топлива.
coconut-sealant=Герметик, производимый из производных кокоса. Полезен для строительства кораблей. Хорошо горит как топливо.
fermentation-bacteria=Микроорганизмы, культивируемые для процессов ферментации.
pelagos-science-pack=Используется в лабораториях для проведения исследований.

diesel-mining-drill=Добывает ресурсы, используя мощную дизельную энергию, независимо от электросети. Надежный, но потребляющий много топлива.
diesel-assembling-machine=Универсальная сборочная машина, работающая на дизельном двигателе. Работает автономно от электросети, но потребляет постоянный поток топлива.
diesel-agricultural-tower=Сельскохозяйственная башня, работающая на жидкотопливном двигателе.


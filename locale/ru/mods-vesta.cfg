[mod-setting-description]
ske_fusion_thruster_og=Эта настройка возвращает характеристики термоядерного ускорителя к значениям до ослабления (нерфа) в версии 2.0.31, что обеспечивает безумную тягу. Доставляйте свои корабли куда угодно супербыстро и супербезопасно в сочетании со вспомогательными термоядерными ракетами.
ske_realistic_gases=Заменяет разноцветные газы на более общепринятые варианты.
ske_vesta_gases=Если отключено, Веста будет использовать общие газы. В случае несовместимости этого мода с другими модами в плане жидкостей, включите эту опцию, и различные газы, связанные с Вестой, станут независимыми. Однако это означает, что появятся дубликаты.
ske_disable_metal_and_stars_bots=По умолчанию отключено. Если вы играете с модом Metal and Stars и не хотите получать антиматериальных роботов оттуда, включите эту опцию.
ske_vesta_original_generation=Если опция включена, Веста будет использовать оригинальную генерацию. Большие каменистые платформы, попавшие в поле притяжения газового гиганта, будут украшать его поверхность. Отлично подходит для казуальной игры. Если опция выключена, Веста станет реалистичным газовым гигантом, где зоной возрождения будет только платформа газового гиганта, а другой суши не будет. Отлично подходит для тех, кто ищет испытаний.
ske_vesta_legacy_recipes=Восстанавливает оригинальные рецепты версии 1.0 и технологическую цепочку. Эта версия Весты включает больше промежуточных продуктов и зданий, которые могут использоваться исключительно на этой планете. Новый контент для планеты в основном будет добавляться сюда. Если вы хотите гораздо более простой и отлаженный игровой процесс, пожалуйста, отключите эту опцию.
ske_easy_fluids=Если опция включена, большинство рецептов на Весте будут требовать гораздо меньше газов. Эта опция не влияет на Сложный режим.


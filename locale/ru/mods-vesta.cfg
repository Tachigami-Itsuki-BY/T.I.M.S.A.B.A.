[technology-description]
planet-discovery-vesta=Исследуйте преимущественно газовый гигант Веста. Похоже, в его газовом поле застряли скалистые образования. Сама газовая зона представляет собой смесь многих простых газов, включая водород, азот, углекислый газ и гелий. Внутри газового поля также обнаружены следы различных примесей, которые можно отфильтровать.
s1_algea_culturing=Различные газы в атмосфере Весты также являются домом для множества видов микроорганизмов. Следы этих микробов можно собрать из газов, и при тщательном культивировании они могут стать средой обитания для нашего единственного способа получения ресурсов.
s1_dueterium=Открывает возможность извлечения изотопов водорода из атмосферы Весты: дейтерия и трития.
s1_algea_extracting=Водоросли Весты невероятно сильны и хорошо развиты. При подкормке определенными газами и нагреве они изменяют свой состав и начинают производить металлические соединения, подобные бактериальным микробам Глебы.
s1_gas_manipulation_science_pack=Исследования различных улучшений в области газовых технологий.
s2_plateworkings=Водород и кислород являются отличными катализаторами при плавке руды. Мы можем увеличить выход основных металлов, таких как железо или медь, если будем использовать два газа при сжигании.
s2_fusion_enhancements=Открывает возможность передачи плазмы на большие расстояния.
ske_fusion_thruster=Наши ускорители могут быть дополнительно модернизированы, теперь они используют энергию плазмы, чтобы разгонять наши платформы быстрее и дальше, чем когда-либо прежде, при этом используя более энергоэффективный источник энергии.

iridium-smelting-1=Продвинутые этапы переработки для производства иридия.
iridium-smelting-2=Дополнительные этапы плавки для снижения потерь материала.
iridium-smelting-3=Дополнительные этапы плавки для снижения потерь материала.


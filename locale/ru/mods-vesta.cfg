[mod-description]
skewer_planet_vesta=Далёкий газовый гигант. В его пугающе плотной атмосфере дрейфуют одиночные обломки скал. Веста - это мир газа, где всё завязано на работе с газами. При включённом моде Shattered Planet в игру вносятся изменения, особенно в процесс создания газов, а пара зданий переносится из Shattered сюда. На данный момент интеграции рецептов с Krastorio 2, Spaced Out или BZ Ores нет, но они внесены в список несовместимых; игра с любым из этих глобальных модов сделает Весту сложнее, чем задумывалось. Баланс планеты будет меняться и дорабатываться на основе предложений игроков.
skewer_planet_vesta_assets=Ресурсы для Планеты Веста от CPU Black Heart.
skewer_planet_vesta_assets_2=Ресурсы для Планеты Веста от CPU Black Heart.


[item-description]
angels-solid-saw=«Пришёл, подпилил, расколол».

angels-temperate-1=Вил. Растение из мест, где ещё не ступала нога человека.
angels-temperate-2=Пушистик. Вызывает непреодолимое желание пойти поспать.
angels-temperate-3=Кисляк. Лучше всего раскрывается в остром соусе.
angels-temperate-4=Адаптивник. Найдёт применение в самых разных сферах.
angels-temperate-5=Вкусняшка. Обладает крайне богатой палитрой вкусов.

angels-swamp-1=Орешник. Сводит с ума в прямом смысле слова.
angels-swamp-2=Живчик. Похоже, растёт вообще вопреки любым условиям.
angels-swamp-3=Командир. Не используйте слишком много.
angels-swamp-4=Бинарник. Либо растёт, либо нет — третьего не дано.
angels-swamp-5=Перчик. Такое ощущение, что он на вас орёт.

angels-desert-1=Сластёна. От него на душе становится очень тепло и уютно.
angels-desert-2=Перфекционист. Растёт строго упорядоченными линиями.
angels-desert-3=Ударник. Всегда выстраивается в идеальные ряды.
angels-desert-4=Фанатик. Вечно в динамике.
angels-desert-5=Солончак. Требует крайне осторожного обращения.

angels-crop-farm-processed=Сельскохозяйственный продукт, полученный из:

raw-fish=Дружеское напоминание для тех, кто знал Factorio до того, как сюда заглянул Ангел.
angels-alien-fish-1-raw=Самая безобидная рыба на этой инопланетной планете.
angels-alien-fish-2-raw=Абсолютно невнимательные к окружению, но очень неприхотливые существа.
angels-alien-fish-3-raw=Милая рыбка на первый взгляд, но лучше её не злить.

angels-bio-raw-meat=На вкус как курица...

angels-bio-tile=Усиливает естественную способность почвы поглощать загрязнение, уменьшая облако смога на вашей базе. Немного увеличивает скорость бега. Идеально подходит для покрытия территории вокруг фабрики.\n[font=default-semibold][color=1,0.9,0.75]Поглощение загрязнения:[/color][/font] __1__/с


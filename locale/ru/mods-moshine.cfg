[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine] - это жаркая вулканическая планета, богатая [item=angels-solid-sand] (который откроет доступ к [item=silicon] и [item=bob-glass]) и [item=neodymium-ore] (отличная основа для создания [item=magnet]). Здесь так жарко, что построить [entity=accumulator] довольно сложно, но, к счастью, повсюду есть горячие [entity=steam-geyser]. Рекомендуется взять с собой хотя бы [entity=foundry], чтобы иметь возможность перерабатывать [fluid=lava] из лавовых озер.

[tile-name]
moshine-lava=Очень горячая лава
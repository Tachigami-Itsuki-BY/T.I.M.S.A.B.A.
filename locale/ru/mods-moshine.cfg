[technology-description]
planet-discovery-moshine=Очень солнечная планета, богатая неодимом, кремнием и солнечной энергией. Несколько таинственных разбившихся зондов хранят в себе ценные знания, которые мы могли бы использовать для расширения границ искусственного интеллекта.
moshine-concrete-from-molten-iron-and-sand=Производство бетона из расплавленного железа и песка.
moshine-petroleum-from-sand-sulfur-steam-carbon=Производство попутного нефтяного газа из песка, серы и угля.
moshine-tech-silicon=Позволяет перерабатывать песок в кремний.
moshine-tech-glass=Выплавка стекла из песка.
moshine-tech-silicon-cell=Кремниевые элементы — важнейшая деталь для компьютеров.
moshine-tech-silicon-carbide=Карбид кремния используется в качестве мощного изолятора.
moshine-tech-magnet=Переработка неодима и железа в мощные магниты.
moshine-tech-datacell-empty=Позволяет обрабатывать данные и хранить их в ячейках.
moshine-tech-data-processor-building=Процессор данных преобразует информацию и решает связанные с данными задачи.
moshine-tech-neural_computer=Нейрокомпьютер находит новые знания путем обработки огромных объемов информации.
moshine-tech-data-extractor=Позволяет извлекать данные из разбившихся зондов на Мошайне.
moshine-tech-3d-data-storage=Голографические ядра — оптимальный способ размещения и последующего обучения сложной модели ИИ.
moshine-tech-data-processor=Позволяет создавать сложный искусственный интеллект, но будьте осторожны: его первая форма взрывоопасна.
moshine-tech-ai-trainer=Модели ИИ могут оптимизировать сами себя за счет самообучения, достигая невиданных ранее высот в исследованиях.
moshine-tech-ai-tier=Обучение экспоненциально более мощных ядер ИИ.
moshine-tech-processing-grid=Обработка крайне сложных операций.
tech-space-trains=Магнитные поезда с увеличенной вместимостью груза и высокой скоростью.
minimalist-rails=Более прочные рельсы из минералов Мошайна, способные передавать энергию.
minimalist-elevated-rails=Надземный вариант неодимовых рельсов.

neodymium-smelting-1=Продвинутые этапы переработки для производства неодима.
neodymium-smelting-2=Дополнительные этапы плавки для снижения потерь материала.
neodymium-smelting-3=Дополнительные этапы плавки для снижения потерь материала.

boron-processing-2=Бор - это легкий неметаллический химический элемент с широким спектром применения.
phosphorus-processing-2=Фосфор - это высокоактивный неметаллический химический элемент с широким спектром применения.

big-solar-energy=Эти сверхэффективные солнечные панели способны производить в 16 раз больше энергии, чем обычные, занимая при этом в 9 раз больше места.
electric-energy-big-accumulators=Эти сверхэффективные аккумуляторы способны хранить в 16 раз больше энергии, чем обычные, занимая при этом в 4 раза больше места.


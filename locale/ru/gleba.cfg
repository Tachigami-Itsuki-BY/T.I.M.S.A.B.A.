[tips-and-tricks-item-description]
gleba-briefing=[planet=gleba] - влажная болотистая планета с богатой экзотической растительностью, которую можно выращивать с помощью [entity=agricultural-tower] и отправлять на переработку в [entity=biochamber].\nЗдесь отсутствует [entity=angels-ore1], [entity=angels-ore2], [entity=angels-ore3], [entity=angels-ore4], [entity=angels-ore5], [entity=angels-ore6], [entity=coal], [entity=crude-oil], [entity=angels-natural-gas] и [entity=angels-fissure], но растения обеспечивают альтернативные способы производства необходимых предметов.\nБольшинство предметов сельского хозяйства имеют дополнительную проблему - они портятся со временем. Даже [item=agricultural-science-pack] имеет ограниченный срок службы и не может быть накоплен.\nБольшие пятиногие существа являются родным видом для этой планеты. [entity=solar-panel] слабее, но всё ещё пригодна для использования.
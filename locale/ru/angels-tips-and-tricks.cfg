angelsaddons-storage=Этот мод добавляет разнообразные силосы, склады и герметичные резервуары от Angel's независимо от основного набора модов Angel's.
angelsaddons-storage-notes=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Силосы занимают площадь 4x4 клетки и вмещают 240 слотов (логистические версии могут отличаться).\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Склады занимают площадь 6x6 клеток и вмещают 960 слотов (логистические версии могут отличаться).\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Резервуары для жидкостей обладают гораздо большей емкостью, чем ванильные

angels-ore-generation=Этот мод [tooltip=Angels refining,tips-and-tricks-description.angelsrefining] заменяет все месторождения руды на новые, которые вам придётся обогащать перед плавкой. Все плавильные руды (из базовой игры/Bob's/YI) будут заменены новыми комплексными рудами: \n\n__1__\n Также появляется новый источник: __2__

angels-ore-refining=Добытые комплексные руды необходимо обогатить, прежде чем вы сможете переплавить и отлить их в пластины. Более продвинутые методы обогащения обеспечат более высокий выход обработанной руды и могут открыть новые виды очищенной руды.\n\nНа данный момент существует 3 различных режима:\n    - Ванильный: обогащение для увеличения выхода железной и медной руды.\n    - Чистый Angel's: обогащение для получения множества разнообразных материалов.\n    - Bob's-Angel's (он же BA или AB): обогащение для получения большого количества модифицированных руд.\n\nОтлично работает в сочетании с Bob's Mods и поддерживает другие модификации, такие как Yuoki Industries (а также, к сожалению, заброшенные моды: Uranium Power и Nuclear.)\nЭтот мод также вводит продвинутую переработку руды, такую как дробление, флотация, кислотное выщелачивание и кристаллизация, для повышения выхода руды и эффективности. Кроме того, мод поставляется с системами очистки сточных вод для использования в этих и других цепочках переработки.\nЦепочки переработки и очистки воды, добавленные в этом моде, исследуются на протяжении всего дерева технологий.

angels-crushing=В качестве первого шага после добычи руду необходимо раздробить во что-то, с чем можно работать. Дробление принимает добытую руду и отделяет твёрдый камень от полезных материалов.\n\nБазовый рецепт превращает комплексную руду [img=item/angels-ore4] в дроблёную руду [img=item/angels-ore4-crushed], а также в [item=angels-stone-crushed].\n[item=angels-stone-crushed] можно перерабатывать в другие материалы в середине игры, но на ранних этапах его можно превратить в [item=stone], [item=stone-brick] и [item=stone-wall]. В некоторых случаях дроблёную руду [img=item/angels-ore4-crushed] можно плавить напрямую, либо её можно обработать дальше и, наконец, отсортировать.
angels-crushing-notes=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Реальные примеры дробления руды существуют в виде шаровых, щёковых, пневматических и ударных дробилок. Это используется для измельчения руды на более мелкие части, тем самым увеличивая площадь поверхности для химической переработки, особенно на следующем этапе - флотации.
angels-floatation=Флотация - это вторичный этап обогащения, который дополнительно промывает дроблёную руду для удаления большего количества примесей. Это первый из этапов химического обогащения с использованием очищенной воды. Рекомендуется иметь поблизости систему очистки воды, а также систему очистки сточных вод для побочных продуктов, таких как жеоды. Это кристаллические материалы, часто встречающиеся в почве и камнях.\n\nБазовый рецепт превращает дроблёную руду с небольшим количеством [fluid=angels-water-purified] в куски руды, с некоторым шансом даёт жеоду и немного сточных вод.\nЖеоды можно перерабатывать в самые разные вещи, в зависимости от установленных модов.\nКуски руды можно отсортировать или дополнительно очистить на следующем этапе - выщелачивании.
angels-floatation-notes=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Реальных примеров флотации руды множество, в основном она проводится с использованием мылоподобного материала и кислой или щелочной водной смеси. Это позволяет разделять материалы в растворе на основе различных физических и химических свойств. Если вы хотите почитать об этом подробнее, поищите информацию о пенной флотации (froth flotation) - это более общий термин для данного процесса.
angels-leaching=Третьим шагом в процессе обогащения является кислотное выщелачивание. Этот процесс растворяет куски руды из предыдущего этапа в сильной кислоте, оставляя после себя немного шлака (предполагается, что на данном этапе это не проблема). Эта смесь руды и кислоты кристаллизуется в относительно однородные кристаллы высокой чистоты. Этот процесс снова использует химические свойства руды.\n\nБазовый рецепт превращает куски руды с 10 единицами кислоты в 2 кристалла руды.\nБольшая часть кислоты, необходимой на этом этапе, может быть получена из предыдущего этапа флотации, но может потребоваться и дополнительная кислота. Это первая стадия без образования отходов.
angels-leaching-notes=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Реальные примеры кислотного выщелачивания обычно относятся к отвалам пустой породы. Раздробленный камень и другие твёрдые отходы из системы очистки руды сбрасываются в большую яму с герметичным бетонным основанием (похожую на большой бассейн) и опрыскиваются кислотами, которые просачиваются сквозь наваленную массу, растворяя любые полезные части грязи, пропущенные ранее. Продуктивный раствор (кислотный раствор), собираемый у основания, богат минералами, которые обычно кристаллизуются для возврата в систему плавки.
angels-purification=Финальный этап переработки руды - это максимальная очистка руды, удаляющая последние примеси для получения чистейшего материала. Сочетание регенеративного тепла, химической обработки и электролиза означает, что в этом процессе не требуются и не тратятся впустую дополнительные твёрдые или жидкие материалы.\n\nБазовый рецепт превращает кристаллы руды в очищенную руду.\nЭтот этап «полировки» руды используется редко, за исключением самых экзотических и редких веществ, чтобы оправдать её высокое качество перед плавкой.

angels-ore-sorting=Пункт сортировки руды представляет собой гигантский продвинутый гравитационный сепаратор, центрифугу и решётчатый сепаратор, который разделяет обогащённую руду на отдельные составляющие (или металлы) для последующей выплавки высококачественных металлов.
angels-ore-sorting-vanilla=\n\nПункт сортировки превращает 4 комплексные руды различного качества обогащения в плавильную руду, самородки и окатыши, давая различную смесь. Самородки и окатыши могут быть дополнительно превращены в большее количество металлической руды. Очищенная руда более высокого качества позволяет получить большее количество плавильной руды. Очищенная руда также генерирует металлический шлак.
angels-ore-sorting-overhaul=\n\nПункт сортировки превращает 6 основных руд различного качества обогащения в разнообразные металлические руды:\n4[img=item/angels-ore4-crushed] Дроблёной руды дают 2 первичные руды, 1 вторичную руду, а также 1 [item=angels-slag].\n8[img=item/angels-ore4-chunk] Кусков руды дают 4 первичные руды, 2 вторичную руду, 2 третичные руды, а также 1 [item=angels-slag].\n8[img=item/angels-ore4-crystal] Кристаллов руды дают 4 первичные руды, 2 вторичную руду, 3 третичные руды, а также 1 [item=angels-slag].\n8[img=item/angels-ore4-pure] Очищенной руды дают 4 первичные руды, 2 вторичные руды и 4 третичные руды.\n\nВы можете увидеть, что даст каждая руда, если наведёте курсор на руду на земле.\nПервичные и вторичные руды перечислены ниже:\n- [item=angels-ore1] и [item=angels-ore2]: Первичная [item=iron-ore], Вторичная [item=copper-ore]\n- [item=angels-ore3] и [item=angels-ore4]: Первичная [item=copper-ore], Вторичная [item=iron-ore]\n- [item=angels-ore6]: Первичная [item=bob-tin-ore], Вторичная [item=bob-quartz]\n- [item=angels-ore5]: Первичная [item=bob-lead-ore], Вторичная [item=bob-nickel-ore]
angels-ore-sorting-bobs=\n\nПункт сортировки превращает 6 основных руд различного качества обогащения в разнообразные металлические руды:\n4[img=item/angels-ore4-crushed] Дроблёной руды дают 2 первичные руды, 1 вторичную руду, а также 1 [item=angels-slag].\n8[img=item/angels-ore4-chunk] Кусков руды дают 4 первичные руды, 2 вторичную руду, 2 третичные руды, а также 1 [item=angels-slag].\n8[img=item/angels-ore4-crystal] Кристаллов руды дают 4 первичные руды, 2 вторичную руду, 3 третичные руды, а также 1 [item=angels-slag].\n8[img=item/angels-ore4-pure] Очищенной руды дают 4 первичные руды, 2 вторичные руды и 4 третичные руды.\n\nВы можете увидеть, что даст каждая руда, если наведёте курсор на руду на земле.\nПервичные и вторичные руды перечислены ниже:\n- [item=angels-ore1] и [item=angels-ore2]: Первичная [item=iron-ore], Вторичная [item=copper-ore]\n- [item=angels-ore3] и [item=angels-ore4]: Первичная [item=copper-ore], Вторичная [item=iron-ore]\n- [item=angels-ore6]: Первичная [item=bob-tin-ore], Вторичная [item=bob-quartz]\n- [item=angels-ore5]: Первичная [item=bob-lead-ore], Вторичная [item=bob-nickel-ore]

angels-watertype=Примеры типов водной жидкости:\n[fluid=angels-water-saline] Солёная вода\n[fluid=angels-water-purified] Очищенная вода\n[fluid=angels-water-mineralized] Минерализованная вода
angels-wastewaters=Примеры сточных вод:\n[fluid=angels-water-yellow-waste] Серные сточные воды\n[fluid=angels-water-greenyellow-waste] Фтористые сточные воды\n[fluid=angels-water-green-waste] Хлористые сточные воды\n[fluid=angels-water-red-waste] Азотные сточные воды
angels-water-processing=Перерабатывайте морскую и сточную воду в очищенную воду, а также извлекайте полезные твёрдые вещества в [entity=angels-hydro-plant] гидросооружении.
angels-water-processing-vanilla=\nПревращайте воду в полезную [fluid=angels-water-saline] солёную воду для получения солей и в [fluid=angels-water-purified] очищенную воду для обеспечения таких процессов переработки руды, как флотация. \nИзвлекайте [item=sulfur] серу из [fluid=angels-water-yellow-waste] серных сточных вод для её повторного возврата в технологический процесс.
angels-water-processing-overhaul=\nПревращайте воду в полезную [fluid=angels-water-saline] солёную воду для получения солей и в [fluid=angels-water-purified] очищенную воду для обеспечения таких процессов переработки руды, как флотация.\n\n
angels-water-processing-voiding=\nВы можете удалять излишки [tooltip=водных жидкостей,tips-and-tricks-description.angels-watertype] и [tooltip=сточных вод,tips-and-tricks-description.angels-wastewaters] из игры с помощью [entity=angels-clarifier] отстойника.\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Полный список жидкостей, которые можно утилизировать, смотрите в слоте входящих жидкостей в рецептах отстойника.\n

angels-petrochem=Мод, который перерабатывает нефтехимическую систему, делая её более сложной и псевдореалистичной (но без фанатизма).\nСырые ресурсы должны пройти через цепочки химической переработки, чтобы получить:\n__1__\n Мод также добавляет новую скважину: __2__
angels-air-filtering=Кислород и азот являются ключевыми базовыми материалами для многих промышленных процессов, часть из которых есть в этом моде. Например, использование [fluid=angels-gas-oxygen] вместо обычного воздуха повышает эффективность процессов плавки. Поэтому возможность разделения воздуха на [fluid=angels-gas-oxygen] и [fluid=angels-gas-nitrogen] является ключевой технологией.
angels-air-filtering-notes=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Атмосфера Земли состоит примерно из 21% кислорода и 79% азота.\nЭтот мод использует немного другие пропорции.

angels-bioprocessing-intro=Исследуйте эту инопланетную планету, чтобы найти флору (растительный мир) и фауну (животный мир) и использовать их в своих интересах. Этот мод предлагает альтернативу нефтехимическим процессам и стимулирует изучение окрестностей.\n
angels-bioprocessing-intro-nauvis=[font=default-bold]Переработка на Наувисе[/font]:\n - [img=item/angels-algae-farm] Выращивание водорослей - ранние методы фермерства для получения растительной массы.\n - [img=item/angels-bio-arboretum-1] Выращивание деревьев – основано на культивации местных видов деревьев для получения древесины, смолы, пластика и резины.\n
angels-bioprocessing-intro-vegetables=\n[font=default-bold]Переработка овощей[/font]:\n - [img=item/angels-desert-garden] Некоторые местные растения содержат семена, из которых получаются полезные культуры.\n - [img=item/angels-crop-farm] Сажайте и выращивайте эти культуры для получения полезных продуктов.\n
angels-bioprocessing-intro-animals=\n[font=default-bold]Переработка продукции животноводства[/font]:\n - [img=item/angels-bio-refugium-fish] Некоторые местные рыбы являются ценным источником питательных веществ и продуктов на основе масел.\n - [img=item/angels-bio-refugium-puffer] Некоторые мелкие местные летающие существа отлично справляются с переработкой опасных газов в полезные продукты.

angels-bioprocessing-nauvis=Исследование и использование быстрорастущих водорослей - самая ранняя часть этого мода. Поиск особых деревьев в разных биомах позволяет выращивать их возобновляемым способом. В то же время фермы водорослей культивируют низкосортную, требующую много воды растительность для получения полезных базовых материалов, таких как целлюлоза и метанол.\nЭто небольшой экскурс в то, как человечество использовало растения в непищевых целях в доиндустриальную эпоху.\n\nЭта часть мода сосредоточена на выращивании водорослей и деревьев с использованием отходов и воды.
angels-nauvis-algae=Исследование и использование быстрорастущих водорослей для получения полезных продуктов.\n\n
angels-nauvis-notes-algae-green=[font=default-bold]ПРИМЕЧАНИЯ[/font]: Метанол в обиходе называют древесным спиртом, так как раньше его обычно получали путём выжигания древесины и перегонки паров.\n\n
angels-nauvis-notes-algae-brown=[font=default-bold]ПРИМЕЧАНИЯ[/font]: Карбонат натрия традиционно получали путём сушки и сжигания морских водорослей, пока промышленная революция не открыла альтернативные и более экологичные методы.\n              Альгиновая кислота обычно содержится в клеточных стенках растений. Особенно высокая её концентрация в растительных смолах (камедях). Она довольно липкая, поэтому её можно использовать в качестве связующего вещества при производстве бумаги.\n\n
angels-nauvis-notes-algae-brown-lithia= - Бурые водоросли также можно перерабатывать в [item=angels-solid-lithium] в качестве альтернативы использованию [fluid=angels-thermal-water].\n
angels-nauvis-notes-algae=\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Переработка водорослей обычно используется на ранней стадии игры как метод производства сложных материалов, пока не станут доступны другие способы. Это связано с тем, что биопереработка обычно идёт медленно и её не так просто масштабировать под нужды поздней игры.
angels-nauvis-trees=Исследуя планету, вы найдёте различные виды лиственных деревьев в дополнение к хвойным деревьям из базовой игры.\nДобывайте семена из этих деревьев и начните выращивать собственные леса как возобновляемый источник [item=wood]. Более продвинутая переработка открывает доступ к улучшенным методам выращивания, позволяя извлекать из этих особых деревьев смолу, пластик и резину.\n\nЭти деревья отмечены [font=default-bold]светло-синим квадратом[/font] на миникарте и встречаются в разных биомах в зависимости от уровня влажности.\n
angels-nauvis-notes-trees=[font=default-bold]ПРИМЕЧАНИЯ[/font]: Поскольку появление особых деревьев привязано к уровню влажности, а не к конкретным «биомам», моды вроде Alien Biomes не блокируют их создание. Тем не менее, шанс их появления довольно мал.
angels-nauvis-arbor=Особые деревья можно превратить в генераторы семян. Они создают семена, расходуя легкодоступные материалы ([item=angels-solid-mud], [item=angels-solid-soil], [item=angels-solid-sand]) и немного влаги ([img=fluid/water] вода, [img=fluid/angels-water-light-mud] жидкая грязь или [img=fluid/angels-water-saline] солёная вода).\nЗатем эти семена можно культивировать в [img=item/angels-bio-arboretum-1] арборетуме (питомнике) для получения [img=item/angels-solid-tree] деревьев на древесину или деревьев и сока в зависимости от вида дерева (см. предыдущий совет).
angels-nauvis-arbor-compost=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Чтобы получить почву или удобрения, необходимые для арборетумов (хотя некоторым рецептам не нужно ни то, ни другое), вам придётся делать компост.\n  - [img=item/angels-solid-compost] Компост можно получить, отправляя большинство материалов биопереработки (водоросли, древесину, целлюлозу, семена, культуры) в [img=item/angels-composter] компостер.\nПолный список подходящих материалов можно посмотреть в слоте ингредиентов компостера. Не все материалы дают компост в пропорции 1 к 1, так что ищите более эффективные варианты.\nБолее поздние технологии позволят вам клонировать эти особые деревья, но на раннем этапе их придётся искать в дикой природе.

angels-bioprocessing-vegetables=Исследуя планету, вы найдёте [img=item/angels-desert-garden][img=item/angels-swamp-garden][img=item/angels-temperate-garden] сады, которые можно изучить и переработать в семена. Эти семена позволят вам самостоятельно выращивать растения. Перерабатывайте их для получения питательных веществ, топлива и масел. Сады также можно перерабатывать для получения [img=item/angels-token-bio] образцов растительной жизни. Они используются для исследования продвинутых фермерских построек, улучшений ферм, более эффективных рецептов древесины и сложных технологических процессов.\n\nЭти сады отмечены [font=default-bold]светло-зелёным квадратом[/font] на миникарте и встречаются в разных биомах в зависимости от уровня влажности.\n
angels-vegetables-farming=После того как сады будут обработаны в [img=item/angels-seed-extractor] экстракторе семян для получения посевного материала, наступит время высаживать и выращивать растения для производства полезных продуктов.\n\n
angels-vegetables-notes-gardens=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Поскольку появление садов привязано к уровню влажности (как и в случае с деревьями), а не к конкретным «биомам», моды вроде Alien Biomes не блокируют их создание. Тем не менее, шанс их появления довольно мал.
angels-vegetables-crops=Результаты переработки собранного урожая в [img=item/angels-bio-processor] биопроцессоре зависят от конкретного рецепта. Это может быть смесь из следующих компонентов:\n
angels-vegetables-notes-crops=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]:\nТолько [img=item/angels-solid-corn] кукурузу и [img=item/angels-solid-fruit] фрукты можно превратить в [img=fluid/angels-liquid-fermentation-raw] основу для ферментации, чтобы затем получить [img=fluid/angels-gas-ethanol] этанол или [img=fluid/angels-liquid-acetic-acid] уксусную кислоту.\nВсе базовые (не продвинутые) продукты можно переработать в [img=fluid/angels-liquid-nutrient-pulp] питательную пульпу. Она используется для получения крайне полезного [img=fluid/angels-gas-acetone] ацетона, а также множества других нефтехимических продуктов - от масел до синтез-газа.

angels-bioprocessing-animals=[font=default-bold]ЛОВИТЕ, ИССЛЕДУЙТЕ, ЭКСПЕРИМЕНТИРУЙТЕ[/font]:\n\nЭта часть мода посвящена дикой природе Наувиса - от разведения рыбы и выращивания иглобрюхов до выведения прирученных кусак ради продвинутых материалов. Они пригодятся для создания ракетного топлива, модулей или мощного оружия.\n
angels-animals-notes-fish=\n[font=default-bold]РЫБА[/font]: Ловите рыбу (4 вида: [img=item/raw-fish] [img=item/angels-alien-fish-1-raw] [img=item/angels-alien-fish-2-raw] [img=item/angels-alien-fish-3-raw]) и разводите её. Это возобновляемый способ восстановления здоровья или источник [img=item/angels-bio-raw-meat] пищи для более крупных животных. Рыбу также можно перерабатывать в масла и [img=item/angels-fish-pulp] рыбную пульпу для процессов, похожих на растениеводство. Из [img=fluid/angels-liquid-polluted-fish-atmosphere] загрязнённой рыбьей воды можно извлекать [img=item/angels-crystal-splinter-raw] осколки кристаллов для их дальнейшей обработки.
angels-animals-notes-puffers=\n\n[font=default-bold]ИГЛОБРЮХИ[/font]: Исследуйте планету, чтобы найти [img=entity/angels-puffer-nest] гнёзда иглобрюхов и добыть их яйца (в дикой природе встречаются только [img=item/angels-bio-puffer-1] газовые иглобрюхи, отмеченные [font=default-bold]жёлтым квадратом[/font] на карте). Разводите этих вонючих существ, чтобы открыть новые способы переработки газов. При вылуплении яиц в цикле разведения остаются [img=item/angels-bio-puffer-egg-shell] яичные скорлупы. Их можно измельчить и смешать с загрязнённой рыбьей водой для получения более ценных [img=item/angels-crystal-shard-raw] кристаллических обломков.\n[font=default-bold]ПРИМЕЧАНИЕ:[/font] Будьте осторожны с шансами мутации иглобрюхов.
angels-animals-notes-biters=\n\n[font=default-bold]КУСАКИ[/font]: Проведите несколько экспериментов над иглобрюхами, и, возможно, вы сможете вывести собственных ручных кусак. Изучайте их, чтобы получать кристаллы, которые помогут увеличить производительность или скорость вашей фабрики.\nРазведение кусак с помощью королев позволяет получать кристаллы всех трёх тиров ([img=item/angels-crystal-splinter-raw] осколки, [img=item/angels-crystal-shard-raw] обломки и [img=item/angels-crystal-full-raw] целые кристаллы) в зависимости от размера кусаки (малые, средние и крупные соответственно).\n[font=default-bold]ПРИМЕЧАНИЕ:[/font] Кусаки едят очень много [img=item/angels-bio-alien-processed-meat] переработанного мяса пришельцев. Убедитесь, что у вас есть большой запас мяса из [img=item/angels-bio-butchery] бойни после разделки иглобрюхов и рыбы, когда доберётесь до этого этапа.

[tips-and-tricks-sub]
angels-algae-green=Они живут за счёт [fluid=angels-water-mineralized] и производят [item=angels-cellulose-fiber], которое можно превратить в [fluid=angels-gas-methanol].
angels-algae-brown=Они живут за счёт [fluid=angels-water-saline] и производят [item=angels-solid-sodium-carbonate] вместе с [item=angels-solid-alginic-acid]. Последнюю можно объединить с [item=angels-cellulose-fiber] для производства [item=angels-solid-paper].
angels-algae-blue=Они живут за счёт [fluid=angels-water-yellow-waste] и [fluid=angels-gas-carbon-dioxide]. Они производят богатые азотом соединения, такие как [fluid=angels-gas-ammonia].\n
angels-algae-red=Они живут за счёт [fluid=angels-thermal-water] и [fluid=angels-gas-ammonia]. Они производят богатые кальцием соединения, такие как [item=angels-solid-calcium-carbonate].\n
angels-trees-swamp=Болотное дерево встречается во «влажных» зонах, предпочитая уровень влажности около __1__ (обычно это тёмно-зелёные или синие травянистые участки).\nБолотные деревья используются для производства древесины или в качестве раннего сырья для производства [img=item/angels-bio-plastic] пластика.\n\n
angels-trees-temperate=Дерево умеренной зоны встречается в «умеренных» районах, предпочитая уровень влажности около __1__ (обычно это светло-зелёные травянистые участки).\nДеревья умеренной зоны используются для производства древесины или в качестве раннего сырья для производства [img=item/angels-bio-resin] смолы.\n
angels-trees-desert=Пустынное дерево встречается в «сухих» районах, предпочитая уровень влажности около __1__ (обычно это песчаные или красно-песчаные участки).\nПустынные деревья используются для производства древесины или в качестве раннего сырья для производства [img=item/angels-bio-rubber] резины.\n
angels-farm-seeds-to-crops=\nПоместите эти культуры на [img=item/angels-crop-farm] базовую ферму или на улучшенную ферму, соответствующую типу культуры ([img=item/angels-swamp-farm] болотная, [img=item/angels-temperate-farm] умеренная, [img=item/angels-desert-farm] пустынная), чтобы вырастить урожай.\nПереработку урожая можно выполнить в [img=item/angels-bio-processor] биопроцессоре, а семена вернуть в [img=item/angels-seed-extractor] экстрактор семян для повторного использования.\n\n 
angels-crops-special-products=\nВключая любой из следующих продуктов из самых продвинутых культур ([img=item/angels-swamp-5], [img=item/angels-temperate-5], [img=item/angels-desert-5]):
angels-fish-artifacts= Перерабатывайте их воду, чтобы извлечь [img=fluid/angels-alien-spores] споры пришельцев, которые можно в дальнейшем переработать в [item=angels-alien-artifact] артефакты пришельцев.
angels-fish-artifacts-bob= Перерабатывайте их воду, чтобы извлечь [img=fluid/angels-alien-spores] споры пришельцев, которые можно в дальнейшем переработать в [item=bob-alien-artifact] артефакты пришельцев.
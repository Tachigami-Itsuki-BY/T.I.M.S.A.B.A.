[mod-setting-description]
bobmods-assembly-limits=Включает классическую механику, при которой для сборки предметов с большим количеством ингредиентов требуются более продвинутые заводы.

bobmods-enemies-enableartifacts=Если включено, из врагов могут выпадать инопланетные артефакты.
bobmods-enemies-enablesmallartifacts=Если включено, из врагов могут выпадать малые инопланетные артефакты.
bobmods-enemies-enablenewartifacts=Если включено, из врагов могут выпадать цветные инопланетные артефакты.
bobmods-enemies-aliensdropartifacts=Если включено, артефакты будут выпадать из кусак и плевак, а не только при разрушении их ульев.
bobmods-enemies-leviathanfrequency=Определяет вероятность появления левиафанов при максимальном факторе эволюции.
bobmods-enemies-biggersooner=Если включено, используется изменённая таблица появления врагов, при которой более крупные особи появляются на более низких уровнях эволюции.
bobmods-enemies-superspawner=Если включено, на карте могут появляться супер-ульи. Они прочнее обычных и гораздо чаще порождают опасных врагов.
bobmods-enemies-healthincrease=Увеличивает запас здоровья некоторых видов врагов.
bobmods-enemies-factionsappear=Уровень эволюции врагов, при котором на карте начнут появляться новые фракции. Значение 0 сделает начальный этап игры очень сложным.
bobmods-enemies-qualityenemies=Новые ульи врагов могут появляться с повышенным качеством, что позволит им порождать более качественных юнитов и оставлять после себя более ценную добычу.
bobmods-enemies-originalcolors=Ульи врагов будут отображаться на карте стандартным красным цветом вместо уникальных цветов фракций, облегчающих их идентификацию.
bobmods-enemies-radarscanlimit=Ограничивает количество предметов на земле, которые наземный радар может пометить под снос за один цикл. Это немного снижает нагрузку на производительность, но главная цель - не дать строительным роботам надолго отвлекаться на сбор лута. Значение 0 снимает это ограничение.
bobmods-enemies-randomizeenemies=Новые фракции врагов будут открываться в случайном порядке. Настройка применяется только при старте новой игры или при первом добавлении этого мода в сохранение.
bobmods-enemies-factionlist=Список всех появляющихся фракций в их стандартном (не случайном) порядке открытия. Вы можете свободно менять этот порядок. Разделяйте названия строго запятыми без пробелов. Удаление более чем одной фракции может усложнить сбор всех типов артефактов. Фракции этого мода, удалённые из списка посреди игры, не исчезнут с карты, но новые ульи этого типа перестанут появляться.

bobmods-inserters-long1=Если включено, будет доступно исследование «Длинные манипуляторы 1», позволяющее изменять их длину.\nНастройка принудительно активируется, если включена «Переработка манипуляторов» в моде Bob's Logistics.
bobmods-inserters-long2=Если включено, будет доступно исследование «Длинные манипуляторы 2», открывающее конфигурацию с очень большой зоной досягаемости.\nНастройка не работает, если отключено исследование «Длинные манипуляторы 1».
bobmods-inserters-more2=Если включено, будет доступно исследование «Дополнительные манипуляторы 2», позволяющее настраивать точки взаимодействия на любые клетки в пределах зоны досягаемости.
bobmods-inserters-show-window=Если включено, в отдельном окне настройки появится предпросмотр, отображающий текущий конфигурируемый манипулятор.
bobmods-inserters-gui-position=Выберите, в каком месте окно настройки манипулятора должно прикрепляться к основному интерфейсу при его открытии.\nЕсли выбрано «Выкл», а кнопка настройки скрыта, окно будет доступно только по нажатию [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].
bobmods-inserters-button-enable=Добавляет кнопку в верхнем левом углу экрана для доступа к настройке манипуляторов.\nЕсли кнопка отключена, а позиция закрепления установлена на «Выкл», окно будет доступно только по нажатию [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].

bobmods-library-recipe-cleanup=Если включено, на этапе финальных проверок при загрузке игры ингредиенты в рецептах будут проверяться на наличие дубликатов и некорректных значений.

bobmods-logistics-flyingrobotframes=Если включено, в рецептах будут использоваться промежуточные каркасы летающих роботов.
bobmods-logistics-robotparts=Если включено, в рецептах будут использоваться промежуточные компоненты роботов (инструменты и электронные мозги логистических/строительных дронов).
bobmods-logistics-robotrequireprevious=Если включено, для создания логистических и строительных роботов потребуется робот предыдущего уровня.
bobmods-logistics-drainlessinserters=Если включено, у всех манипуляторов будет полностью удалено потребление энергии в режиме ожидания (в простое).
bobmods-logistics-disableroboports=Если включено, стандартные дронопорты будут отключены, что заставит вас использовать модульные дронопорты. Это также затрагивает комбинированные дронопорты из модов Bob's Equipment и Vehicle Equipment.
bobmods-logistics-beltrequireprevious=Если включено, для создания конвейеров и связанных с ними объектов потребуется аналогичный элемент предыдущего уровня.
bobmods-logistics-inserterrequireprevious=Если включено, для создания манипуляторов потребуется манипулятор предыдущего уровня.
bobmods-logistics-inserteroverhaul=Включение этой опции полностью перерабатывает манипуляторы: добавляет новые уровни и полностью изменяет рецепты. Также удаляется стандартный длинный манипулятор, но вы сможете сделать длинным абсолютно любой манипулятор.
bobmods-logistics-beltoverhaul=Включение этой опции перерабатывает транспортные конвейеры: добавляет новый уровень, балансирует скорость и полностью изменяет рецепты.
bobmods-logistics-ugdistanceoverhaul=Включение этой опции изменяет максимальную длину для всех подземных конвейеров и труб.
bobmods-logistics-beltstarting=Задает длину подземной части конвейера самого первого уровня.
bobmods-logistics-beltperlevel=Задает, на сколько клеток увеличивается длина подземного конвейера с каждым последующим уровнем.
bobmods-logistics-pipestarting=Задает длину подземной части труб самого первого уровня.
bobmods-logistics-pipeperlevel=Задает, на сколько клеток увеличивается длина подземной трубы с каждым последующим уровнем.
bobmods-logistics-beltoverhaulspeed=Если включено, скорость движения транспортных конвейеров будет обновлена.
bobmods-logistics-beltspeedperlevel=Задает скорость перемещения предметов для каждого уровня конвейера (работает только при включенной переработке скорости конвейеров). Пожалуйста, используйте значения, кратные 1.875.
bobmods-logistics-fluidwagonbase=Задает объем жидкости, который может хранить вагон-цистерна, в тысячах единиц (по умолчанию 50, что означает 50к).
bobmods-logistics-storagetankbase=Задает объем жидкости, который может хранить резервуар, в тысячах единиц (по умолчанию 25, что означает 25к).
bobmods-logistics-trains=Если включено, в игре станут доступны новые поезда (локомотивы и вагоны).

bobmods-mining-miningdrills=Если включено, станут доступны новые улучшаемые буровые установки.
bobmods-mining-areadrills=Если включено, станут доступны новые улучшаемые буровые установки большой площади.
bobmods-mining-pumpjacks=Если включено, станут доступны новые улучшаемые нефтяные вышки.
bobmods-mining-miningaxes=Если включено, станут доступны новые, более эффективные ручные инструменты для добычи.
bobmods-mining-waterminers=Если включено, станут доступны насосы для добычи подземных вод.
bobmods-mining-steamminingdrills=Если включено, станет доступна новая паровая буровая установка.

bobmods-modules-enablegodmodules=Если включено, станут доступны модули бога и соответствующие исследования.

bobmods-ores-infiniteore=Делает все месторождения руды бесконечными.
bobmods-ores-enhancestone=Если включено, камень будет появляться в виде более крупных и богатых жил.
bobmods-ores-unsortedgemore=Если включено, месторождения драгоценной руды будут давать несортированные драгоценные камни. Если выключено - камни конкретных типов.
bobmods-ores-leadgivesnickel=Если включено, при добыче свинца также можно получить никель.
bobmods-ores-leadnickelratio=Определяет частоту получения никеля по отношению к свинцу.
bobmods-ores-nickelgivescobalt=Если включено, при добыче никеля также можно получить кобальт.
bobmods-ores-nickelcobaltratio=Определяет частоту получения кобальта по отношению к никелю.
bobmods-ores-gemsfromotherores=Если включено, алмазы можно будет получить при добыче угля, рубины, сапфиры и топазы - из бокситов, а аметисты и изумруды - из кварца.
bobmods-ores-gemprobability=Определяет частоту выпадения драгоценных камней при добыче угля, бокситов или кварца.
bobmods-ores-startinggroundwater=Добавляет источник грунтовых вод в стартовую зону.
bobmods-gems-rubyratio=Определяет частоту выпадения рубинов.
bobmods-gems-sapphireratio=Определяет частоту выпадения сапфиров.
bobmods-gems-emeraldratio=Определяет частоту выпадения изумрудов.
bobmods-gems-amethystratio=Определяет частоту выпадения аметистов.
bobmods-gems-topazratio=Определяет частоту выпадения топазов.
bobmods-gems-diamondratio=Определяет частоту выпадения алмазов.
bobmods-ores-enablewaterores=Включает источники грунтовой и литиевой воды.

bobmods-plates-cheapersteel=Если включено, сталь будет стоить 2 железные пластины вместо 5 (или 4 в дорогом режиме).
bobmods-plates-batteryupdate=Если включено, рецепт батареи будет заменён на более соответствующий стилю данного мода.
bobmods-plates-inventorysize=Переопределение размера инвентаря персонажа. Изменение этого параметра изменит инвентарь игрока.
bobmods-plates-purewater=Если включено, в игре появится чистая вода. Она потребуется для электролиза и заменит собой результат добычи грунтовых вод. Также её можно получить путём конденсации пара.
bobmods-plates-groundwater=Если включено, помпа для бутилирования сможет добывать воду в любом месте карты. При этом принудительное создание участков для добычи воды не произойдёт.
bobmods-plates-vanillabarrelling=Если включено, сборочные автоматы можно будет использовать для розлива жидкостей по бочкам.
bobmods-plates-bluedeuterium=Говорят, дейтерий должен быть синим, так почему бы игре не отображать его именно так!
bobmods-plates-convert-recipes=Если включено, будут добавлены дополнительные рецепты для взаимной конвертации различных типов печей.
bobmods-plates-expensive-electrolysis=Если включено, увеличивает энергопотребление электролиза. Это сделано для того, чтобы получение водорода методом электролиза обходилось дороже, чем выгода от его сжигания для выработки энергии.

bobmods-revamp-old-oil=Если включено, вносит изменения в производственную цепочку переработки нефти.\nТакже удаляет ванильные рецепты серы и серной кислоты, добавляя способы получения серы и диоксида серы, если установлен мод MCI.
bobmods-revamp-oil=Если включено, вносит более реалистичные изменения в цепочку переработки нефти.\nЗаменяет попутный нефтяной газ на выходе переработки на кислый газ, который затем можно переработать в попутный газ.\nУдаляет ванильные рецепты серы и серной кислоты, а также добавляет сероводород в рецепт переработки кислого газа, если установлен мод MCI.\nИмеет приоритет над старой версией переработки нефти и серы.
bobmods-revamp-hardmode=Если включено, расширяет некоторые упрощённые химические процессы для большей реалистичности.\nЭто затронет рецепты диоксида азота, азотной кислоты, серной кислоты, перхлората лития, хлорида кальция, карбоната натрия, оксида кобальта и крекинга попутного нефтяного газа в водород.

bobmods-burnerphase=Блокирует технологии, не использующие твердое топливо, за соответствующими исследованиями.

bobmods-vehicleequipment-enablevehiclegrids=Если включено, добавляет сетку оборудования для транспортных средств из базовой игры.

bobmods-warfare-robotupdate=Если включено, боевые роботы получат обновлённые рецепты и новый уровень развития. Часть настроек наследуется из мода Logistics.
bobmods-warfare-drainlesslaserturrets=Если включено, у лазерных турелей полностью удаляется потребление энергии в режиме ожидания (в простое).
bobmods-warfare-spidertron-overhaul=Изменяет механику сборки паукохода (спайдертрона), разделяя её на несколько этапов.
bobmods-warfare-spidertron-needsfuel=Позволяет выбрать, каким паукоходам требуется топливо.\nДля всех спайдертронов, не требующих топлива, в рецепты крафта будут добавлены портативные реакторы.
bobmods-warfare-vehicleflamethrowerstartsfires=Если включено, автомобильный огнемёт модифицируется и становится более похожим на стационарную огнемётную турель.


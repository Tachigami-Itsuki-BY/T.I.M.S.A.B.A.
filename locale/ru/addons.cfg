[mod-setting-description]
setting-early-sintering-oven=Позволяет открыть печь для спекания раньше в дереве технологий.
setting-no-spoilage=Отключает порчу для всех предметов, предотвращая их превращение в испорченные продукты.
setting-early-cliff-explosives=Позволяет открыть взрывчатку для скал раньше в дереве технологий.
setting-science-pack-nostalgia=Вместо замены старых моделей научных пакетов на новые, эта настройка заменяет новые модели научных пакетов на старые.
setting-multi-building=Позволяет объединять паровые двигатели, турбины, солнечные панели и аккумуляторы в компактные мультиблочные варианты размером 2x и 4x.
setting-dynamic-underground-belts=Подземные конвейеры могут растягиваться до N клеток, но расходуют обычные конвейеры на всё покрываемое расстояние.
setting-dynamic-pipe-to-ground=Подземные трубы могут растягиваться до N клеток, но расходуют обычные трубы на всё покрываемое расстояние.
setting-real-incineration=Если включено, то сжечь можно только то, что горит в реальности.
setting-rebalance-belts-and-pipes=Если включено, то дальность подземных конвейеров и труб будет фиксированна.
setting-flow-control-new=Добавляет трубы с ограниченными соединениями для упрощения построения параллельных трубопроводов.
setting-defrost-multiplier=Определяет, во сколько раз увеличивается время разморозки замороженного аналога предмета. Базовое значение берется от времени порчи оригинального предмета. Максимальное значение (720) позволяет предмету с 12-часовым сроком порчи храниться в замороженном виде до одного года реального времени.

setting-za-horogon-extra-science-packs=Добавляет криогенные/прометиевые колбочки к технологиям МК5-МК6, металлургические/электромагнитные к плазменному оружию и электромагнитные после МК3 для аккумуляторов и лазерных технологий.
setting-zb-horogon-high-tier-recipes=Добавляет материалы Space Age в высокоуровневые рецепты аккумуляторов, солнечных панелей, турбин, реакторов и модулей. Исследовательские пакеты добавляются в технологии, а не в рецепты.
setting-zc-horogon-module-planet-lock=Добавляет планетарные исследовательские пакеты Space Age к высоким технологиям модулей.
setting-zd-horogon-tier-technology-costs=Старый переключатель оставлен для сохранений. Horogon-баланс теперь всегда применяет отдельные множители МК1-МК6 ниже для каждой категории.
setting-zi-horogon-mech-armor-technology-cost=Фиксированная стоимость технологии меха-брони. Если включена настройка ниже, силовая броня МК5-МК1 получает 75% стоимости предыдущего тира.
setting-zj-horogon-power-armor-chain-from-mech=Если включено, стоимость силовой брони считается от меха-брони: МК5 = 75%, МК4 = 75% от МК5, и так далее до МК1.


[mod-setting-description]
reskins-lib-icon-tier-labeling=Отображает цветные полосы на иконках для указания их уровня (тира).
reskins-lib-icon-tier-labeling-style=Задает стиль отображения меток уровня на иконках.
reskins-lib-tier-mapping=Задает способ распределения уровней для построек и предметов.\n\n[font=default-semibold]Традиционный[/font]: распределение уровней соответствует названиям. Объекты 1, 2 и 3 в серии привязываются к уровням 1, 2 и 3 соответственно.\nНапример, ядерные реакторы начинаются с 1-го уровня.\n\n[font=default-semibold]Прогрессивный[/font]: распределение уровней соответствует этапам развития в игре. Предметы, получаемые позже и требующие более сложных компонентов, изначально привязываются к более высоким уровням.\nНапример, ядерные реакторы начинаются сразу с 3-го уровня.
reskins-lib-customize-tier-colors=[img=utility.warning_icon] Использование настраиваемых цветов активно задействует слои спрайтов для предметов и объектов, что значительно увеличивает количество спрайтов на экране. Это может негативно сказаться на производительности.\n\nВключает индивидуальную настройку цветов уровней с помощью палитр ниже.
reskins-lib-custom-colors-tier-0=Задает цвет для Уровня 0.
reskins-lib-custom-colors-tier-1=Задает цвет для Уровня 1.
reskins-lib-custom-colors-tier-2=Задает цвет для Уровня 2.
reskins-lib-custom-colors-tier-3=Задает цвет для Уровня 3.
reskins-lib-custom-colors-tier-4=Задает цвет для Уровня 4.
reskins-lib-custom-colors-tier-5=Задает цвет для Уровня 5.
reskins-lib-custom-colors-tier-6=Задает цвет для Уровня 6.
reskins-lib-scope-entities=Включает изменение внешнего вида строений, роботов и транспорта.
reskins-lib-scope-equipment=Включает изменение внешнего вида модулей экипировки и оборудования.
reskins-lib-scope-items-and-fluids=Включает изменение внешнего вида предметов, жидкостей и связанных с ними рецептов.
reskins-lib-scope-technologies=Включает изменение внешнего вида иконок технологий.
reskins-lib-scope-interface=Включает изменение внешнего вида вкладок производства.

reskins-lib-display-notifications=Разрешает показ уведомлений об обновлениях, а также результатов проверки на отсутствие необходимых модов серии Artisanal Reskins.

reskins-bobs-do-bobassembly=Изменяет внешний вид технологий, сборочных автоматов, печей, нефтеперерабатывающих заводов, дистилляторов, электролизеров и химических заводов, добавленных модом Bob's Assembling Machines.
reskins-bobs-do-bobelectronics=Изменяет внешний вид промежуточных компонентов и рецептов, добавленных модом Bob's Electronics. Не влияет на электронные платы.
reskins-bobs-do-bobelectronics-colored-circuits=Изменяет внешний вид электронных плат из мода Bob's Electronics, окрашивая их в соответствии с текущей картой уровней.
reskins-bobs-do-bobenemies=Изменяет внешний вид инопланетных артефактов, добавленных модом Bob's Enemies.
reskins-bobs-do-bobequipment=Изменяет внешний вид технологий и оборудования, добавленных модом Bob's Equipment.
reskins-bobs-do-bobgreenhouse=Изменяет внешний вид промежуточных компонентов, рецептов, технологий и теплиц, добавленных модом Bob's Greenhouse.
reskins-bobs-do-boblogistics=Изменяет внешний вид деталей роботов, технологий, логистических сундуков, дронопортов, конструкций логистической сети, манипуляторов, конвейеров, резервуаров, помп и труб, добавленных модом Bob's Logistics.
reskins-bobs-do-bobmining=Изменяет внешний вид технологий, буровых установок и нефтяных вышек, добавленных модом Bob's Mining.
reskins-bobs-do-bobmodules=Изменяет внешний вид модулей, маяков и лаборатории исследований модулей, добавленных модом Bob's Modules.
reskins-bobs-do-bobores=Изменяет внешний вид ресурсов и руд, добавленных модом Bob's Ores.
reskins-bobs-do-bobplates=Изменяет внешний вид пластин, шестерней, подшипников и других промежуточных компонентов, рецептов и технологий, а также малых/линейных резервуаров и помп, добавленных модом Bob's Metals, Chemicals, and Intermediates.
reskins-bobs-do-bobpower=Изменяет внешний вид технологий, паровых котлов, двигателей и турбин, солнечных панелей, аккумуляторов, ядерных реакторов, теплообменников, теплопроводных труб и генераторов, добавленных модом Bob's Power.
reskins-bobs-do-bobrevamp=Изменяет внешний вид промежуточных компонентов, рецептов и технологий, добавленных модом Bob's Revamp.
reskins-bobs-do-bobrevamp-reactor-color=Изменяет внешний вид ядерных реакторов, окрашивая их в соответствии с типом топлива (уран, торий, дейтерий) вместо привязки к уровню (тиру).
reskins-bobs-do-bobtech=Изменяет внешний вид научных пакетов, связанных с ними технологий и исследовательских лабораторий, добавленных модом Bob's Technology.
reskins-bobs-do-bobvehicleequipment=Изменяет внешний вид технологий и оборудования, добавленных модом Bob's Vehicle Equipment.
reskins-bobs-do-bobwarfare=Изменяет внешний вид боеприпасов, технологий, турелей, стен и радаров, добавленных модом Bob's Warfare.

reskins-bobs-flip-bulk-inserter-icons=Если включена «Переработка манипуляторов» Бобса, отражает иконки пакетных манипуляторов по горизонтали для повышения контраста с обычными манипуляторами.

reskins-bobs-do-pipe-tier-labeling=Если текстовые обозначения включены, также отображает метки уровня на иконках труб, подземных труб и теплопроводных труб, добавленных модами Bob's Logistics и Bob's Power.
reskins-bobs-do-belt-entity-tier-labeling=Если текстовые обозначения включены, также отображает метки уровня на иконках конвейеров, подземных конвейеров и разделителей, добавленных модом Bob's Logistics.
reskins-bobs-do-furnace-tier-labeling=Если текстовые обозначения включены, также отображает метки уровня на иконках каменных, стальных и электрических печей, добавленных модом Bob's Assembly.
reskins-bobs-do-inserter-tier-labeling=Если текстовые обозначения включены, также отображает метки уровня на иконках манипуляторов, добавленных модом Bob's Logistics.

reskins-bobs-hydrazine-is-blue=Окрашивает гидразиновый генератор в [color=#7ac1de][font=default-bold]светло-синий цвет[/font][/color] в соответствии с цветом топлива. В противном случае генератор будет окрашен как жидкотопливный генератор четвертого уровня.
reskins-bobs-show-alien-decoratives-on-lab=Отображает инопланетные корни и текстуры на корпусе инопланетной лаборатории.

reskins-bobs-do-basic-belts-separately=Включает индивидуальную настройку цвета базовых конвейеров с помощью палитры ниже.
reskins-bobs-basic-belts-color=Задает цвет для базовых конвейеров и связанных с ними объектов.

reskins-bobs-do-progression-based-robots=При использовании [font=default-semibold]Прогрессивного[/font] стиля отображения уровней, тиры логистических и строительных роботов будут соответствовать компонентам роботов из мода Bob's Logistics. Роботы на термоядерной энергии получат цвет, заданный параметром [font=default-semibold]Цвет: Термоядерные роботы[/font], разделяя при этом один уровень с обычными роботами 4-го уровня.
reskins-bobs-fusion-robot-color=Задает цвет для роботов на термоядерной энергии.

reskins-bobs-do-custom-furnace-variants=Включет индивидуальную настройку цвета для различных подтипов печей с помощью палитр ниже.
reskins-bobs-standard-furnace-color=Задает цвет для каменных, стальных, жидкотопливных и электрических печей стандартного типа.
# reskins-bobs-mixing-furnace-color=Задает цвет для каменных, стальных, жидкотопливных и электрических плавильных печей.
reskins-bobs-chemical-furnace-color=Задает цвет для каменных, стальных, жидкотопливных и электрических химических печей.

reskins-angels-do-angelsbioprocessing=Изменяет внешний вид промежуточных компонентов, рецептов, технологий, а также альгоферм, арборетумов, биопроцессоров, скотобоен, компостеров, обычных ферм, инкубаторов, экстракторов питательных веществ, прессов, рефугиумов, генераторов и экстракторов семян деревьев, добавленных модом Angel's Bioprocessing.
# reskins-angels-do-angelsexploration=Эта строка еще не используется; не переводить.
reskins-angels-do-angelsindustries=Изменяет внешний вид больших сундуков и больших логистических сундуков, добавленных модом Angel's Industries.
reskins-angels-do-angelspetrochem=Изменяет внешний вид промежуточных компонентов, рецептов, технологий, а также химических заводов, воздушных фильтров, электролизеров, газоперерабатывающих заводов, крекинг-установок, сепараторов нефти и газа, добавленных модом Angel's Petrochemical Processing.
reskins-angels-do-angelsrefining=Изменяет внешний вид промежуточных компонентов, рецептов, технологий, а также кристаллизаторов, ячеек электролиза, фильтровальных установок, гидросооружений, ожижителей, дробилок руды, флотационных машин, установок выщелачивания, измельчителей руды, обогатительных фабрик, сортировочных комплексов, опреснительных и промывочных установок, добавленных модом Angel's Refining.
reskins-angels-do-angelssmelting=Изменяет внешний вид пластин, слитков, руд и других промежуточных компонентов, рецептов, технологий, а также литейных машин, печей, машин для обработки руды, прессов для гранулирования, смесителей порошков и печей для спекания, добавленных модом Angel's Smelting.
# reskins-angels-do-angelsaddons-cab=Эта строка еще не используется; не переводить.
# reskins-angels-do-angelsaddons-mobility=Эта строка еще не используется; не переводить.
reskins-angels-do-angelsaddons-storage=Изменяет внешний вид рудных бункеров, обычных и логистических складов, а также резервуаров, добавленных модом Angel's Addons - Storage Options.

reskins-angels-use-angels-material-colors=Окрашивает шестерни, подшипники и шарики подшипников в соответствии с цветами материалов Ангела.\n\nНапример, нитиноловые шестерни станут фиолетовыми вместо темно-серых.
reskins-angels-use-angels-material-colors-pipes=Окрашивает трубы в соответствии с цветами материалов Ангела.\n\nНапример, нитиноловые трубы станут фиолетовыми вместо темно-серых.

reskins-angels-use-angels-tier-colors=Окрашивает многоуровневые постройки и предметы в соответствии с цветовой схемой уровней Ангела.\n\nПерекрывается опцией «Включить настраиваемые цвета».
reskins-angels-belts-use-angels-tier-colors=Конвейеры и связанные с ними объекты будут использовать цветовую схему уровней Ангела, если включена опция «__1__».\n\nПерекрывается опцией «Включить настраиваемые цвета».
reskins-angels-use-vanilla-style-ores=Заменяет стандартные спрайты Ангела для руд сафирита, стиратита, живолита, кротинниума, рубита и бобмониума на спрайты в ванильном стиле Factorio.
reskins-angels-use-item-variations=Позволяет слиткам иметь несколько различных вариантов отображения на конвейерах или на земле, аналогично добытой руде.
reskins-angels-use-vanilla-chemical-plant-sprites=Химические заводы в стиле Ангела будут использовать ванильные спрайты и анимацию, если стандартные ванильные химические заводы отключены.


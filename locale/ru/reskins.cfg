[mod-description]
reskins-library=Содержит функции, иконки и спрайты, необходимые для работы всех модов серии Artisanal Reskins. Является частью серии Artisanal Reskins.

reskins-compatibility=Изменяет внешний вид предметов, объектов и технологий в модах, которые не входят в область применения других модификаций Artisanal Reskin. Ограничено теми модами, которые расширяют или хорошо сочетаются с модами Боба и Ангела (Bob's and Angel's mods). Включает иконки высокого разрешения и обновлённые спрайты для приведения этих модов в соответствие со стилем Artisanal Reskins, а также поддерживает настраиваемые игроком цветовые схемы, обозначения и карты уровней (тиров). Подробный список поддерживаемых модов смотрите на портале модов. Является частью серии Artisanal Reskins.

reskins-bobs=Изменяет внешний вид предметов, объектов и технологий в модах Боба (Bob's mods), добавляя цветовую маркировку уровней и текстовые обозначения на иконках. Включает иконки высокого разрешения и обновлённые спрайты для соответствия визуальному стилю ванильной Factorio, а также поддерживает настраиваемые игроком цветовые схемы, обозначения и карты уровней (тиров). Является частью серии Artisanal Reskins.

reskins-angels=Изменяет внешний вид предметов, объектов и технологий в модах Ангела (Angel's mods), добавляя цветовую маркировку уровней и текстовые обозначения на иконках. Включает иконки высокого разрешения, обновлённые трёхмерные модели, эффекты освещения и спрайты, а также поддерживает настраиваемые игроком цветовые схемы, обозначения и карты уровней (тиров). Является частью серии Artisanal Reskins.


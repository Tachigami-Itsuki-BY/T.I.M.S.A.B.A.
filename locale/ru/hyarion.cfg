[tips-and-tricks-item-description]
hyarion-briefing=[planet=hyarion] Планета, состоящая из кристаллов и лавы. Рефракционные лучи света падают с неба и разрушают поверхность.\nНенужные предметы можно уничтожать, сбрасывая их напрямую в [tile=lava]. \nНа Хайарионе используется собственная ракетная шахта и свои рецепты компонентов ракеты.
hyarion-refraction=[planet=hyarion] предлагает уникальный способ выработки энергии.\nИспользуйте [entity=planetaris-big-refraction-ray-collector], чтобы собирать [fluid=planetaris-refraction-light], затем передавайте его с помощью [entity=planetaris-fiber-optics-cable] в [entity=planetaris-refraction-plant].\nТам из [item=planetaris-fluorite] и [fluid=planetaris-refraction-light] производится [fluid=planetaris-pure-light]. Используйте его для выработки энергии в [entity=planetaris-refraction-generator].\nТакже вы можете производить [item=planetaris-charged-fluorite], чтобы перенести производство рефракционной энергии в любое другое место.
hyarion-unstable-gem=[item=planetaris-unstable-gem] - это улучшенная альтернатива [item=cliff-explosives] с большим радиусом действия и повышенным уроном.


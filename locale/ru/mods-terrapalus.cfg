[item-description]
palusium-ore=Палузиевая руда содержит крошечные УФ-кристаллы, которые реагируют и активируются при нагреве.
palusium-plate=Палузиевые пластины - это промежуточный продукт, используемый в создании ультрафиолетовых технологий палузиума.
palusium-powder=Палузиевый порошок представляет собой измельчённую палузиевую руду с легкодоступными кристаллами палузиума.
palusium-crystal=Кристалл палузиума имеет множество вариантов применения в спектре ультрафиолетового излучения.

ultravium-battery=Компактный аккумулятор, насыщенный энергией ультравиума. Используется для зарядки модульной брони на 10 МДж.
ultravium-battery-pack=Увеличенная батарея, состоящая из нескольких ультравиумовых элементов. Используется для зарядки модульной брони на 50 МДж.
ultravium-power-cell=Передовой энергоэлемент высокой ёмкости, использующий очищенный ультравиум. Используется для зарядки модульной брони на 200 МДж.

armor-charging-station=Беспроводным способом заряжает сетки модулей ближайшей брони и транспорта. Радиус: 15 клеток.
armor-charging-station-mk2=Улучшенная зарядная станция с увеличенным радиусом действия и ускоренной зарядкой. Радиус: 22 клетки.
armor-charging-station-mk3=Зарядная станция с максимальным радиусом действия и наивысшей выходной мощностью. Радиус: 30 клеток.

uv-defense-turret=Персональная турель обороны, излучающая УФ-лучи, которые заставляют врагов спасаться бегством в ужасе. Размещается в сетке модулей брони.
uv-personal-shield=Улучшенный УФ-излучением щит, который замораживает ближайших врагов и перехватывает снаряды Страферы в радиусе 10 клеток. Расходует энергию на каждый эффект.

[fluid-name]
ultravium=Ультравиум

[fluid-description]
ultravium=Энергетическая и активная жидкая форма кристаллов палузиума, созданная из болот Терра Палус.

[recipe-description]
ultravium-battery=Создать портативный ультравиумовый аккумулятор для аварийной зарядки брони.
ultravium-battery-pack=Объединить несколько аккумуляторов в увеличенный блок питания.
ultravium-power-cell=Создать энергоэлемент высокой ёмкости для длительных операций.
armor-charging-station=Построить беспроводную зарядную станцию для модульной брони.
armor-charging-station-mk2=Модернизировать зарядную станцию для увеличения радиуса действия.
armor-charging-station-mk3=Построить самую мощную зарядную станцию для брони.
uv-defense-turret=Объединить УФ-технологии с оборудованием персональной обороны.
uv-personal-shield=Улучшить щит возможностью заморозки с помощью УФ-излучения.


[equipment-description]
uv-defense-turret=Персональная турель обороны, улучшенная УФ-технологиями. Поражённые её лучами враги в ужасе спасаются бегством.
uv-personal-shield=Улучшенный УФ-излучением персональный щит, который замораживает врагов и перехватывает снаряды Страйдеров в радиусе 10 клеток. Потребляет 20 кДж на заморозку и 5 кДж на перехват снаряда.
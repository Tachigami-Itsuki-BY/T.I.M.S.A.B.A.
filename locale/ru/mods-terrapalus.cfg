terrapalus-elevation-scale=Управляет размером холмов и особенностей рельефа. Выше = крупнее объекты.
terrapalus-biome-scale=Управляет размером биомных регионов. Выше = крупнее биомы.
terrapalus-mud-basin-scale=Управляет частотой появления грязевых бассейнов. Выше = появляются реже.
terrapalus-lowland-size=Управляет размером болот/низин на Терра Палус.
terrapalus-moisture-threshold=Порог уровня влажности для генерации ландшафта.
terrapalus-starting-area-multiplier=Множитель общего размера начальной зоны.
terrapalus-starting-distance=Расстояние от точки возрождения до начальных низин в клетках.
terrapalus-starting-radius=Радиус начальных низин в клетках.
terrapalus-starting-fertile-radius=Радиус начальных участков плодородной почвы в клетках.
terrapalus-fertile-soil-frequency=Управляет тем, как часто появляются участки плодородной почвы.
terrapalus-fertile-spot-radius=Радиус участков плодородной почвы в клетках.
terrapalus-fertile-spot-spacing=Минимальное расстояние между плодородными участками в клетках.
terrapalus-fertile-region-size=Размер регионов для генерации плодородных участков.
terrapalus-fertile-candidate-spots=Количество потенциальных участков на регион. Выше = более плотное расположение.
terrapalus-spawner-frequency=Частота появления крупных гнёзд врагов.
terrapalus-spawner-size=Множитель размера крупных гнёзд врагов.
terrapalus-small-spawner-frequency=Частота появления малых гнёзд врагов.
terrapalus-small-spawner-size=Множитель размера малых гнёзд врагов.
terrapalus-enemy-safe-zone-radius=Радиус безопасной зоны без врагов вокруг точки возрождения.
terrapalus-fog-opacity=Непрозрачность эффекта тумана (0 = нет тумана, 1 = полный туман).
terrapalus-fog-color-r=Красная составляющая цвета тумана (0-1).
terrapalus-fog-color-g=Зелёная составляющая цвета тумана (0-1).
terrapalus-fog-color-b=Синяя составляющая цвета тумана (0-1).
terrapalus-cloud-opacity=Непрозрачность эффектов облаков (0 = нет облаков, 1 = полная облачность).
terrapalus-cloud-color-r=Красная составляющая цвета облаков (0-1).
terrapalus-cloud-color-g=Зелёная составляющая цвета облаков (0-1).
terrapalus-cloud-color-b=Синяя составляющая цвета облаков (0-1).

[equipment-name]
uv-defense-turret=Персональная УФ-турель обороны

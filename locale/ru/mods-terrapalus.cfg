[entity-description]
inhibitor-lamp=Излучает УФ-свет определённой длины волны, вызывающий неврологическую реакцию у врагов, которая замораживает их, пока лампа подключена к энергии.
inhibitor-lamp-mk2=Лампа-ингибитор увеличенного радиуса действия с увеличенной на 40% зоной заморозки.
inhibitor-lamp-mk3=Лампа-ингибитор максимального радиуса действия с увеличенной на 80% зоной заморозки и наивысшей эффективностью.
inhibitor-lamp-damage=Атакующая лампа, излучающая опасную УФ-радиацию. Замедляет врагов на 50% и наносит 5 единиц урона за тик.
palusium-ore=Грубая кристаллизованная тёмно-сине-фиолетовая руда, которая светится в темноте.

uv-turret=УФ-турели используют лучи концентрированного УФ-света для отпугивания и дезориентации некоторых врагов.
uv-turret-mk2=Улучшенная УФ-турель с увеличенным радиусом действия (35 клеток) и повышенным уроном.
uv-turret-mk3=Максимально мощная УФ-турель с увеличенным радиусом действия (42 клетки) и наивысшим наносимым уроном.
uv-turret-aoe=УФ-турель с уроном по площади, которая поражает всех врагов в радиусе 6 клеток от места попадания.
uv-turret-chain=УФ-турель с цепным уроном. Основная цель получает 20 единиц урона, а ближайшие враги в радиусе 8 клеток — 12 единиц урона.
uv-spotlight=Быстронаводящийся прожектор, который мгновенно замораживает врагов на 30 секунд, после чего переключается на следующую цель. Наносит минимальный урон, служит исключительно для контроля толпы.

armor-charging-station=Беспроводным способом заряжает сетки модулей брони и транспорта в радиусе 15 клеток. Потребляет энергию только во время активной зарядки.
armor-charging-station-mk2=Улучшенная зарядная станция с радиусом действия 22 клетки и скоростью зарядки 2 МВт.
armor-charging-station-mk3=Передовая зарядная станция с радиусом действия 30 клеток и скоростью зарядки 4 МВт.


[technology-description]
planet-discovery-terrapalus=Тёмный, сырой спутник с бесконечными болотами, кусаками, пентаподами и палузиевой рудой.
palusium-processing=Палузиум переплавляется в печи для получения палузиевых пластин.
palusium-crushing=Палузиевую руду можно измельчить в палузиевый порошок.
palusium-liquefaction=Смешивание палузиевого порошка с водой и нефтью для получения ультравиума.
palusium-refining=Очистка палузиевого порошка для получения кристаллов палузиума.
inhibitor-lamp=Использование УФ-свойств кристаллов палузиума для заморозки врагов на месте.
inhibitor-lamp-mk2=Лампа-ингибитор увеличенного радиуса действия с увеличенной на 40% зоной заморозки.
inhibitor-lamp-mk3=Лампа-ингибитор максимального радиуса действия с увеличенной на 80% зоной заморозки.
inhibitor-lamp-damage=Атакующий вариант лампы, который замедляет врагов на 50% и наносит периодический урон.
uv-turret=УФ-турели используют лучи концентрированного УФ-света для отпугивания и дезориентации некоторых врагов.
uv-turret-mk2=Улучшенная УФ-турель с увеличенным радиусом действия и повышенным наносимым уроном.
uv-turret-mk3=Передовая УФ-турель с максимальным радиусом действия и сокрушительным уроном.
uv-turret-aoe=УФ-турель с уроном по площади, которая поражает всех врагов в радиусе действия своего луча.
uv-turret-chain=УФ-турель с цепным уроном, который переходит от основной цели на ближайших врагов.
uv-spotlight=Быстронаводящийся прожектор, который замораживает врагов на 30 секунд, после чего переключается на следующую цель. Чистый контроль толпы.
ultravium-power-systems=Использование энергии ультравиума для зарядки модульной брони на Терра Палус, где недоступна солнечная энергия.
ultravium-power-systems-2=Улучшенные энергосистемы ультравиума с аккумуляторами повышенной ёмкости и зарядными станциями увеличенного радиуса действия.
ultravium-power-systems-3=Передовые энергосистемы ультравиума с энергоэлементами максимальной ёмкости и дальнобойной инфраструктурой зарядки.
uv-personal-equipment=Миниатюризированные УФ-технологии для персональной брони. Включает в себя оборонительную турель, заставляющую врагов спасаться бегством, и щит, замораживающий ближайшие враждебные цели.


[tips-and-tricks-item-description]
arig-briefing=[planet=arig] - это жаркая планета с бескрайними пустынями, где ценные ресурсы можно найти только под землёй или в [tile=arig-sand] с помощью [entity=offshore-pump]. Постоянные песчаные бури делают использование [entity=roboport] невозможным, а большая часть поверхности непригодна для строительства без [item=planetaris-sandstone-foundation].\nБазовые ресурсы можно получить путём просеивания [fluid=planetaris-sand] в [entity=planetaris-sifter].\nВы можете избавляться от ненужных предметов, сбрасывая их прямо на [tile=arig-sand].\nСброс грузов на планету заблокирован до исследования соответствующей технологии (за исключением [item=construction-robot]).
arig-exploring=Иногда ходить по песку очень трудно. Помните, что поедание кактусов - отличный способ передвигаться быстрее! Только будьте осторожны с колючками.
rail-support-deep-sand=После исследования [technology=rail-support-foundations] опоры рельсов можно будет строить прямо на [tile=arig-deep-sand].


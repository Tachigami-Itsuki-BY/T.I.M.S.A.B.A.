[mod-description]
planetaris-arig=Жаркая планета с бескрайними пустынями, где ценные ресурсы можно найти только под землёй или в песке. Постоянные песчаные бури делают использование роботов невозможным, а большая часть поверхности непригодна для строительства без подходящего фундамента. (Внимание: сброс грузов на эту планету заблокирован до окончания исследования)

condensing-agricultural-tower=Добавлена ​​возможность сбора жидкости с растений с помощью новой сельскохозяйственной башни; жидкость хранится в резервуаре внутри башни.


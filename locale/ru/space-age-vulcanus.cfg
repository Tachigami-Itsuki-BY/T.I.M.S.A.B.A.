[tips-and-tricks-item-description]
vulcanus-briefing=[planet=vulcanus] - горячая планета, [fluid=water] отсутствует, [entity=crude-oil], [entity=angels-natural-gas] или [entity=angels-fissure] тоже, но есть несколько новых [tooltip=ресурсов,tips-and-tricks-item-description.vulcanus-resources].\n[fluid=lava] - бесконечный ресурс минералов, заменяющий [entity=angels-ore1], [entity=angels-ore2], [entity=angels-ore3], [entity=angels-ore4], [entity=angels-ore5] и [entity=angels-ore6]. В сыром виде её содержит только [entity=big-rock].\n[entity=solar-panel] гораздо эффективнее. Окружающая среда негостеприимна: горные вулканы, реки лавы, равнины пепла и гейзеры серной кислоты.\n[tile=lava] нельзя засыпать, но гораздо позже её можно будет пересечь по надземным рельсам.
[entity-description]
maraxsis-diesel-submarine=Универсальный транспорт для исследования океанских глубин. Управление осуществляется с помощью __CONTROL_MOVE__. Используйте __CONTROL__maraxsis-trench-submerge__, чтобы спуститься во впадину.\nМожет следовать по автоматическим маршрутам и самостоятельно погружаться во впадину.
maraxsis-nuclear-submarine=Продвинутая атомная подводная лодка с более высокой скоростью и увеличенным багажным отсеком. Управление осуществляется с помощью __CONTROL_MOVE__. Используйте __CONTROL__maraxsis-trench-submerge__, чтобы спуститься во впадину.\nМожет следовать по автоматическим маршрутам и самостоятельно погружаться во впадину.
maraxsis-hydro-plant=Многоцелевая установка для работы с жидкостями, рассчитанная на экстремальное давление. Разместите её в глубоководной впадине или в космосе, чтобы получить четыре дополнительных слота для модулей. Может уничтожать любую жидкость.
maraxsis-pressure-dome=Огромное сооружение, защищающее ваши машины от колоссального давления глубоководья. Требует постоянного снабжения атмосферой [fluid=maraxsis-atmosphere] для поддержания избыточного давления. Эту жидкость можно бесплатно создать внутри [entity=chemical-plant] на любой планете, кроме [planet=maraxsis].\nЕго можно демонтировать только в том случае, если внутри купола нет машин.
maraxsis-pressure-dome-collision=Огромное сооружение, защищающее ваши машины от колоссального давления глубоководья. Требует постоянного снабжения атмосферой [fluid=maraxsis-atmosphere] для поддержания избыточного давления.\nЕго можно демонтировать только в том случае, если внутри купола нет машин.
maraxsis-salt-reactor=Продвинутый ядерный реактор, который превращает [fluid=water] в [fluid=maraxsis-supercritical-steam], высвобождая энергию из [item=msr-fuel-cell]. [fluid=maraxsis-supercritical-steam] нельзя передавать по [entity=pipe], он может передаваться только через [entity=maraxsis-salt-reactor], [entity=maraxsis-oversized-steam-turbine] и все варианты [entity=duct-small].
maraxsis-coral=Подводный биом с богатым биоразнообразием морской жизни.
maraxsis-fishing-tower=Автоматизированное рыболовное хозяйство, которое привлекает и ловит рыбу. Требует [item=maraxsis-fish-food] и покрытие покрытия [tile=lowland-cream-red-underwater].
maraxsis-regulator=Потребляет [fluid=maraxsis-atmosphere] для поддержания избыточного давления в куполе. Скорость потребления атмосферы указана в Факториопедии. При подаче энергии функционирует как подводный [entity=roboport] и [entity=radar].
maraxsis-trench-duct=Чрезвычайно длинная и прочная труба, которая передаёт жидкости напрямую во впадину и обратно.\nДолжна устанавливаться на [tile=maraxsis-trench-entrance].\nТребует [item=cliff-explosives] для расчистки пути.\nЭтот канал должен быть размещён на краю входа во впадину, по аналогии с [entity=offshore-pump].
maraxsis-trench-duct-lower=Чрезвычайно длинная и прочная труба, которая передаёт жидкости напрямую во впадину и обратно.
maraxsis-conduit=Продвинутый маяк, который можно разместить на морском дне или на суше. Имеет огромную зону покрытия и может принимать модули качества. Каждый последующий размещённый маяк даёт лишь половину эффективности распространения от предыдущего.
maraxsis-polylplast=Конгломерат из миллионов крошечных организмов.
maraxsis-oversized-steam-turbine=Высокоэффективная регенеративная паровая турбина. Теряет 2/с [fluid=water]. [fluid=maraxsis-supercritical-steam] нельзя передавать по [entity=pipe], он может передаваться только через [entity=maraxsis-salt-reactor], [entity=maraxsis-oversized-steam-turbine] и все варианты [entity=duct-small]. Пар более высокой температуры даёт больше энергии при потреблении.
maraxsis-chimney=Встречается во впадине [space-location=maraxsis-trench].

duct-intake=Переносит жидкости из обычных труб в канал.
duct-exhaust=Переносит жидкости из канала в обычные трубы.
non-return-duct=Принудительно направляет поток жидкости только в одну сторону.

sp-spidertron-dock=Автоматически стыкуется с находящимся над ним роботом (__1__), позволяя манипуляторам взаимодействовать с его инвентарём.


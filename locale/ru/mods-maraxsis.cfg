[technology-description]
cargo-landing-pad-capacity=Продвинутые системы управления ракетами позволяют точно отслеживать грузовую посадочную площадку. Каждый уровень позволяет разместить одну дополнительную грузовую посадочную площадку.
hydraulic-science-pack=Позволяет исследовать самые передовые глубоководные технологии.
maraxsis-nuclear-submarine=Продвинутая атомная подводная лодка с более высокой скоростью, увеличенной сеткой модулей и большим багажным отсеком.
maraxsis-glassworking=Прозрачный материал, используемый для создания окон и других конструкций. Его колоссальная прочность на сжатие позволяет использовать его в глубоководном строительстве.
maraxsis-wyrm-confinement=Поимка и содержание неуловимых червей планеты [planet=maraxsis]. Используйте их части для научных исследований.
maraxsis-hydro-plant=Переработка солёной и солоноватой воды в пресную воду и кристаллы соли.
maraxsis-piscary=Создание устойчивого рыболовного хозяйства в глубинах планеты [planet=maraxsis].
maraxsis-depth-charges=Создание нового поколения взрывного вооружения.
maraxsis-sonar=Использует звуковые волны для обнаружения объектов под водой. Также может быть размещён на суше для получения огромной зоны покрытия.
maraxsis-salt-reactor=Продвинутый ядерный реактор, который превращает [fluid=water] в [fluid=maraxsis-supercritical-steam], высвобождая энергию из [item=msr-fuel-cell].
maraxsis-deepsea-research=Экспериментируйте с различными жидкостями для создания научных пакетов более высокого качества.
kr-quantum-computer=Высокоспециализированный глубоководный исследовательский компьютер, разработанный для создания научных пакетов более высокого качества. Требует большого количества энергии.
maraxsis-project-seadragon=Используйте выталкивающую силу воды в своих интересах. Позволяет строить ракетные шахты под водой на планете [planet=maraxsis].
maraxsis-abyssal-diving-gear=Станьте субмариной. Изобретите продвинутое снаряжение для выработки кислорода и выдерживания давления планеты [planet=maraxsis]. Эффекты от нескольких элементов снаряжения суммируются.
ducts=Проектируйте колоссальные системы трубопроводов с огромной протяжённостью каналов и подземным расстоянием. Вольфрамовые каналы можно размещать на покрытиях [tile=water] и [tile=lava]. Канал [entity=maraxsis-trench-duct] может передавать жидкости напрямую во впадину [planet=maraxsis-trench].
maraxsis-research-vessel=Используйте высокую прочность на сжатие [item=bob-glass], чтобы сжимать научные пакеты под давлением для уменьшения их размера в пачке.

sp-spiderling=Небольшой, медлительный транспорт, способный передвигаться по пересечённой местности. Оснащён ракетной установкой с возможностью ручного или автоматического прицеливания. Можно управлять вручную или с помощью пульта управления паукотроном.


[tips-and-tricks-item-description]
maraxsis-briefing=[planet=maraxsis] — это полностью затопленный мир, на поверхности которого нет ни одного острова. Без подводной лодки [entity=maraxsis-diesel-submarine] вы утонете через пятнадцать минут. Большинство машин, за исключением [entity=chemical-plant] и [entity=maraxsis-hydro-plant], не рассчитаны на экстремальное давление и будут функционировать только внутри герметичного купола [entity=maraxsis-pressure-dome]. Солёную воду [fluid=maraxsis-saline-water] можно качать, установив насос [entity=offshore-pump] в любом месте. Здесь есть три биома: океанские равнины, коралловый риф и глубоководная впадина. Во впадине можно найти лаву [fluid=lava], однако многие другие материалы, такие как атмосфера [fluid=maraxsis-atmosphere], углеволокно [item=carbon-fiber] и вольфрамовые пластины [item=tungsten-plate], необходимо доставлять с других планет. Ракетная шахта [entity=rocket-silo] не сможет запускать ракеты без предварительного исследования технологии [technology=maraxsis-project-seadragon].
maraxsis-trench-exploration=Иногда во время исследования Мараксиса вы можете наткнуться на глубокую расщелину в коре планеты. Вход во впадину — это самая низкая точка на поверхности планеты [planet=maraxsis]. Его можно надёжно найти, если двигаться перпендикулярно контурам скал [entity=cliff-maraxsis]. Эта расщелина уходит на тысячи километров вниз, к подводной впадине. Находясь над входом во впадину [tile=maraxsis-trench-entrance], используйте клавишу __CONTROL__maraxsis-trench-submerge__, находясь внутри дизельной подводной лодки [item=maraxsis-diesel-submarine], чтобы совершить погружение. В глубоководной впадине царит полная тьма, приборы ночного видения [item=night-vision-equipment] там не работают. Вы будете раздавлены через тридцать секунд без защиты дизельной [item=maraxsis-diesel-submarine] или атомной подводной лодки [item=maraxsis-nuclear-submarine]. Впадина даёт гидроустановке [entity=maraxsis-hydro-plant] четыре дополнительных слота для модулей. Лаву [fluid=lava] можно добывать из геотермальных источников во впадине и перерабатывать в расплавленное железо [fluid=molten-iron], расплавленную медь [fluid=molten-copper] и серу [item=sulfur].
maraxsis-underwater-machines=Химический завод [entity=chemical-plant] и гидроустановка [entity=maraxsis-hydro-plant] герметичны и разработаны для использования под давлением. Однако многие из ваших машин больше не работают под водой на планете [planet=maraxsis].\n\nЗапрещённые машины во впадине [planet=maraxsis-trench]:\n- [entity=rocket-silo], [entity=cargo-landing-pad], [entity=locomotive]\n\nМашины, которые работают под водой:\n- [entity=sp-spidertron-dock], [entity=small-lamp]\n- [entity=chemical-plant], [entity=maraxsis-hydro-plant], [entity=maraxsis-conduit]\n- [entity=transport-belt], [entity=splitter], [entity=underground-belt]\n- [entity=steel-chest], [entity=active-provider-chest], [entity=passive-provider-chest], [entity=requester-chest], [entity=buffer-chest], [entity=storage-chest]\n- [entity=inserter]\n- [entity=constant-combinator], [entity=arithmetic-combinator], [entity=decider-combinator], [entity=selector-combinator]\n- [entity=pipe], [entity=pipe-to-ground], [entity=pump], [entity=storage-tank]\n- [entity=small-electric-pole], [entity=medium-electric-pole], [entity=big-electric-pole], [entity=substation]\n- [entity=solar-panel], [entity=stone-wall], [entity=gate]\n\nМашины, которым требуется герметичный купол [entity=maraxsis-pressure-dome]:\n- [entity=maraxsis-salt-reactor], [entity=maraxsis-oversized-steam-turbine], [entity=boiler], [entity=steam-engine], [entity=heating-tower]\n- [entity=nuclear-reactor], [entity=heat-exchanger], [entity=heat-pipe], [entity=steam-turbine]\n- [entity=fusion-reactor], [entity=fusion-generator]\n- [entity=accumulator], [entity=beacon]\n- [entity=assembling-machine-1], [entity=assembling-machine-2], [entity=assembling-machine-3]\n- [entity=stone-furnace], [entity=steel-furnace], [entity=electric-furnace]\n- [entity=oil-refinery], [entity=centrifuge], [entity=recycler]\n- [entity=foundry], [entity=electromagnetic-plant], [entity=biochamber], [entity=cryogenic-plant]\n- [entity=lab], [entity=biolab]\n\nМашины, которые нельзя разместить внутри герметичного купола [entity=maraxsis-pressure-dome], но можно разместить на морском дне:\n- [entity=gun-turret], [entity=laser-turret], [entity=rocket-turret], [entity=tesla-turret], [entity=railgun-turret]\n- [entity=land-mine], [entity=rocket-silo]\n- [entity=electric-mining-drill], [entity=big-mining-drill]\n\nМашины, которые вообще не работают под водой:\n- [entity=artillery-turret], [entity=artillery-wagon]\n- [entity=car], [entity=tank], [entity=spidertron]\n- [entity=roboport], [entity=radar], [entity=flamethrower-turret]\n\nЛокомотив [entity=locomotive] будет работать под водой, однако при строительстве на морском дне необходимо использовать опоры рельсов [entity=rail-support].\nЖелезнодорожная станция [entity=train-stop] и наклонный рельс [entity=rail-ramp] могут быть построены только внутри герметичного купола [entity=maraxsis-pressure-dome].

fmf-auto-join=Смежные [entity=duct-small] автоматически объединяются в [entity=duct].\nСмежные [entity=duct] автоматически объединяются в [entity=duct-long].\nЭту функцию можно отключить в настройках мода, и в этом случае станут доступны обычные рецепты для создания [entity=duct] и [entity=duct-long].
fmf-endpoints=Из-за своих больших размеров обычные трубы не могут подключаться к каналам напрямую. Жидкости должны поступать в сеть каналов через [entity=duct-intake] и выходить через [entity=duct-exhaust]. Для создания систем с высокой пропускной способностью к каждой конечной точке можно подключить до шести обычных труб.
fmf-introduction=Каналы позволяют транспортировать огромные объёмы жидкостей на большие расстояния.
fmf-non-return-duct=[entity=non-return-duct] позволяет принудительно направлять поток жидкости только в одну сторону. Чаще всего его используют для изоляции производственной зоны во избежание потерь, для назначения приоритета определённым веткам или для повышения давления на длинных дистанциях.

sp-spidertron-patrols=Обзор основных возможностей, добавляемых модом [font=default-bold]Spidertron Patrols[/font].\n\nЕсли окно расписания не помещается на вашем экране, попробуйте уменьшить [font=default-semibold]Масштаб интерфейса[/font] или отключить опцию [font=default-semibold]Упрощённое окно персонажа[/font] в меню Настройки > Интерфейс.
sp-dock=[entity=sp-spidertron-dock] позволяет автоматизировать загрузку и выгрузку паукотронов с помощью манипуляторов. Док автоматически подключается к первому остановившемуся над ним паукотрону и отключается, когда тот уходит.
sp-spidertron-automation=Получите [item=sp-spidertron-patrol-remote] на панели с правой стороны интерфейса паукотрона или нажав клавишу __CONTROL__spidertron-enhancements-spidertron-patrol-pipette__ при выборе паукотрона.\nМигающий номер показывает, какая точка патрулирования выбрана в данный момент. Сочетание __ALT_CONTROL__2__use-item__ создаст новую точку после текущей выбранной. Сочетание __ALT_CONTROL__2__sp-replace-previous-waypoint__ переместит текущую выбранную точку на указанную позицию.\nЧтобы выбрать точку для вставки после неё или для её замены, нажмите кнопку [img=item.sp-spidertron-patrol-remote] в строке этой точки в окне расписания.\n\nИспользуйте __ALT_CONTROL__1__sp-delete-all-waypoints__, чтобы удалить все точки патрулирования.\nИспользуйте __ALT_CONTROL__1__sp-toggle-spidertron-automatic-manual__, чтобы переключить автоматический/ручной режим для паукотрона, который сейчас выбран, открыт, подключён к удерживаемому пульту или управляется вами.
sp-wait-conditions=Условия ожидания можно настроить для каждой точки патрулирования в окне расписания. Они работают аналогично условиям ожидания поездов, но у каждой точки патрулирования может быть только одно условие ожидания. Если вам нужно объединить несколько условий ожидания в одной точке, часто можно добиться похожего результата, установив несколько точек патрулирования на одну и ту же позицию, каждую со своим условием ожидания. Если это не помогает, используйте условие ожидания [font=default-semibold]Логическая сеть[/font] и подключите комбинаторы к [entity=sp-spidertron-dock] в этой позиции.
sp-automatic-refueling=Если транспорту требуется топливо, используйте условие ожидания [font=default-semibold]Полная заправка[/font], чтобы транспорт не покидал точку патрулирования до тех пор, пока не заправится полностью. Существует два способа автоматической заправки:\n\n- Настройте [entity=sp-spidertron-dock] для подключения к слоту «Топливо» в инвентаре транспорта, затем загружайте топливо с помощью манипуляторов.\n- Добавьте логистический запрос на топливо прямо в интерфейсе транспорта, и его доставят [entity=logistic-robot]. Доставленное топливо будет помещено сразу в топливный отсек транспорта.
sp-aircraft-automation=Воздушные суда из мода [font=default-bold]Lex's Aircraft[/font] также можно автоматизировать с помощью [item=sp-spidertron-patrol-remote] и [entity=sp-spidertron-dock].
sp-submarine-automation=Подводные лодки из мода [font=default-bold]Maraxsis[/font] также можно автоматизировать с помощью [item=sp-spidertron-patrol-remote] and [entity=sp-spidertron-dock].\nИспользуйте условие ожидания [font=default-semibold]Погружение[/font] в точке патрулирования над входом во впадину, чтобы войти во впадину или выйти из неё.

spidertron-enhancements=Обзор основных возможностей, добавляемых модом [font=default-bold]Spidertron Enhancements[/font]. Полный список функций можно найти в настройках мода или на его странице на Mod Portal.
spidertron-enhancements-enter-train=Нажмите клавишу __CONTROL__toggle-driving__ и/или __CONTROL__spidertron-enhancements-enter-vehicles__ (в зависимости от настроек), находясь рядом с транспортом, чтобы сесть в него.
spidertron-enhancements-quick-toggle=Используйте сочетание __ALT_CONTROL__1__spidertron-enhancements-enter-vehicles__, чтобы быстро переключить паукотрон, которым вы управляете.
spidertron-enhancements-pathfinder=Используйте сочетание __ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__ с [item=spidertron-remote] в руках, чтобы задействовать поиск пути для автоматического обхода воды.
spidertron-enhancements-remote-pipette=Используйте сочетание __ALT_CONTROL__1__spidertron-enhancements-spidertron-pipette__, наведя курсор на паукотрон, чтобы быстро выбрать [item=spidertron-remote], подключённый к этому паукотрону.

[equipment-description]
nightvision-disabled-underwater=[img=utility/warning_icon] Приборы ночного видения не работают во впадинах планеты [planet=maraxsis].
maraxsis-abyssal-diving-gear=Даёт невосприимчивость к давлению и нехватке воздуха под водой. Используйте __CONTROL__maraxsis-trench-submerge__, чтобы спуститься во впадину.\n[font=default-semibold][color=255,230,192]Значительно увеличивает скорость плавания. [img=quality_info][/color][/font]\n[font=default-semibold][color=255,230,192]Обеспечивает освещение под водой. [img=quality_info][/color][/font]
maraxsis-abyssal-diving-gear-disabled=[img=utility/warning_icon] Абиссальное водолазное снаряжение не работает на суше.


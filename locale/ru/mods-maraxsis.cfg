[space-location-description]
maraxsis=Планета, полностью покрытая бескрайними океанами. Давление здесь экстремальное, всё, что угодно, поддастся влаге без защиты подводной лодки. Многие механизмы функционируют только под защитой подводной лодки [entity=maraxsis-pressure-dome].
maraxsis-trench=Глубинная впадина, доступная только при погружении подводной лодки на поверхность Мараксиса. В впадине царит полная темнота, единственным источником света являются изредка появляющиеся геотермальные источники, из которых можно добывать [fluid=lava] и [item=sulfur].


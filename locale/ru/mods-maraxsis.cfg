[mod-name]
maraxsis=○🌐Maraxsis

FluidMustFlow=Fluid Must Flow

[mod-description]
maraxsis=Погрузитесь в неизведанные воды Мараксиса, мира, где море покрывает всё. Используйте подводные лодки для исследования, прокладывайте оптоволоконные кабели для передачи сигналов на большие расстояния и преодолевайте сложности глубоководной логистики. ОСТОРОЖНО: в глубинах вы не одни...

FluidMustFlow=Добавляет трубы очень большого диаметра с огромной пропускной способностью.

SpidertronPatrols=Отправляйте паукотронов в патрули и автоматически загружайте и разгружайте их с помощью доков. Добавляет паучат в середине игры, чтобы новые функции можно было использовать раньше.

SpidertronEnhancements=Несколько простых функций, которые облегчат вам жизнь при использовании пауктрона:\n - Садитесь в транспортное средство, не покидая пауктрона\n - Быстро переключайтесь между режимами инженера и пауктрона\n - Используйте дистанционный поисковик пауктрона для перемещения вокруг озер\n - Доставайте дистанционные устройства, наводя курсор на пауктрона\n - Непосредственно открывайте инвентарь транспортного средства, которым вы сейчас управляете.


[controls-description]
maraxsis-trench-submerge=Погружение во впадину при нахождении внутри подводной лодки. Работает только в том случае, если подлодка заправлена топливом.

sp-delete-all-waypoints=Используется с пультом патрулирования паукотрона.
sp-toggle-spidertron-automatic-manual=Переключает автоматический/ручной режим для паукотрона, который сейчас выбран, открыт, подключён к удерживаемому пульту или управляется вами.

spidertron-enhancements-use-alt-spidertron-remote=Используется с пультом управления паукотрона, чтобы отдать приказ подключённому роботу с использованием алгоритма поиска пути.
spidertron-enhancements-enter-vehicles=Результат зависит от того, находитесь ли вы внутри/рядом с транспортом или нет. Настраивается в параметрах мода.\n[color=red]Не назначайте на ту же клавишу, что и стандартное управление [font=default-bold]Сесть в транспорт / Покинуть транспорт[/font] (__CONTROL__toggle-driving__)[/color].
spidertron-enhancements-spidertron-pipette=Выбирает из вашего инвентаря пульт, подключённый к выбранному в данный момент паукотрону, и помещает его в руку.\nЕсли паукотрон не выбран, берёт пульт от робота, которым вы сейчас управляете.
spidertron-enhancements-spidertron-patrol-pipette=Работает только в том случае, если установлен мод Spidertron Patrols.\nВыбирает пульт патрулирования, подключённый к выбранному в данный момент паукотрону, и помещает его в руку.\nЕсли паукотрон не выбран, берёт пульт патрулирования от робота, которым вы сейчас управляете.
spidertron-enhancements-open-vehicle-inventory=Если в руке находится пульт управления паукотроном, открывает инвентарь подключённого робота.\nВ противном случае открывает инвентарь транспорта, которым вы сейчас управляете.


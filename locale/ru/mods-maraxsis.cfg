drowning=[img=utility/warning_icon] [font=default-semibold]Вы тонете![/font] Доберитесь до подводной лодки или герметичного купола.
cannot-mine-dome=Нельзя демонтировать герметичный купол, пока внутри находятся машины. Обнаружено: [entity=__1__,quality=__2__] __3__.
submarine-failed-to-submerge=[img=utility/warning_icon] Автоматическая подводная лодка не смогла погрузиться в точке: __1__.
invalid-trench-duct-placement=Здесь нельзя разместить канал во впадину. Канал во впадину должен быть установлен на [tile=maraxsis-trench-entrance].
invalid-space-platform=[img=utility/warning_icon] Удалена недопустимая космическая платформа __1__ на [planet=maraxsis-trench].


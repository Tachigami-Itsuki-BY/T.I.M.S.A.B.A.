[mod-setting-description]
maraxsis-water-opacity=Управляет прозрачностью воды на планете [planet=maraxsis]. Чем меньше значение, тем более прозрачной будет вода.
maraxsis-add-hydraulic-science=Изменяет стандартные исследования, добавляя в них гидравлический научный пакет Мараксиса.

fmf-enable-duct-auto-join=Малые каналы будут автоматически объединяться в обычные и длинные каналы при размещении. Существенно снижает количество предметов, с которыми вам приходится иметь дело.

sp-remove-military-requirement=Удаляет военный научный пакет [item=military-science-pack] из технологий автоматизации [font=default-bold]пауканов[/font] и [font=default-bold]паукотронов[/font].\nУдаляет ракетную установку [item=rocket-launcher] из рецепта [font=default-bold]паукана[/font].\nРекомендуется для игры в мирном режиме.
sp-prevent-docking-when-driving=Паукотроны не будут подключаться к докам, если ими управляет игрок, за исключением случаев, когда паукотрон находится в автоматическом режиме.
sp-show-schedule-pane-by-default=Если включено, у недавно размещённых паукотронов при открытии будет сразу отображаться полное окно расписания.\n(Панель расписания каждого паукотрона можно скрыть или показать индивидуально с помощью кнопок в верхнем правом углу интерфейса паукотрона).

spidertron-enhancements-spiderton-requires-fuel=Вариант по умолчанию означает, что настройка не будет изменена и останется такой, какую задаёт оригинальная игра или другой мод.
spidertron-enhancements-sound-pause=Среднее количество секунд, через которое звук паукотрона начнёт воспроизводиться снова (звук длится 19 секунд).
spidertron-enhancements-enter-entity=Настройте управление во вкладке настроек [font=default-bold]Для каждого игрока[/font].
spidertron-enhancements-enter-entity-base-game=Переопределяет стандартное поведение клавиши __CONTROL__toggle-driving__, когда вы едете на паукотроне рядом с другим транспортом.\nЗависит от настройки карты [font=default-bold]«Вход/выход из транспорта на паукотроне»[/font].
spidertron-enhancements-enter-entity-custom=Зависит от настройки карты [font=default-bold]«Вход/выход из транспорта на паукотроне»[/font].
spidertron-enhancements-pipette-unconnected-remote=Зависит от настройки карты [font=default-bold]«Пипетка паукотрона выбирает временный пульт вместо пульта из инвентаря»[/font].


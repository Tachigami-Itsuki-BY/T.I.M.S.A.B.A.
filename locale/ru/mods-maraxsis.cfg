maraxsis-atmosphere=Смесь газообразного азота, кислорода и водорода.
maraxsis-supercritical-steam=Сверхкритический пар высокой энергетической плотности, вырабатываемый в [entity=maraxsis-salt-reactor] и потребляемый в [entity=maraxsis-oversized-steam-turbine]. В отличие от обычных жидкостей, его нельзя передавать по [entity=pipe]. Вместо этого он может передаваться только через [entity=maraxsis-salt-reactor], [entity=maraxsis-oversized-steam-turbine] и все варианты [entity=duct-small]. Пар более высокой температуры даёт больше энергии при потреблении.


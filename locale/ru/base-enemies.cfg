[technology-name]
bob-artifact-processing=Обработка артефактов

[technology-description]
bob-artifact-processing=Исследование по объединению артефактов.

[factoriopedia-description]
bob-basic-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact] после смерти. [/color][/font]
bob-basic-enemy-2=[font=default-semibold][color=240,180,20]Создаёт препятствия. [/color][color=230,230,20]Замедляющая кислота.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивость к: взрывам.[/color][/font]\n\nЭти существа - доминирующая форма жизни на Наувисе. Они принимают несколько различных форм, но все принадлежат к одному виду.\n\nРазновидности [font=default-semibold][color=255,230,192]плевак и червей[/color][/font] атакуют липкой и едкой желчью, стремясь замедлить свои цели и переварить их прямо на месте. Между тем, [font=default-semibold][color=255,230,192]кусаки[/color][/font] пытаются зажать свои цели в кольцо, кромсая их на куски мощными передними лапами и челюстями, одновременно давая желчи время сделать свою работу.\n\nПротив хорошо бронированной цели [font=default-semibold][color=255,230,192]желчь, которую используют эти существа, представляет наибольшую угрозу.[/color][/font] Желчь, выделяемая червями и плеваками этой породы, имеет немного разный состав в зависимости от их размера, и эти эффекты могут суммироваться, [font=default-semibold][color=255,230,192]усиливая замедление[/color][/font]. Если транспортное средство будет вынуждено остановиться под действием такого эффекта, сдвинуть его с места снова может быть практически невозможно.
bob-piercing-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact-blue] после смерти. [/color][/font]
bob-piercing-enemy-2=[font=default-semibold][color=40,200,200]Реакция на урон: Неэлектрический, Некислотный.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивость к: взрывам, огню, физическому урону, пробиванию.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимость к: кислоте, электричеству, лазеру, яду.[/color][/font]\n\nЭта порода врагов отказывается от любой пищеварительной желчи в своих дальних атаках в пользу запуска [font=default-semibold][color=255,230,192]бронебойных шипов[/color][/font] на высоких скоростях. Хотя у них нет периодического урона, как у некоторых других пород, эти шипы потребуют хорошей мобильности для уклонения. Однако [font=default-semibold][color=255,230,192]их снаряды не способны перелетать через стены[/color][/font].\n\nЭти враги особенно [font=default-semibold][color=255,230,192]устойчивы к кинетическим ударам[/color][/font] всех видов, обладают высокой регенерацией и демонстрируют [font=default-semibold][color=255,230,192]вспышки скорости при атаке[/color][/font] в дополнение к их и без того быстрому передвижению. Эти черты означают, что их [font=default-semibold][color=255,230,192]кусаки гораздо опаснее[/color][/font], чем у других пород. [font=default-semibold][color=255,230,192]Электричество не вызывает у них ярость[/color][/font].
bob-electric-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact-orange] после смерти. [/color][/font]
bob-electric-enemy-2=[font=default-semibold][color=255,120,40]Противовоздушная угроза. [/color][color=230,230,20]Замедляющая кислота. [/color][color=40,200,200]Реакция на урон: Электричество. [/color][color=180,60,230]Огонь по своим.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивость к: электричеству, лазеру.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимость к: кислоте, огню, яду.[/color][/font]\n\nИспользование электрических разрядов в атаках позволяет кусакам этой породы [font=default-semibold][color=255,230,192]поражать цели прямо за стенами[/color][/font]. Желчь, которую шоковые плеваки и черви используют в своих дальних атаках, также задействует электричество для вызова паралича, хотя этот эффект и кратковременен. Примечательно, что [font=default-semibold][color=255,230,192]враги других пород тоже восприимчивы к этому эффекту[/color][/font], как и летающие объекты, которые обычно игнорируют лужи кислоты на земле.\n\nУдары электричеством заставляют кусак и плевак этой породы [font=default-semibold][color=255,230,192]значительно ускоряться[/color][/font], причём [font=default-semibold][color=255,230,192]их собственные лужи электризованной желчи могут вызывать у них ярость[/color][/font].
bob-acid-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact-purple] после смерти. [/color][/font]
bob-acid-enemy-2=[font=default-semibold][color=200,60,60]Периодический урон. [/color][color=40,200,200]Реакция на урон: Столкновение. [/color][color=70,130,220]Посмертная атака.[/color][/font]\n\n[font=default-semibold][color=#0e0303]Устойчивость к: кислоте, яду.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимость к: электричеству.[/color][/font]\n\nКислотная желчь этих врагов была изменена для максимальной разъедающей способности и стойкости в ущерб её замедляющему действию. Она прилипает к любому врагу, который наступает или наезжает на неё, [font=default-semibold][color=255,230,192]нанося не только немедленный урон, но и периодический урон с течением времени[/color][/font]. Она также способна наносить [font=default-semibold][color=255,230,192]больше урона постройкам[/color][/font], чем другие подобные виды кислоты. [font=default-semibold][color=255,230,192]Враги также могут взрываться брызгами кислоты после смерти или выделять её при столкновении с крупным объектом[/color][/font].
bob-explosive-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact-yellow] после смерти. [/color][/font]
bob-explosive-enemy-2=[font=default-semibold][color=255,120,40]Противовоздушная угроза. [/color][color=70,130,220]Посмертная атака.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивость к: кислоте, взрывам.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимость к: электричеству, огню, лазеру.[/color][/font]\n\nВзрывная порода полагается на мгновенный урон по большой площади вместо более медленных методов вроде пищеварительной желчи. Однако их атаки не так хаотичны, как кажется: они скорректированы так, чтобы не задевать союзников. К счастью, [font=default-semibold][color=255,230,192]более широкий радиус наносимого ими взрывного урона также, судя по всему, не затрагивает небоевую инфраструктуру[/color][/font].\n\nНесмотря на отсутствие пищеварительного или замедляющего эффекта, луж, которые оставляют их атаки на земле, всё равно следует избегать. Эти лужи выкачивают органические соединения из почвы под ними для переработки в новую взрывчатку. Таким образом, [font=default-semibold][color=255,230,192]лужи способны взрываться снова по истечении некоторого времени, и это может происходить неоднократно[/color][/font]. Кусаки и плеваки этой породы также могут взрываться при смерти.
bob-poison-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact-green] после смерти. [/color][/font]
bob-poison-enemy-2=[font=default-semibold][color=200,60,60]Периодический урон. [/color][color=255,120,40]Противовоздушная угроза. [/color][color=60,200,60]Эффект лечения. [/color][color=40,200,200]Реакция на урон.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивость к: кислоте, яду.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимость к: огню[/color][/font]\n\nВместо стандартных химических токсинов яд, используемый врагами этой породы, представляет собой смесь ферментов, вырабатываемых свободно плавающими клетками и настроенных на поражение любого материала, с которым они соприкасаются. Эти клетки распространяются через слюну существ или в облаках газа вокруг их тел, а также способны [font=default-semibold][color=255,230,192]залечивать раны союзных существ[/color][/font].\n\nЭти враги наносят [font=default-semibold][color=255,230,192]умеренное количество периодического урона по большой площади[/color][/font], но их самым опасным свойством является способность к лечению, особенно в сочетании с другими породами врагов.
bob-fire-enemy-1=[font=default-semibold][color=255,230,192]Оставляет [item=bob-alien-artifact-red] после смерти. [/color][/font]
bob-fire-enemy-2=[font=default-semibold][color=200,60,60]Периодический урон. [/color][color=255,120,40]Противовоздушная угроза. [/color][color=180,60,230]Огонь по своим.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивость к: взрывам, огню, лазеру.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимость к: столкновениям, физическому урону, пробиванию.[/color][/font]\n\nАтаки всех существ этой породы вызывают возгорания. Эти пожары поддерживаются химикатами, которые являются одновременно горючими и крайне кислотными, что гарантирует: [font=default-semibold][color=255,230,192]даже полностью огнеупорные постройки не застрахованы от них[/color][/font]. Будучи изначально слабым, [font=default-semibold][color=255,230,192]пламя разгорается сильнее по мере добавления топлива от повторных атак[/color][/font], со временем превращаясь в самую разрушительную форму атаки на оборонительные сооружения среди всех враждебных существ на Наувисе. Пожар также может [font=default-semibold][color=255,230,192]распространяться на небольшое расстояние[/color][/font] от места своего возникновения.


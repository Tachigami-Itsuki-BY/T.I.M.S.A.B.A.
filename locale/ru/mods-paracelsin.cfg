[tile-description]
nitrogen-lake=Озёра из жидкого [fluid=nitrogen-liquid], покрывающие поверхность планеты [planet=paracelsin]. Они достаточно мелкие, чтобы поверх них можно было укладывать [tile=landfill] (отсыпку территории), в отличие от [tile=ammoniacal-ocean] (аммиачного океана) на [planet=aquilo].

[tips-and-tricks-item-name]
paracelsin-briefing=Брифинг по Парацельсину
fulgoran-log=Журнал фулгорианца

[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin] - это замёрзшая пустошь, похожая на [planet=aquilo], но, в отличие от аммиачного мира, она имеет твёрдую поверхность. Под землей планета скрывает огромный океан [fluid=nitrogen-liquid], который вытекает на поверхность, образуя [tile=nitrogen-lake]. Планета богата [item=sphalerite] и [item=tetrahedrite] (соединениями цинка [item=zinc]), а также [item=vaterite]. На поверхности также можно встретить [entity=water-cryovolcano].
fulgoran-log=Внутри [entity=crashed-fulgoran-pod], рядом с чертежами, вы обнаружили сообщение. Вам удалось перевести его благодаря исследованиям, проведённым на Фульгоре: «Приветствуем любые формы жизни, которые могут это найти. Мы фулгориане, и мы отправили эти капсулы в эту замёрзшую пустошь на поиски нефти. Наша тяга к росту привела к некоторым незначительным последствиям для экологии нашей планеты - не то чтобы нам было не плевать, - но также истощила большую часть наших любимых запасов нефти, из-за чего у нас скопился приличный избыток побочных продуктов её переработки. Если вы знаете место с нефтью, пожалуйста, свяжитесь с нашим ближайшим планетарным аванпостом. Если ваша планета сейчас не способна к космическим путешествиям, пожалуйста, передайте это сообщение тем, кто способен. А если мы к тому времени вымрем... Ну, сомневаюсь, что мы могли бы потерпеть неудачу». Вы и фулгориане стали бы отличными друзьями.
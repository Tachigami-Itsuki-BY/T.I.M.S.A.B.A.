[technology-description]
planet-discovery-paracelsin=Скованная льдом пустошь с высокой криовулканической активностью. Озёра [fluid=nitrogen-liquid] покрывают поверхность, вытекая из подземного океана. [entity=water-cryovolcano] усеивают поверхность наряду с жилами [item=tetrahedrite] и [item=sphalerite], необходимых для добычи [item=bob-zinc-ore]. [item=vaterite] также присутствует в небольших жилах. Всё, что построено на планете, должно постоянно находиться в тепле, иначе оно замёрзнет, а от всех нежелательных побочных продуктов добычи цинка необходимо избавляться.
cryovolcanic-power=Внутри замёрзшего [entity=crashed-fulgoran-pod] находились древние чертежи специального электрогенератора, который использует жидкую воду из [entity=water-cryovolcano] для выработки электричества, а также чрезвычайно быстрой, но малоэффективной [entity=burner-pumpjack]. Их можно использовать для запуска энергоснабжения на планете.
nitric-acid-handling=Анализируя спонтанные химические реакции, происходящие на [entity=big-metallic-rock], мы можем воссоздать их для производства [fluid=angels-liquid-nitric-acid].
zinc-extraction=Позволяет производить различные изделия из цинка.
electrochemical-plant=Сборочный автомат, использующий электрохимию для проведения всевозможных химических процессов.
mechanical-plant=Сборочный автомат, использующий передовые механические процессы для создания различных предметов.
galvanization-science-pack=Позволяет проводить исследования за рамками базового применения гальванизации.
zinc-piping=Более прочные и изолированные трубы, изготовленные из [item=bob-zinc-plate]. Не замерзают на холодных поверхностях, таких как [planet=paracelsin] или [planet=aquilo], и могут транспортировать жидкости под землёй на большие расстояния.
axe-mining-speed=Благодаря оцинковке и ремонту кирки можно достичь более высокой скорости ручной добычи.
elevated-pipe=Прочные опорные конструкции, позволяющие размещать трубы высоко над землёй.
galvanized-steel=Нанесение [fluid=angels-liquid-molten-zinc] на пластины [item=steel-plate] делает их более прочными и устойчивыми к коррозии.
vaterite-formation=Из-за нехватки крупных месторождений [item=vaterite] на планете мы должны исследовать способ его синтеза.

Arci-asphalt=Позволяет производить асфальт для дорог высокого качества, что особенно полезно для колесной техники.

[mod-setting-name]
paracelsin-zinc-implementation=Поздние технологии Аквило требуют ресурсов Парацельсина.
paracelsin-galvanized-promethium=Добавить научный пакет гальванизации в исследования прометия.

[mod-setting-description]
paracelsin-zinc-implementation=Добавляет научный пакет гальванизации в некоторые технологии Аквило, а также добавляет цинковый припой в квантовые процессоры и электрические катушки в рельсотроны, турели-рельсотроны, термоядерные реакторы, термоядерные генераторы и портативные термоядерные реакторы. Мод разработан с расчётом на то, что этот параметр включён.


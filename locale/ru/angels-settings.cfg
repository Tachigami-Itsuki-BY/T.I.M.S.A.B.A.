[mod-setting-description]
angels-enable-storage-icon-scaling=Иконки ресурсов на силосах и складах будут масштабироваться под размер самих построек, вместо того чтобы оставаться маленькими.

angels-enable-auto-barreling=Скрывает все рецепты наполнение бочек и превращает разливочную помпу в объект типа печи.
angels-tryptophobia-friendly-stiratite=Заменяет новую графику с отверстиями на классические сплошные текстуры.

angels-starting-resource-ore1=Если включено, [img=item/angels-ore1] __ENTITY__angels-ore1__ будет появляться в стартовой зоне.\nПо умолчанию: включено
angels-starting-resource-ore2=Если включено, [img=item/angels-ore2] __ENTITY__angels-ore2__ будет появляться в стартовой зоне.\nПо умолчанию: отключено
angels-starting-resource-ore3=Если включено, [img=item/angels-ore3] __ENTITY__angels-ore3__ будет появляться в стартовой зоне.\nПо умолчанию: включено
angels-starting-resource-ore4=Если включено, [img=item/angels-ore4] __ENTITY__angels-ore4__ будет появляться в стартовой зоне.\nПо умолчанию: отключено
angels-starting-resource-ore5=Если включено, [img=item/angels-ore5] __ENTITY__angels-ore5__ будет появляться в стартовой зоне.\nПо умолчанию: включено
angels-starting-resource-ore6=Если включено, [img=item/angels-ore6] __ENTITY__angels-ore6__ будет появляться в стартовой зоне.\nПо умолчанию: включено

angels-pavement-stack-size=Элементы дорожного покрытия - это такие предметы, как камень, бетон, отсыпка земли, которые используются для создания покрытий и дорожек.


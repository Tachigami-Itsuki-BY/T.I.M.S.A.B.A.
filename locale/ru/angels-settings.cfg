intro=Уважаемый игрок!\nСтандартные настройки карты были сбалансированы для улучшения игрового процесса с модами Angel's. Скорректированные параметры перечислены ниже.
outro=Чтобы изменить любой из этих параметров, вернитесь в меню новой игры и настройте соответствующие ползунки или галочки. Подробную информацию о настройках можно получить при наведении курсора на значки информации.


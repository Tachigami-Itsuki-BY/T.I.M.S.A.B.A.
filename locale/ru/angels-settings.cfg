pollution-setting=Чтобы изменить настройки загрязнения, перейдите на вкладку «Дополнительно» генератора карты и переключите флажок рядом с пунктом «Загрязнение».
enemy-setting=Чтобы изменить настройки врагов, перейдите на вкладку «Враги» генератора карты и отрегулируйте ползунок размера «Множитель врагов Angel's».
evolution-setting=Чтобы изменить настройки эволюции врагов, перейдите на вкладку «Враги» генератора карты и переключите флажок для параметра «Эволюция».
expansion-setting=Чтобы изменить настройки экспансии врагов, перейдите на вкладку «Враги» генератора карты и переключите флажок для параметра «Экспансия врагов».


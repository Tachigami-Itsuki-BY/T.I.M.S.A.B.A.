corrundum=Планета, окутанная углекислым газом, но с достаточным количеством кислорода для горения. Как следствие, здесь царят высокие давления и температуры. Неконтролируемый парниковый эффект сделал условия более суровыми, чем на Вулканусе, и среди этой грязи и грозовых штормов нет никаких признаков жизни. Высокое давление гарантирует, что обычно летучий попутный нефтяной газ здесь находится в жидком состоянии — и его тут огромное количество. Железо и медь в основном связаны вместе в виде халькопирита. Особый интерес представляет платина, которая используется в качестве катализатора при глубокой переработке серы, а также в качестве анода и катода для электрохимии. Чтобы освоить эту планету, потребуется создать совершенно уникальную производственную цепочку, завязанную на сере.


[recipe-description]
electrochemical-science-pack=Сера, платина и серная кислота - вот из чего делается этот пакет!
catalytic-chemical-plant=Создание химического завода, который специализируется на использовании платины в качестве катализатора для реакций.
petroleum-alkylation=Большое количество серной кислоты позволяет формировать карбокатионы, используемые в качестве основы для алкилирования с созданием новых связей углерод-углерод.
light-oil-alkylation=Большое количество серной кислоты позволяет формировать карбокатионы, используемые в качестве основы для алкилирования с созданием новых связей углерод-углерод.
sulfur-combustion=Сжигание серы позволяет получить этот газ, который можно использовать для производства как серной кислоты, так и воды.
hydrogen-sulfide=С помощью платинового катализатора мы можем использовать нефтепродукты для гидрогенизации серы и получения сероводорода.
sulfur-reduction=Сера восстанавливается до нулевой степени окисления с одновременным образованием воды.
sulfurous-oxidation=В присутствии платинового катализатора диоксид серы может вступать в реакцию с кислородом, образуя триоксид серы in situ. Затем триоксид серы реагирует с водой, образуя серную кислоту.
hydrogen-sulfide-combustion=Сжигание сероводорода дает нам больше компонентов для производства серной кислоты.
sulfonated-plastic=С помощью платинового катализатора мы используем диоксид серы и кислород для получения триоксида серы. Триоксид серы реагирует с серной кислотой с образованием дымящей серной кислоты (олеума), которая может сульфировать углеводороды.
sulfonated-plastic-production-alt=С помощью платинового катализатора мы используем диоксид серы и кислород для получения триоксида серы. Триоксид серы реагирует с серной кислотой с образованием дымящей серной кислоты (олеума), которая может сульфировать углеводороды.
calcium-sulfate-fish=Используя источник азота и фосфора, мы добавляем больше углерода и сульфата кальция для оптимизации производства питательных веществ.
calcium-sulfate-bioflux=Используя источник азота и фосфора, мы добавляем больше углерода и сульфата кальция для оптимизации производства питательных веществ.
calcium-sulfate-egg=Используя источник азота и фосфора, мы добавляем больше углерода и сульфата кальция для оптимизации производства питательных веществ.
calcium-sulfate=Используя источник азота и фосфора, мы добавляем больше углерода и сульфата кальция для оптимизации производства питательных веществ.
asphalt-c=Асфальтная крошка.
asphalt-c-alt=Асфальтная крошка.
concrete-production-from-asphalt=Асфальтная крошка и камень превращаются в бетон.
pressure-lab=Объедините химический завод, лабораторию и паровую турбину, чтобы получить напорную лабораторию - ради науки!
platinum-thruster=Нужно двигаться быстрее.
rocket-fuel-catalytic-chemistry=Тот же рецепт - только на более быстрой машине!
sulfur-poison-capsule=Улучшенные методы химической войны.
blue-rocket=Более взрывоопасная ракета, начиненная новой мощной взрывчаткой.
sulfuric-oxidizer=Сульфирование углеводородного продукта для насыщения его кислородными группами, что позволяет ему работать в качестве окислителя во взрывных реакциях.
explosives-from-sulfuric-oxidizer=Упаковка серного окислителя в связки взрывчатки.


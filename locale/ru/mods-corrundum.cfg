[item-description]
platinum-ore=Платиновая руда. Благородный металл, полезный для ускорения каталитических реакций.
platinum-plate=Платиновая плита. Платиновая руда, переплавленная в плиты.
asphalt-c=Асфальтная крошка.
catalytic-chemical-plant=Каталитический химический завод. Химический завод с платиновыми компонентами. Идеально подходит для катализа реакций и электрохимии.
pressure-lab=Напорная лаборатория. Порочное детище лаборатории и химического завода. Это механическое чудовище создано под высоким давлением и способно проводить исследования быстрее обычной лаборатории - и всего с 35% расходом науки. Оно работает на пару под давлением, а высокие внутренние нагрузки позволяют ускорить исследовательский процесс. Однако оно отвергает научные пакеты обычного качества: они просто не рассчитаны на такое давление. Работает на пару!
red-boiler=Красный бойлер. Бойлер, предназначенный для переработки нефтепродуктов в горячий углекислый газ. Поскольку мы улавливаем большую часть газа, это не производит много загрязнения.
red-steam-engine=Красный паровой двигатель. Модифицированный паровой двигатель. Использует термоэлектрический эффект для выработки энергии. Он спроектирован так, чтобы поглощать горячий углекислый газ и вырабатывать мощность - ценой значительного загрязнения окружающей среды.
ice-box=Контейнер для льда. Пластиковый коробок, который отлично сохраняет скоропортящиеся продукты свежими на 50% дольше!
dry-ice=Сухой лед. Углекислый газ, охлажденный до твердого состояния.
sulfur-poison-capsule=Серная отравляющая капсула. Капсула с ядом, которая сжигает серу, выделяя вредные испарения.
sulfuric-oxidizer=Серный окислитель. Топливо, обработанное сульфатными группами для работы в качестве окислителя в реакциях взрыва.

chalcopyrite-ore=Может быть очищено и отсортировано для получения чистой руды:\n   [item=iron-ore] Fe\n   [item=copper-ore] Cu\n   [item=bob-silver-ore] Ag\n   [item=bob-gold-ore] Au\n   [item=angels-platinum-ore] Pt\n   [item=selenium] Se


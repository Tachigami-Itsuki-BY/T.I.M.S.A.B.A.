[technology-description]
planet-discovery-corrundum=Планета, окутанная углекислым газом, но с достаточным количеством кислорода для горения. Как следствие, здесь царят высокие давления и температуры. Неконтролируемый парниковый эффект сделал условия более суровыми, чем на Вулканусе, и среди этой грязи и грозовых штормов нет никаких признаков жизни. Высокое давление гарантирует, что обычно летучий попутный нефтяной газ здесь находится в жидком состоянии - и его тут огромное количество. Железо и медь в основном связаны вместе в виде халькопирита. Особый интерес представляет платина, которая используется в качестве катализатора при глубокой переработке серы, а также в качестве анода и катода для электрохимии. Чтобы освоить эту планету, потребуется создать совершенно уникальную производственную цепочку, завязанную на сере.
platinum-processing=Позволяет производить различные изделия из платины.
catalytic-chemical-plant=Позволяет создавать химический завод, использующий платину в качестве катализатора, а также в качестве анода/катода для электрохимии.
electrochemical-science-pack=Позволяет производить электрохимические научные пакеты.
sulfur-redox1=Позволяет производить сероводород.
sulfur-redox2=Позволяет производить серу и сероводород.
sulfate-processing-1=Превращение избытка сероводорода в диоксид серы.
sulfate-processing-2=Переработка халькопирита в полезные материалы.
sulfonated-plastic=Производство пластика с использованием дымящей серной кислоты (олеума) и источника углерода.
calcium-sulfate=Производство сульфата кальция.
calcium-sulfate-nutrients=Повышение эффективности производства питательных веществ.
asphalt-and-concrete=Производство асфальта и бетона.
pressure-lab=Позволяет создать быструю исследовательскую лабораторию, использующую научные пакеты необычного и более высокого качества. Научные пакеты обычного качества внутри работающей машины будут уничтожаться каждые 0,75 секунды.
dry-ice=Охлаждение углекислого газа до его твердой формы - сухого льда. Сухой лед можно использовать в контейнере для льда, чтобы замедлить порчу биофлюса, яиц и сельскохозяйственной науки на 50%. Работает только в контейнере для льда.
platinum-thruster=Позволяет создать ускоритель, способный выдерживать жар от сжигания невероятного количества топлива.
rocket-fuel-catalysis-productivity=Увеличивает количество ракетного топлива, производимого на каталитическом химическом заводе (легкая нефть + топливо). Не увеличивает производительность других способов производства ракетного топлива.
blue-rocket=Использование серной кислоты для насыщения твердого топлива сульфатными группами, чтобы оно могло служить компактным окислителем для ракет.
sulfur-poison-capsule=Улучшенное средство для дезинсекции кусак.


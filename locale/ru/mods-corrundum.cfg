[mod-setting-description]
automatically-populate-pressure-lab=Если включено, то входы барокамеры (data.raw["lab"]["pressure-lab"].inputs) будут СОВПАДАТЬ со входами обычной лаборатории (data.raw['lab']['lab'].inputs).
automatically-populate-labs-with-electrochemical-science=Определяет, нужно ли пройтись по всем лабораториям и добавить электрохимическую науку в список их доступных исследовательских пакетов.
ignore-everything-brute-force-science-into-pressure-lab=В самом конце этапа data-updates очищает входы барокамеры, после чего добавляет в неё абсолютно все научные пакеты из подгруппы "science pack". Это нарушит баланс модов, где наука должна использоваться только в одной конкретной лаборатории, зато гарантирует совместимость. Для тех, кого достала ошибка "no labs accept all sciences" (нет лабораторий, принимающих все виды наук).
require-vulcanus-before-corrundum=Если включено, вам понадобится металлургическая наука, чтобы открыть Корунд.
force-reduction-requires-plates=Если включено, в результаты рецептов "force-reduction-iron" и "force-reduction-copper" будут добавлены железные и медные пластины соответственно, а также будет возвращаться на одну руду больше. Изменено, так как было слишком легко получать легендарные предметы без возможности принудить игрока использовать обычное качество. Легендарная железная пластина позволит вам вернуть 3 легендарные железные руды из сульфатного раствора...
maraxsis-bonus-content=Если включено, станут доступны 1 новая технология и 2 новых рецепта - при условии, что установлен мод Maraxsis.
consider-planetslib=Если включено и установлен мод Planetslib, то настройки входов лабораторий и добавление электрохимической науки во все лаборатории производиться не будут. Используйте, если хотите передать управление совместимостью наук моду Planetslib.
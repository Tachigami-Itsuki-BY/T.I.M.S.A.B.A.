[space-location-description]
secretas=Страж галактики. Крупные объекты, способные врезаться в планеты, обычно притягиваются Секретасом, а его колоссальная масса искажает орбиты даже самых далёких небесных тел. Это газовое величие окружено плотным кольцом астероидов, из-за чего выйти на стабильную орбиту вокруг него - сложнейшая задача. Многие отправлялись к этому миру ради добычи астероидов с редкими металлами, но терпели сокрушительное поражение. Обломки их кораблей либо падали на Фрозету, крупнейший спутник гиганта, либо навсегда исчезали в недрах самого Секретаса.
frozeta=Этот мир, покрытый толстым слоем льда, испещрён кратерами от астероидов и завален обломками кораблей, уничтоженных плотным астероидным кольцом Секретаса. Здесь полно космического лома, а в местах крушений можно найти продвинутые технологии. Получает ещё меньше солнечного света, чем Аквило, и точно так же требует создания отопительной инфраструктуры для работы любых механизмов.

[mod-setting-name]
automatically-populate-science-pack-productivity-research=Автоматически заполнять исследования эффективности исследовательских пакетов
modify-loaders-for-belt-stack-size-limit=Изменять погрузчики под лимит размера стака на конвейере
ignore-dea-dia-compatibility=Игнорировать совместимость с Dea Dia
restrict-steam-recycler-crafting-to-frozeta=Ограничить создание парового утилизатора Фрозетой
check-this-if-frozeta-start=Отметьте это, если начинаете на Фрозете

[mod-setting-description]
modify-loaders-for-belt-stack-size-limit=Если включено, изменятся прототипы всех погрузчиков для увеличения их лимита складирования предметов, чтобы они корректно работали с увеличенным размером стака на конвейере.
ignore-dea-dia-compatibility=Если включено, мод будет вести себя так, будто Dea Dia не установлен, даже если он присутствует. Сейчас установлено значение «true», так как совместимость всё ещё находится в разработке.
restrict-steam-recycler-crafting-to-frozeta=Если включено, паровой утилизатор можно будет создать только на Фрозете.
check-this-if-frozeta-start=Этот параметр должен быть включён, чтобы старт на Фрозете работал корректно.
automatically-populate-science-pack-productivity-research=Если включено, игра попытается добавить в исследование эффективности исследовательских пакетов все существующие в сборке пакеты. Отключите при возникновении конфликтов с другими модами.


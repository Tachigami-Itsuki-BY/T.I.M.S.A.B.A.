[technology-description]
planet-discovery-shchierbin=Колонизируйте новую планету снова.
calcium-processing=Кальций - это мягкий щелочноземельный металл, играющий важнейшую структурную роль в живых организмах и имеющий огромное значение в промышленности.
chlorine-processing=Хлор - это высокоактивный токсичный газ, широко применяемый для дезинфекции и в химическом производстве.
natural-gas-processing=Природный газ - это высокоэффективное ископаемое топливо, являющееся ключевым источником энергии и сырья для мировой промышленности.
chlorine-soed=Пластиковый мир победил.
crusher-vanad=Еще больше руды.
alt-vanad-artil=На какое расстояние необходимо транспортировать вольфрам? Возьмем, к примеру, ванадиевую сталь.

vanadium-smelting-1=Продвинутые этапы переработки для производства ванадия.
vanadium-smelting-2=Дополнительные этапы плавки для снижения потерь материала.
vanadium-smelting-3=Дополнительные этапы плавки для снижения потерь материала.
vanadium-steel-plate=Позволяет производить различные изделия из ванадиевой стали.

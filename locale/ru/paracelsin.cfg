[technology-description]
planet-discovery-paracelsin=Замёрзшая пустошь с высочайшей криовулканической активностью. Поверхность покрыта озёрами из [fluid=angels-gas-nitrogen], вытекающими из подземного океана. По всей планете разбросаны [entity=water-cryovolcano] и жилы [item=tetrahedrite] и [item=sphalerite], необходимые для добычи [item=bob-zinc-ore]. Также встречаются небольшие жилы [item=vaterite]. Любые постройки на планете нужно постоянно обогревать, иначе они замёрзнут, а все ненужные побочные продукты добычи цинка необходимо как-то утилизировать.
zinc-extraction=Переработка [fluid=dirty-zinc-solution] в [item=bob-zinc-ore] с помощью различных процессов.
zinc-piping=Более прочные и изолированные трубы, изготовленные из [item=bob-zinc-plate]. Не замерзают на холодных поверхностях вроде [planet=paracelsin] или [planet=aquilo] и могут проводить жидкости под землёй на увеличенные расстояния.
galvanized-steel=Нанесение [item=bob-zinc-ore] на [item=steel-plate] делает их прочнее и устойчивее к коррозии.
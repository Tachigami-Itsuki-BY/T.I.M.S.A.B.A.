[recipe-description]
nitric-acid-plastic=Получение пластика из [fluid=angels-liquid-nitric-acid] и других материалов.
nitric-acid-rocket-fuel=Удобный способ использования [fluid=angels-liquid-nitric-acid].
solid-fuel-from-nitrogen=Удобный способ использования [fluid=angels-gas-nitrogen].
vaterite-processing=Получение [item=angels-solid-carbon] и [item=calcite] путём переработки большого количества [item=vaterite] в [fluid=water].
zinc-leaching=Выщелачивание [fluid=zinc-concentrate] с использованием [fluid=angels-liquid-nitric-acid].
sphalerite-melting=Использование [fluid=steam] и [fluid=angels-liquid-nitric-acid] для помощи в неэффективной плавке [item=sphalerite] в [fluid=angels-liquid-molten-iron] без образования побочных продуктов.
tetrahedrite-melting=Использование [fluid=steam] и [fluid=angels-liquid-nitric-acid] для помощи в неэффективной плавке [item=tetrahedrite] в [fluid=angels-liquid-molten-copper] без образования побочных продуктов.
solar-matrix=Более продвинутая и эффективная солнечная панель. Её фотоэлементы обработаны [fluid=angels-gas-nitrogen]. Всё ещё бесполезна на [planet=paracelsin] из-за отсутствия яркого солнечного света.
accumulator-v2=Более продвинутый аккумулятор. В батареях используется [fluid=angels-liquid-nitric-acid].
vaterite-formation=Воссоздавая первозданные условия [planet=paracelsin] на [entity=electrochemical-plant], мы можем обрабатывать [item=stone] газом [fluid=angels-gas-nitrogen], используя [item=vaterite] в качестве катализатора, чтобы получить шанс вырастить его в большем количестве.

[entity-description]
solar-matrix=Более продвинутая и эффективная солнечная панель. Её фотоэлементы обработаны [fluid=angels-gas-nitrogen]. Всё ещё бесполезна на [planet=paracelsin] из-за отсутствия яркого солнечного света.

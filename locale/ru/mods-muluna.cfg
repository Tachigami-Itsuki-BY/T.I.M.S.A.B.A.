[mod-setting-description]
override-space-connection=Изменяет маршруты от Наувиса к Вулканусу, Глебе и Фулгоре так, чтобы они проходили через Мулуну. Это заставит вручную сбросить полет для каждой платформы на их пути к Наувису.
space-science-pack-output=Изменяет выход обоих рецептов космического исследовательского пакета.
enable-muluna-satellite-radar=Может вызвать проблемы с производительностью или создать условия для вредительства (гриферства) при включении на многопользовательских серверах.
muluna-hardcore-restrict-crusher=Ограничивает рецепты «Дробилка» и «Дробилка 2» только Мулуной, а также добавляет алюминиевые пластины в рецепт обычной дробилки.
muluna-hardcore-restrict-asteroid-collector=Ограничивает рецепт сборщика астероидов только Мулуной, а также добавляет алюминиевые пластины в этот рецепт.
muluna-change-quality-science-pack-drain=Заданную для Мулуны скорость потребления исследовательских пакетов можно отключить для сохранения совместимости с другими модами.
muluna-hardcore-remove-steam-furnaces=Удаляет строения «Каменная паровая печь» и «Стальная паровая печь» из игры. Повышает реализм, но значительно усложняет старт на Мулуне без внешних поставок.
muluna-hardcore-remove-starting-cargo-pods=Убирает стартовые грузовые капсулы Мулуны. Это делает невозможным развитие базы на Мулуне без внешних поставок.
muluna-hardcore-lock-recipe-x=Стимулирует создание небольшого производства космической науки до запуска первой ракеты, блокируя технологию за космическими исследовательскими пакетами.
muluna-easy-simple-wood-gasification=Удваивает выход продукции на каждом этапе цепочки газификации древесины, но запрещает использование модулей продуктивности.
muluna-hardcore-classic-wood-gasification=В версии 2.0 из цепочки газификации древесины на Мулуне был удален один этап (Измельченная древесина). Данная опция возвращает этот этап в игру.
muluna-easy-vanilla-rocket-part-costs=По умолчанию Мулуна удваивает стоимость всех рецептов компонентов ракет, которые на ней не используются, удваивает максимальное количество модулей для ракетной шахты и добавляет десять новых уровней технологий продуктивности компонентов ракет, доступных после открытия космической науки. Эта опция отменяет данные изменения.
muluna-easy-wood-gasification-productivity=Снижает сложность производства нефтепродуктов на Мулуне, добавляя технологию, которая повышает продуктивность газификации древесины. Рекомендуется при старте на Мулуне.
muluna-graphics-enable-footstep-animations=Частицы шагов потребляют около 0.01 мс на игRoc's на Мулуне за одно обновление. На серверах с огромным онлайном это может привести к проблемам с производительностью.
muluna-easy-simple-nanofoamed-polymers=Упрощает цепочку крафта нанопенистых полимеров: порча диффузного пластика начинается в момент завершения крафта, а не в момент его начала.
muluna-easy-revert-changes-to-space-platform-technology=Также отменяет изменения в технологии двигателей космических платформ, делая стандартные рецепты топлива/окислителя для двигателей доступными до посещения Мулуны.
muluna-interstellar-science-pack-dynamic-packs-required=Для изучения потребуется половина (с округлением в большую сторону) от всех планетарных исследовательских пакетов, которые участвуют в открытии технологии [technology=interstellar-science-pack], что заменит жестко прописанное значение.
muluna-alternative-automation-pack-recipe=Позволяет полностью исследовать ранние технологии на Мулуне. Всегда включено при старте на Мулуне.
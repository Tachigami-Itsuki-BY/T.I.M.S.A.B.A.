[entity-description]
muluna-vacuum-heating-tower=Вырабатывает тепло из базового и улучешного топлива с ещё большей эффективностью. Можно использовать на любых поверхностях, но расходует [fluid=angels-gas-oxygen] и производит [fluid=angels-gas-carbon-dioxide].
muluna-cycling-steam-turbine=Более эффективная паровая турбина, которая позволяет конденсировать часть отработанного пара обратно в воду для повторного нагрева. Предпочитает пар более высокого качества.\n[fluid=steam] Макс. температура: 915 °C\n[fluid=cooled-steam] Мин. температура: 100 °C

[technology-name]
muluna-aluminum-processing=Обработка алюминия
muluna-silicon-processing=Обработка кремния
muluna-greenhouses=Теплица

interstellar-science-pack=Межзвёздный научный пакет

[technology-description]
muluna-greenhouses=Специализированные теплицы могут производить [item=wood] и [fluid=angels-gas-oxygen] гораздо быстрее, чем химические заводы, но перед использованием в них необходимо посадить [item=angels-solid-tree].
muluna-wood-cultivation=Выращивание [item=wood] в [entity=muluna-greenhouse-wood]. Легко настроить, но процесс идёт медленно. Расходует [fluid=angels-gas-carbon-dioxide] и производит [fluid=angels-gas-oxygen].
muluna-anorthite-processing=Производство алюминия из [item=anorthite-chunk], который можно использовать в качестве [item=rocket-fuel] и как источник для создания [item=aluminum-cable].
muluna-regolith-digging=Разместите буровую установку в любом месте на [planet=muluna] вдали от ресурсов, чтобы начать добычу реголита.

[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna] - это бескрайние просторы серой породы. На поверхности в изобилии встречаются метеориты, богатые металлами, топливом и водой, хотя для получения этих ресурсов необходимо сначала измельчить метеориты в [entity=crusher].\n[entity=metallic-asteroid-chunk]: основной источник [item=iron-ore]. [entity=carbonic-asteroid-chunk]: основной источник химического топлива в виде [item=coal].\n[entity=oxide-asteroid-chunk]: основной источник [item=ice]. [entity=anorthite-chunk]: основной источник [item=aluminum-cable] и [item=rocket-fuel].\nТопливо не может быть сожжено без искусственного источника [fluid=oxygen]. Нефтепродукты не могут быть произведены здесь без технологий, выходящих за рамки нашего нынешнего понимания.


[mod-setting-description]
setting-early-sintering-oven=Allows the Sintering Oven to be unlocked earlier in the technology tree.
setting-no-spoilage=Disables spoilage for all items, preventing them from turning into spoiled priority.
setting-early-cliff-explosives=Allows the Cliff Explosives to be unlocked earlier in the technology tree.
setting-science-pack-nostalgia=Instead of replacing old models of science packs with the newer model, this replaces new model science packs with the old model.
setting-multi-building=Allows combining Steam Engines, Turbines, Solar Panels, and Accumulators into compact 2x and 4x multi-block variants.
setting-dynamic-underground-belts=Underground belts span up to N tiles but consume standard belts for the distance covered.
setting-dynamic-pipe-to-ground=Pipe-to-Ground span up to N tiles but consume standard pipes for the distance covered.
setting-real-incineration=If enabled, you can only incinerate things that burn in real life.
setting-rebalance-belts-and-pipes=If enabled, the range of underground belts and pipes will be fixed.
setting-flow-control-new=Adds pipes with restricted connections to easily build parallel pipelines.
setting-defrost-multiplier=Determines the multiplier for the defrost time of the frozen item variant. The base value is derived from the spoilage time of the original item. The maximum value (720) allows an item with a 12-hour baseline spoilage time to be stored frozen for up to one year of real time.

setting-za-horogon-extra-science-packs=Adds cryogenic/promethium packs to MK5-MK6 technologies, metallurgic/electromagnetic packs to plasma weapons, and electromagnetic packs after MK3 for batteries and laser technologies.
setting-zb-horogon-high-tier-recipes=Adds Space Age materials to high tier batteries, solar panels, turbines, reactors and modules. Science packs are added to technologies, not recipes.
setting-zc-horogon-module-planet-lock=Adds planet-themed Space Age science packs to higher tier module technologies.
setting-zd-horogon-tier-technology-costs=Legacy switch kept for old saves. Horogon balance now always applies the category-specific MK1-MK6 multipliers below.
setting-zi-horogon-mech-armor-technology-cost=Fixed cost for the mech armor technology. If the setting below is enabled, power armor MK5-MK1 each cost 75% of the previous tier.
setting-zj-horogon-power-armor-chain-from-mech=When enabled, power armor costs are derived from mech armor: MK5 = 75%, MK4 = 75% of MK5, and so on down to MK1.


[entity-description]
muluna-vacuum-heating-tower=Generates heat from base and advanced fuels with an even higher efficiency. Can be used on all surfaces, but consumes [fluid=angels-gas-oxygen] and produces [fluid=angels-gas-carbon-dioxide].
muluna-cycling-steam-turbine=A more efficient steam turbine that allows some consumed steam to be condensed back into water for reheating. Prefers higher quality steam.\n[fluid=steam] Max. temperature: 915 °C\n[fluid=cooled-steam] Min. temperature: 100 °C


[technology-description]
muluna-greenhouses=Dedicated greenhouses can produce [item=wood] and [fluid=angels-gas-oxygen] much faster than chemical plants, but they must be seeded with [item=angels-solid-tree] before use.
muluna-wood-cultivation=Cultivation of [item=wood] in a [entity=muluna-greenhouse-wood]. Easy to set up, but slow. Consumes [fluid=angels-gas-carbon-dioxide] and produces [fluid=angels-gas-oxygen].
muluna-anorthite-processing=Production of aluminum from [item=anorthite-chunk], which can be used as [item=rocket-fuel] and a source for [item=aluminum-cable].
muluna-regolith-digging=Place a mining drill anywhere on [planet=muluna] without nearby resources to begin digging for regolith.

[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna] is an endless expanse of grey rock. Meteorites are plentiful on the surface, and they are rich in metals, fuel and water, though reaching those resources require the meteorites be crushed in [entity=crusher] first.\n[entity=metallic-asteroid-chunk]: Primary source of [item=iron-ore]. [entity=carbonic-asteroid-chunk]: Primary source of chemical fuel in the form of [item=coal].\n[entity=oxide-asteroid-chunk]: Primary source of [item=ice]. [entity=anorthite-chunk]: Primary source of [item=aluminum-cable] and [item=rocket-fuel].\nFuel can not be burned without an artificial source of [fluid=oxygen]. Oil products can not be made here without technologies beyond our current understanding.
[technology-description]
lichen-cultivation=It seems like [item=acidophile-lichen]s feed upon the energy released by [item=chlorine-salts] when the [fluid=angels-gas-chlorine] is removed from the metals. By placing the salts on an [tile=acidophile-lichen] we can reliably obtain metals on the planet. Their colonies do appear to release extremely strong corrosives in the air which will be a risk for the factory.
lead-processing=Place the [item=cotunnite] extracted from [fluid=muriatic-solution] on [tile=acidophile-lichen] to free [item=bob-lead-ore] contained inside it and to begin processing this corrosion resistant metal.
advanced-lead-processing=Via [item=chloric-fuel] we can begin a more advanced processing chain for [item=bob-lead-ore] inside a specialized [entity=smelting-plant]. Alongside that, develop lead pellets and heavy shotgun shells.
offworld-chlorane-production=Processes to obtain and process [fluid=angels-gas-hydrogen-chloride] outside of [planet=muria].
chlorane-explosives=Alternate recipe for [item=explosives], utilizing the properties of [fluid=angels-gas-hydrogen-chloride].

[tile-description]
muriatic-solution=Solution of [fluid=angels-gas-chlorine] and [fluid=hydronium]. Chunks of [item=cotunnite] are scattered through it. Resources can be thrown into it to be destroyed.

[tips-and-tricks-item-description]
muria-briefing=[planet=muria] is a highly toxic world rich in life. [tile=acidophile-lichen] and [entity=eschatotaxite] fungi cover the planet's dry lands while lakes of [fluid=muriatic-solution] cover the rest of the surface. [entity=chlorine-salt-deposit] and [item=cotunnite] are salts of [fluid=angels-gas-chlorine] which can be found in different ways on the surface. Both can be purified into ores via the [entity=fungicultural-tower] and the lichen. Beware of the corrosive air released by lichen. Eschatotaxites can protect your factory from its damage. 
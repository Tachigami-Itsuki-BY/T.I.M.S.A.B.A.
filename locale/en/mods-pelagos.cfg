[tips-and-tricks-item-description]
pelagos-briefing-main=[planet=pelagos] is an insular world rich in tropical [entity=coconut-palm], [entity=angels-gas-methane], [entity=iron-ore], and minor lifeforms, including [entity=fish], and [entity=copper-biter-spawner] (which are source of copper here). Harvest coconuts and process them into oil, sealant, and biofuels, experiment with fermentation, and use high-temperature [entity=calciner] to refine raw materials.
pelagos-calciners=[entity=calciner] allows high-temperature purification and transformation of raw materials into refined minerals. \nThe Calciner consumes any fluid with a "Fuel Value", such as [fluid=crude-oil], [fluid=angels-gas-methane], [fluid=coconut-oil], or [fluid=angels-gas-ethanol] (and more). \nThe higher the fuel value of the fluid, the less is needed to burn and process materials. Use it for coconut husks, wood, fish, or other resources that require intensive processing.
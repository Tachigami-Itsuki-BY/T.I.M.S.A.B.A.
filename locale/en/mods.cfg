[string-mod-setting-description]
mdrn-chute-mode-none=The Skat loader will not be available.
mdrn-chute-mode-basic-limited=The Skat loader will be available (Input).
mdrn-chute-mode-basic=The Skat loader will be available (Input/Output).
mdrn-chute-mode-filtered=The Skat loader will be available (Input/Output + Filter).
mdrn-chute-direction-input=The Skat loader can only load items from a belt into a container.
mdrn-chute-direction-input-output=The Skat loader can load from a belt into a container or unload from a container onto a belt.
[mod-setting-name]
mdrn-chute-mode=Enable Skat loader
mdrn-chute-direction=Skat loader direction

[mod-setting-description]
mdrn-chute-mode=Allows you to enable on the Skat loader and configure it.
mdrn-chute-direction=Controls whether the Skat loader is limited to only loading items into containers, or also unload onto belts. This only applies if Skat loader mode is set to (Input/Output).


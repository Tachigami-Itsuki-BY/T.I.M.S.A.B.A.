[mod-name]
TIMSABA=○🌐Project T.I.M.S.A.B.A. (Angel's, Bob's and Space Age)

AsteroidBelt=○🌐Asteroid Belt

[mod-description]
TIMSABA=Tachigami Itsuki Modpack for Space Age, Bob's and Angel's. \nSeamless integration of Space Age with Angel's & Bob's mods. \nUnified balance, new entities, items, fluids, recipes, and technologies, plus updated icons.

AsteroidBelt=Adds an asteroid belt, dividing the solar system into inner planets, and the outer planets. Inner planets are Nauvis, Vulcanus, Fulgora, Gleba (Mods: Castra, Rubia, Moshine, Igrys, Corrundum). Outer planets are Aquillo, (Mods: Maraxsis, Tenebris, Cubium, Secretas & Frozeta, Paracelsin). The edges of the belt are very resource rich. Traveling throuht the belt is a short but difficult trip, required either a well armed and armored vessel or one that can moderate it's speed.

Unichest=Linked chests with globally shared contents, by item type. Set the item filter in the GUI and the contents will be shared among all other unichests with the same filter. Includes convenience tools to set the filter based on connected assemblers/miners/furnaces/etc (either by shift-click paste or provided selection tool). Pairs well with Unipipe for a logistics-free experience!

Unipipe=Linked pipes that fill or extract from a single globally linked storage, one per fluid type. Set the fluid type in the GUI or automatically based on pipe connections and the contents will be shared among all other unipipes with that fluid type. Pairs well with Unichest mod and its included selection tool for setting fluid filters.

squeak-through-2=Squeak through entities that you can't walk between normally.\nA highly configurable and more compatible version of Squeak Through, written from scratch.

StatsGui=Displays various statistics, such as biter evolution, playtime, and more. Blends in with the game's FPS/UPS indicator. Similar to EvoGUI.

vulcanus-sulfuric-bacteria=Reconstitute wood on Vulcanus by cultivating bacteria found around sulfuric geysers

tile-upgrade-planner-muluna=Adds an upgrade planner that can be used to upgrade tiles. Fork designed to work with "Muluna, Moon of Nauvis."

VehicleSnap=Smoothly snaps movement angle when driving vehicles.

VoidChestInstant=Repurposed infinity chest instantly destroying anything placed inside as UPS friendly as possible. Can't be used to generate items.

Telogistics=Teleport items from planet to planet, as long as you can spare the electricity.

flow-config=More control over pipes. Similar results as Flow Control, but with the GUI and hotkeys of Inserter Configuration instead of unique items per bend. Run pipes with different fluids next to each other!


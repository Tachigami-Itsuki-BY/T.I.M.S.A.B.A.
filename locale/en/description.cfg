[entity-description]
heat-pipe-1=The heat pipe can transport heat over longer distances and connect devices which produce and use heat.\nMax. temperature 1000°C.
heat-pipe-2=The heat pipe can transport heat over longer distances and connect devices which produce and use heat.\nMax. temperature 1250°C.
heat-pipe-3=The heat pipe can transport heat over longer distances and connect devices which produce and use heat.\nMax. temperature 1500°C.
heat-pipe-4=The heat pipe can transport heat over longer distances and connect devices which produce and use heat.\nMax. temperature 2000°C.

muluna-vacuum-heating-tower=Generates heat from chemical fuels with an even higher efficiency. Can be used on all surfaces, but consumes [fluid=angels-gas-oxygen] and produces [fluid=angels-gas-carbon-dioxide].
solar-matrix=A more advanced and efficient solar panel. The solar cells are treated with [fluid=angels-gas-nitrogen]. It is still useless on [planet=paracelsin] due to the lack of strong sunlight
accumulator-v2=A more advanced accumulator. The batteries use [fluid=angels-liquid-nitric-acid].

[recipe-description]
muluna-regolith-digging=Place a mining drill anywhere on [planet=muluna] without nearby resources to begin digging for regolith. Discard unwanted [item=angels-stone-crushed] by either burying it in lunar dirt with an inserter or placing it as a tile. Other unwanted items can also be buried in a similar manner.
nitric-acid-plastic=Obtain plastic from [fluid=angels-liquid-nitric-acid] and other materials.
nitric-acid-rocket-fuel=Convenient use of [fluid=angels-liquid-nitric-acid].
solid-fuel-from-nitrogen=Convenient use of [fluid=angels-gas-nitrogen].
vaterite-processing=Obtain [item=angels-solid-carbon] and [item=calcite] by processing large amount of [item=vaterite] in [fluid=water].
zinc-leaching=Leach the [fluid=zinc-concentrate] using [fluid=angels-liquid-nitric-acid].
sphalerite-melting=Use [fluid=steam] and [fluid=angels-liquid-nitric-acid] to help with the inefficient melting of [item=sphalerite] into [fluid=angels-liquid-molten-iron], without leaving byproducts.
tetrahedrite-melting=Use [fluid=steam] and [fluid=angels-liquid-nitric-acid] to help with the inefficient melting of [item=tetrahedrite] into [fluid=angels-liquid-molten-copper], without leaving byproducts.
solar-matrix=A more advanced and efficient solar panel. The solar cells are treated with [fluid=angels-gas-nitrogen]. It is still useless on [planet=paracelsin] due to the lack of strong sunlight
accumulator-v2=A more advanced accumulator. The batteries use [fluid=angels-liquid-nitric-acid].
vaterite-formation=By replicating the ancestral properties of [planet=paracelsin] in an [entity=electrochemical-plant] we can treat [item=stone] with [fluid=angels-gas-nitrogen] using [item=vaterite] as a catalyst to have a chance of generating more.

[technology-description]
muluna-greenhouses=Dedicated greenhouses can produce [item=wood] and [fluid=angels-gas-oxygen] much faster than chemical plants, but they must be seeded with [item=angels-solid-tree] before use.
muluna-wood-cultivation=Cultivation of [item=wood] in a [entity=chemical-plant]. Easy to set up, but slow. Consumes [fluid=angels-gas-carbon-dioxide] and produces [fluid=angels-gas-oxygen].
planet-discovery-paracelsin=A highly cryovolcanically active frozen wasteland. Lakes of [fluid=angels-gas-nitrogen] cover the surface, flowing from an underground ocean. [entity=water-cryovolcano]es dot the surface alongside veins of [item=tetrahedrite] and [item=sphalerite], essential for the extraction of [item=bob-zinc-ore]. [item=vaterite] is also present in small veins. Anything built on the planet must be constantly kept warm or it will freeze and all unwanted byproducts of zinc extraction must be disposed of.
zinc-extraction=Process [fluid=dirty-zinc-solution] into [item=bob-zinc-ore] via various processes.
zinc-piping=Sturdier and insulated pipes made out of [item=bob-zinc-plate]s. Won't freeze on cold surfaces, like [planet=paracelsin] or [planet=aquilo], and can transport fluids underground for increased lengths.
galvanized-steel=Applying [item=bob-zinc-ore] to plates of [item=steel-plate]s allows them to become stronger and resistant to corrosion.
[tips-and-tricks-item-description]
gleba-briefing=[planet=gleba] is a humid swampy planet with rich exotic vegetation that can be cultivated using [entity=agricultural-tower] and processed in the [entity=biochamber].\nYou can't find [entity=angels-ore1], [entity=angels-ore2], [entity=angels-ore3], [entity=angels-ore4], [entity=angels-ore5], [entity=angels-ore6], [entity=coal], [entity=crude-oil], [entity=angels-natural-gas], and [entity=angels-fissure], there but plants provide alternative ways of producing needed items.\nMost of the items from agriculture come with the added challenge of spoiling over time. Even [item=agricultural-science-pack] has limited lifespan and can't be stockpiled.\nLarge 5-legged creatures are native species of this planet. [entity=solar-panel] is weaker but still usable.
[mod-description]
SpidertronPatrols=Send spidertrons on patrols and automatically load and unload them using docks. Adds mid-game spiderling to allow the new features to be used sooner.

SpidertronEnhancements=Some simple features to make your life easier whilst using a spidertron:\n - Enter a vehicle without leaving your spidertron\n - Quickly toggle between engineer and spidertron\n - Use spidertron remote pathfinder to navigate around lakes\n - Pipette remotes by hovering over spidertrons\n - Directly open the inventory of a vehicle that you are currently driving.


angelsaddons-storage=This mod adds a variety of angels silos, warehouses and pressure tanks independently of angels modset.
angelsaddons-storage-notes=\n\n[font=default-bold]NOTES[/font]: Silos are 4x4 storage boxes with 240 slots (logistics versions vary)\n[font=default-bold]NOTES[/font]: Warehouses are 6x6 storage boxes with 960 slots (logistics versions vary)\n[font=default-bold]NOTES[/font]: Fluid storage tanks contain larger volumes than vanilla

angels-ore-sorting=The ore sorting facility is a giant advanced gravity separator, centrifuge, and grate separator which filters the refined ore into its separate parts (or metals) for smelting into high-quality metals.
angels-ore-sorting-vanilla=\n\nThe sorting facility turns the 4 compound ores of various refined qualities into smeltable ore, nuggets, and pebbles yielding a different mixture. The nuggets and pebbles can be further converted into more metal ore. The higher-grade purified ore will create higher quantities of smeltable ore. Purified ore also generates metal slag.
angels-ore-sorting-overhaul=\n\nThe sorting facility turns the 6 main ores of various refined qualities into a variety of metal ores:\n4[img=item/angels-ore4-crushed] Crushed ore become 2 primary ore, 1 secondary ore, as well as 1 [item=angels-slag].\n8[img=item/angels-ore4-chunk] Ore Chunks become 4 primary ore, 2 secondary ore, and 2 tertiary ores, as well as 1 [item=angels-slag].\n8[img=item/angels-ore4-crystal] Ore Crystals become 4 primary ore, 2 secondary ore, and 3 tertiary ores, as well as 1 [item=angels-slag].\n8[img=item/angels-ore4-pure] Purified Ore become 4 primary ore, 2 secondary ore, and 4 tertiary ores.\n\nYou can see what each ore will yield if you mouse over the ore on the ground.\nThe primary and secondary ores are listed below:\n- [item=angels-ore1] and [item=angels-ore2]: Primary [item=iron-ore], Secondary [item=copper-ore]\n- [item=angels-ore3] and [item=angels-ore4]: Primary [item=copper-ore], Secondary [item=iron-ore]\n- [item=angels-ore6]: Primary [item=bob-tin-ore], Secondary [item=bob-quartz]\n- [item=angels-ore5]: Primary [item=bob-lead-ore], Secondary [item=bob-nickel-ore]
angels-ore-sorting-bobs=\n\nThe sorting facility turns the 6 main ores of various refined qualities into a variety of metal ores:\n4[img=item/angels-ore4-crushed] Crushed ore become 2 primary ore, 1 secondary ore, as well as 1 [item=angels-slag].\n8[img=item/angels-ore4-chunk] Ore Chunks become 4 primary ore, 2 secondary ore, and 2 tertiary ores, as well as 1 [item=angels-slag].\n8[img=item/angels-ore4-crystal] Ore Crystals become 4 primary ore, 2 secondary ore, and 3 tertiary ores, as well as 1 [item=angels-slag].\n8[img=item/angels-ore4-pure] Purified Ore become 4 primary ore, 2 secondary ore, and 4 tertiary ores.\n\nYou can see what each ore will yield if you mouse over the ore on the ground.\nThe primary and secondary ores are listed below:\n- [item=angels-ore1] and [item=angels-ore2]: Primary [item=iron-ore], Secondary [item=copper-ore]\n- [item=angels-ore3] and [item=angels-ore4]: Primary [item=copper-ore], Secondary [item=iron-ore]\n- [item=angels-ore6]: Primary [item=bob-tin-ore], Secondary [item=bob-quartz]\n- [item=angels-ore5]: Primary [item=bob-lead-ore], Secondary [item=bob-nickel-ore]

angels-air-filtering-notes=\n\n[font=default-bold]NOTES[/font]: Earth’s atmosphere consists of roughly 21% Oxygen and 79% Nitrogen.\nThis mod uses slightly different proportions.
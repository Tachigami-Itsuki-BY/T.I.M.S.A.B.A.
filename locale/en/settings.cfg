[mod-setting-description]
setting-early-sintering-oven=Allows the Sintering Oven to be unlocked earlier in the technology tree.
setting-no-spoilage=Disables spoilage for all items, preventing them from turning into spoiled priority.
setting-early-cliff-explosives=Allows the Cliff Explosives to be unlocked earlier in the technology tree.
setting-science-pack-nostalgia=Instead of replacing old models of science packs with the newer model, this replaces new model science packs with the old model.
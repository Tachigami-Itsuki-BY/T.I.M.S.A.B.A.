[technology-description]
s1_algea_culturing=The various gases inside of Vesta's atmosphere are also home to plenty of microbial species. Traces of these microbes can be harvested from the gases, and with careful cultivation, can be host to our only method of obtaining resources.
s1_dueterium=Opens the possibility of extracting hydrogen isotopes from Vesta's atmosphere: Deuterium and Tritium.
s1_algea_extracting=Vesta's algae are incredibly potent and well evolved. If fed certain gases and heat, it will change its composition and grow metallic compounds similar to Gleba's bacterial microbes.
s1_gas_manipulation_science_pack=Research into various gas related technology enhancements.
s2_plateworkings=Hydrogen and oxygen make for great catalysts when smelting our ores. We can increase the yield of our basic metals like iron or copper if we use two gases in combustion.
s2_fusion_enhancements=Opens the possibility of transmitting plasma over longer distances.
ske_fusion_thruster=Our thrusters can be further upgraded, now utilizing the power of plasma to push our platforms faster and further than ever before on a more energy efficient power source.

iridium-smelting-1=Advanced processing steps for the production of iridium.
iridium-smelting-2=Additional processing steps to reduce material loss.
iridium-smelting-3=Additional processing steps to reduce material loss.
[technology-description]
planet-discovery-paracelsin=A highly cryovolcanically active frozen wasteland. Lakes of [fluid=nitrogen-liquid] cover the surface, flowing from an underground ocean. [entity=water-cryovolcano]es dot the surface alongside veins of [item=tetrahedrite] and [item=sphalerite], essential for the extraction of [item=bob-zinc-ore]. [item=vaterite] is also present in small veins. Anything built on the planet must be constantly kept warm or it will freeze and all unwanted byproducts of zinc extraction must be disposed of.
zinc-extraction=Allows the production of various products from zinc.
galvanized-steel=Applying [fluid=angels-liquid-molten-zinc] to plates of [item=steel-plate]s allows them to become stronger and resistant to corrosion.

[space-location-description]
paracelsin=A highly cryovolcanically active frozen wasteland. Lakes of [fluid=nitrogen-liquid] cover the surface, flowing from an underground ocean. [entity=water-cryovolcano]es dot the surface alongside veins of [item=tetrahedrite] and [item=sphalerite], essential for the extraction of [item=bob-zinc-ore]. [item=vaterite] is also present in small veins. Anything built on the planet must be constantly kept warm or it will freeze and all unwanted byproducts of zinc extraction must be disposed of.

[tile-description]
nitrogen-lake=Lakes of liquid [fluid=nitrogen-liquid] that cover the surface of [planet=paracelsin]. They're shallow enough for [tile=landfill] to be placed on top, unlike the [tile=ammoniacal-ocean] of [planet=aquilo].

[tips-and-tricks-item-description]
paracelsin-briefing=[planet=paracelsin] is a frozen wasteland like [planet=aquilo] but, unlike the world of ammonia, it has a solid surface. Below the ground the planet hosts a large ocean of [fluid=nitrogen-liquid], which flows on the surface into [tile=nitrogen-lake]s. The planet is rich in [item=sphalerite] and [item=tetrahedrite], compounds of [item=zinc], and [item=vaterite]. [entity=water-cryovolcano]es can also be found dotting the surface.
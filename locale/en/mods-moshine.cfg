[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine] is a hot volcanic planet, abundant in [item=angels-solid-sand] (that will unlock [item=silicon] and [item=bob-glass]) and [item=neodymium-ore] (a good base to make [item=magnet]). It's so hot that it's hard to build an [entity=accumulator], but fortunately, hot [entity=steam-geyser] are found all over. It is advised to bring at least a [entity=foundry] to be able transform [fluid=lava] from lava lakes.

